   CAPTURE D'ERREURS

window.addEventListener("error", e => {

/* ============================================================
   PROXY CORS (multi-fallback)
   ============================================================ */
const PROXIES = [
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`
];

async function P(url) {
  for (const proxy of PROXIES) {
    try {
      const r = await fetch(proxy(url));
      if (r.ok) return r;
    } catch {}
  }
  throw new Error("proxy failed");
}

/* ============================================================
   APIs OFFICIELLES (pas de clé)
   ============================================================ */
async function vGitHub(u) {
  try {
    const r = await fetch(`https://api.github.com/users/${u}`);
    if (r.status === 200) {
      const j = await r.json();
      return { exists:true, confidence:1, reason:`${j.public_repos} repos · ${j.followers} followers` };
    }
    return { exists:false, confidence:1, reason:"404" };
  } catch { return { exists:false, confidence:0, reason:"erreur réseau" }; }
}

async function vReddit(u) {
  try {
    const r = await fetch(`https://www.reddit.com/user/${u}/about.json`);
    if (r.status !== 200) return { exists:false, confidence:1, reason:"404" };
    const j = await r.json();
    if (j?.data?.name) {
      return { exists:true, confidence:1, reason:`karma: ${j.data.link_karma + j.data.comment_karma}` };
    }
    return { exists:false, confidence:1, reason:"pas de donnée" };
  } catch { return { exists:false, confidence:0, reason:"erreur réseau" }; }
}

async function vGitLab(u) {
  try {
    const r = await fetch(`https://gitlab.com/api/v4/users?username=${u}`);
    if (r.status !== 200) return { exists:false, confidence:1, reason:"404" };
    const j = await r.json();
    if (Array.isArray(j) && j.length > 0) {
      return { exists:true, confidence:1, reason:j[0].name || j[0].username };
    }
    return { exists:false, confidence:1, reason:"liste vide" };
  } catch { return { exists:false, confidence:0, reason:"erreur réseau" }; }
}

/* ============================================================
   CHECKER HTML avec signatures positives/négatives
   ============================================================ */
function htmlCheck(options) {
  const { negatives = [], positives = [], minScore = 0.4 } = options;
  return async (u) => {
    try {
      const r = await P(u);
      if (r.status !== 200) return { exists:false, confidence:1, reason:`HTTP ${r.status}` };
      const html = await r.text();
      const low = html.toLowerCase();

      for (const n of negatives) {
        if (low.includes(n.toLowerCase())) {
          return { exists:false, confidence:0.9, reason:`marqueur négatif` };
        }
      }

      let found = 0;
      const hits = [];
      for (const p of positives) {
        if (low.includes(p.toLowerCase())) { found++; hits.push(p); }
      }

      const ratio = positives.length > 0 ? found / positives.length : 0.5;
      return {
        exists: ratio >= minScore,
        confidence: Math.min(0.5 + ratio * 0.4, 0.9),
        reason: hits.length ? `${hits.slice(0,2).join(", ")}` : `${found}/${positives.length} signaux`
      };
    } catch {
      return { exists:false, confidence:0, reason:"proxy inaccessible" };
    }
  };
}

/* ============================================================
   EMAIL — MD5 pur JS
   ============================================================ */
function md5(str) {
  function rotl(n, s) { return (n << s) | (n >>> (32 - s)); }
  function add(a, b) { return (a + b) & 0xFFFFFFFF; }
  const bytes = new TextEncoder().encode(str);
  const K = [];
  for (let i = 0; i < 64; i++) K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296);
  const S = [7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,
             5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,
             4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,
             6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  const orig = bytes.length;
  const ml = orig * 8;
  const padded = new Uint8Array(((orig + 8) >> 6 << 6) + 64);
  padded.set(bytes);
  padded[orig] = 0x80;
  const dv = new DataView(padded.buffer);
  dv.setUint32(padded.length - 8, ml, true);
  dv.setUint32(padded.length - 4, Math.floor(ml / 4294967296), true);
  let a = 0x67452301, b = 0xEFCDAB89, c = 0x98BADCFE, d = 0x10325476;
  for (let i = 0; i < padded.length; i += 64) {
    const M = [];
    for (let j = 0; j < 16; j++) M[j] = dv.getUint32(i + j * 4, true);
    let [A,B,C,D] = [a,b,c,d];
    for (let j = 0; j < 64; j++) {
      let F, g;
      if (j < 16)      { F = (B & C) | (~B & D);  g = j; }
      else if (j < 32) { F = (D & B) | (~D & C);  g = (5*j + 1) % 16; }
      else if (j < 48) { F = B ^ C ^ D;           g = (3*j + 5) % 16; }
      else             { F = C ^ (B | ~D);        g = (7*j) % 16; }
      F = add(add(add(F, A), K[j]), M[g]);
      A = D; D = C; C = B;
      B = add(B, rotl(F, S[j]));
    }
    a = add(a, A); b = add(b, B); c = add(c, C); d = add(d, D);
  }
  const toHex = n => n.toString(16).padStart(8, "0").match(/../g).reverse().join("");
  return toHex(a) + toHex(b) + toHex(c) + toHex(d);
}

/* ============================================================
   CHECKERS EMAIL
   ============================================================ */
const DISPOSABLE_DOMAINS = [
  "mailinator.com","guerrillamail.com","10minutemail.com","tempmail.com",
  "throwaway.email","yopmail.com","maildrop.cc","getnada.com",
  "sharklasers.com","guerrillamailblock.com","temp-mail.org","fakeinbox.com",
  "trashmail.com","dispostable.com","mailnesia.com","mailcatch.com",
  "tempr.email","discard.email","spamgourmet.com","mytemp.email"
];

async function checkMX(domain) {
  try {
    const url = `https://dns.google/resolve?name=${encodeURIComponent(domain)}&type=MX`;
    const r = await fetch(url);
    if (!r.ok) return { hasMX: false, records: [], reason: `DNS: HTTP ${r.status}` };
    const j = await r.json();
    const records = (j.Answer || []).filter(a => a.type === 15).map(a => a.data);
    return { hasMX: records.length > 0, records, reason: records.length > 0 ? `${records.length} serveur(s) MX` : "aucun MX" };
  } catch {
    return { hasMX: false, records: [], reason: "DNS inaccessible" };
  }
}

async function checkHIBP(email) {
  try {
    const url = `https://haveibeenpwned.com/api/v3/breachedaccount/${encodeURIComponent(email)}?truncateResponse=true`;
    const r = await P(url);
    if (r.status === 404) return { exists: false, breaches: [], reason: "aucune fuite connue" };
    if (r.status === 200) {
      const data = await r.json();
      return { exists: true, breaches: data.map(b => b.Name), reason: `${data.length} fuite(s) connue(s)` };
    }
    return { exists: false, breaches: [], reason: `HIBP: HTTP ${r.status}` };
  } catch {
    return { exists: false, breaches: [], reason: "HIBP inaccessible" };
  }
}

async function checkGravatar(email) {
  try {
    const hash = md5(email.trim().toLowerCase());
    const url = `https://www.gravatar.com/avatar/${hash}?d=404`;
    const r = await P(url);
    if (r.status === 200) {
      const txt = await r.text();
      return { exists: txt.length > 0, reason: txt.length > 0 ? "avatar Gravatar public trouvé" : "aucun Gravatar" };
    }
    return { exists: false, reason: "aucun Gravatar public" };
  } catch {
    return { exists: false, reason: "vérification impossible" };
  }
}

async function checkEmailRep(email) {
  try {
    const url = `https://emailrep.io/${encodeURIComponent(email)}`;
    const r = await fetch(url);
    if (!r.ok) return null;
    const j = await r.json();
    return {
      reputation: j.reputation || "inconnue",
      suspicious: j.suspicious || false,
      profiles: j.details?.profiles || [],
      breaches: j.details?.breaches || 0,
      firstSeen: j.details?.first_seen || null,
      lastSeen: j.details?.last_seen || null
    };
  } catch {
    return null;
  }
}

/* ============================================================
   RENDU EMAIL
   ============================================================ */
async function renderEmail(email) {
  const out = document.getElementById("out");
  out.innerHTML = `<div class="status" id="status">analyse…</div>`;

  const valid = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
  if (!valid) {
    out.innerHTML = `<div class="none">format d'email invalide</div>`;
    return;
  }

  const domain = email.toLowerCase().split("@")[1];
  const local = email.toLowerCase().split("@")[0];

  const isDisposable = DISPOSABLE_DOMAINS.includes(domain);
  const isRole = /^(contact|info|admin|support|sales|hello|noreply|no-reply|postmaster|webmaster|help|billing|team|office)$/i.test(local);

  document.getElementById("status").textContent = "DNS…";
  const mx = await checkMX(domain);

  document.getElementById("status").textContent = "Gravatar…";
  const gravatar = await checkGravatar(email);

  document.getElementById("status").textContent = "Fuites…";
  const hibp = await checkHIBP(email);

  document.getElementById("status").textContent = "Réputation…";
  const emailrep = await checkEmailRep(email);

  out.innerHTML = "";

  // Section 1 : Validité
  addSection(out, "Validité technique");
  addInfoCard(out, {
    dotClass: "blue",
    title: "Format email",
    meta: "RFC 5322",
    badge: { text: "valide", cls: "ok" }
  });

  addInfoCard(out, {
    dotClass: mx.hasMX ? "blue" : "red",
    title: "Serveurs MX",
    meta: mx.hasMX ? mx.records.slice(0,2).join(" · ") : mx.reason,
    badge: mx.hasMX ? { text: `${mx.records.length} MX`, cls: "ok" } : { text: "aucun", cls: "neg" }
  });

  // Section 2 : Classification
  addSection(out, "Classification");

  addInfoCard(out, {
    dotClass: isDisposable ? "red" : "gray",
    title: "Email jetable",
    meta: isDisposable ? "Domaine jetable détecté" : "Domaine permanent",
    badge: isDisposable ? { text: "jetable", cls: "neg" } : { text: "permanent", cls: "ok" }
  });

  addInfoCard(out, {
    dotClass: isRole ? "orange" : "gray",
    title: "Compte de rôle",
    meta: isRole ? "Adresse de type contact@, info@, admin@…" : "Adresse personnelle",
    badge: isRole ? { text: "rôle", cls: "warn" } : { text: "personnel", cls: "ok" }
  });

  // Section 3 : Présence publique
  addSection(out, "Présence publique");

  addInfoCard(out, {
    dotClass: gravatar.exists ? "blue" : "gray",
    title: "Gravatar",
    meta: gravatar.exists ? "Un avatar public est associé" : "Aucun avatar public",
    badge: gravatar.exists ? { text: "existe", cls: "ok" } : { text: "aucun", cls: "neg" }
  });

  if (emailrep) {
    const profilesStr = emailrep.profiles.length > 0
      ? `Profils liés : ${emailrep.profiles.join(", ")}`
      : "Aucun profil public lié";

    addInfoCard(out, {
      dotClass: emailrep.suspicious ? "red" : "blue",
      title: "Réputation EmailRep",
      meta: profilesStr,
      badge: {
        text: emailrep.reputation,
        cls: emailrep.reputation === "high" ? "ok" : emailrep.reputation === "low" ? "neg" : "warn"
      }
    });

    if (emailrep.firstSeen || emailrep.lastSeen) {
      addInfoCard(out, {
        dotClass: "gray",
        title: "Historique de présence",
        meta: `Première vue : ${emailrep.firstSeen || "?"} · Dernière vue : ${emailrep.lastSeen || "?"}`
      });
    }
  }

  // Section 4 : Fuites
  addSection(out, "Fuites de données");

  if (hibp.exists && hibp.breaches.length) {
    addInfoCard(out, {
      dotClass: "red",
      title: `Have I Been Pwned — ${hibp.breaches.length} fuite(s)`,
      meta: hibp.breaches.slice(0,5).join(", "),
      badge: { text: "compromis", cls: "neg" }
    });
  } else {
    addInfoCard(out, {
      dotClass: "gray",
      title: "Have I Been Pwned",
      meta: hibp.reason || "aucune fuite trouvée",
      badge: { text: "aucune", cls: "ok" }
    });
  }
}

/* ============================================================
   RENDU PSEUDO
   ============================================================ */
async function renderIdentity(target) {
  const out = document.getElementById("out");
  const norm = target.trim().replace(/\s+/g,"").toLowerCase();

  out.innerHTML = `<div class="status" id="status">analyse de ${PLATFORMS.length} plateformes…</div>`;

  let done = 0, found = 0;
  const foundEls = [];

  PLATFORMS.forEach(([name, urlFn, checker]) => {
    const url = urlFn(norm);
    Promise.resolve(checker(norm, name)).then(res => {
      done++;
      if (res && res.exists && res.confidence >= 0.5) {
        found++;
        const div = document.createElement("div");
        div.className = "card";
        const conf = Math.round((res.confidence || 0) * 100);
        const badgeCls = res.confidence >= 0.85 ? "ok" : "warn";
        div.innerHTML = `
          <div class="dot"></div>
          <div class="info">
            <a href="${url}" target="_blank" rel="noopener">${name}
              <span class="badge ${badgeCls}">${conf}%</span>
            </a>
            <div class="meta">${url}</div>
            <div class="meta">${escapeHtml(res.reason || "")}</div>
          </div>
        `;
        foundEls.push(div);
      }
      const st = document.getElementById("status");
      if (st) st.textContent = `${done}/${PLATFORMS.length} · ${found} trouvé(s)`;
      if (done === PLATFORMS.length) {
        out.innerHTML = "";
        if (found === 0) {
          out.innerHTML = `<div class="none">aucun compte trouvé</div>`;
        } else {
          const head = document.createElement("div");
          head.className = "status";
          head.textContent = `${found} compte(s) trouvé(s)`;
          out.appendChild(head);
          foundEls.forEach(el => out.appendChild(el));
        }
      }
    }).catch(() => {
      done++;
      const st = document.getElementById("status");
      if (st) st.textContent = `${done}/${PLATFORMS.length} · ${found} trouvé(s)`;
      if (done === PLATFORMS.length && found === 0) {
        out.innerHTML = `<div class="none">aucun compte trouvé</div>`;
      }
    });
  });
}

/* ============================================================
   UTILITAIRES
   ============================================================ */
function addSection(parent, title) {
  const s = document.createElement("div");
  s.className = "section-title";
  s.textContent = title;
  parent.appendChild(s);
}

function addInfoCard(parent, {dotClass, title, meta, badge}) {
  const c = document.createElement("div");
  c.className = "card info-card";
  c.innerHTML = `
    <div class="dot ${dotClass}"></div>
    <div class="info">
      <div class="title">${escapeHtml(title)}${badge ? ` <span class="badge ${badge.cls}">${escapeHtml(badge.text)}</span>` : ""}</div>
      <div class="meta">${escapeHtml(meta || "")}</div>
    </div>
  `;
  parent.appendChild(c);
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

function validate(t) {
  t = (t || "").trim();
  if (!t) return false;
  return /^[a-zA-Z0-9_.@\- ]{2,}$/.test(t);
}

/* ============================================================
   EVENT
   ============================================================ */
document.getElementById("go").addEventListener("click", () => {
  const type = document.getElementById("type").value;
  const target = document.getElementById("target").value;
  const out = document.getElementById("out");

  if (!validate(target)) {
    out.innerHTML = `<div class="none">cible invalide</div>`;
    return;
  }

  if (type === "email") {
    renderEmail(target.trim());
  } else {
    renderIdentity(target);
  }
});

document.getElementById("target").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("go").click();
});
</script>
