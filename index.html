/* ============================================================
   VÉRIFICATION PAR IA — analyse le HTMLPage d'une page pour dire
   si un compte existe Not vraiment, sans deviner.
   ============================================================ */
async function aiCheckExists(platform, username, html) {
  if (!GEMINI_API_KEY) return null; // IA indisponible

  // On tronque pour rester sous la limite
  const sample = html.slice(0, 6000);

  const prompt = `Tu analyses une page web pour déterminer si un COMPTE UTILISATEUR existe sur la plateforme "${platform}" pour le pseudo "${username}".

Voici un extrait du HTML/contenu de la page :
---DEBUT---
${sample}
---FIN---

Réponds UNIQUEMENT par un JSON strict de cette forme :
{"exists": true|false, "confidence": 0.0-1.0, "reason": "courte explication"}

Règles :
- exists=true SEULEMENT si la page montre clairement un profil/compte correspondant à ce pseudo (nom d'utilisateur, bio, avatar, publications...).
- exists=false si la page est une 404, une page vide, une page de login, un message "utilisateur introuvable", ou si le contenu ne correspond PAS à un profil.
- En cas de doute, mets exists=false avec confidence basse.
- Ne devine pas. Base-toi uniquement sur le contenu fourni.`;

  try {
    const r = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: {
            temperature: 0,
            responseMimeType: "application/json"
          }
        })
      }
    );
    if (!r.ok) return null;
    const j = await r.json();
    const txt = j?.candidates?.[0]?.content?.parts?.[0]?.text || "";
    const parsed = JSON.parse(txt);
    if (typeof parsed.exists !== "boolean") return null;
    return parsed;
  } catch (e) {
    return null;
  }
}

// Vérification via HTML + IA (fallback heuristique si pas de clé IA)
function htmlCheck(negatives){
  return async (u, platformName) => {
    try {
      const r = await fetch(P(u));
      if (r.status !== 200) return {exists:false, confidence:1, reason:`HTTP ${r.status}`};
      const html = await r.text();

      // 1) essai IA
      const ai = await aiCheckExists(platformName, u, html);
      if (ai) return ai;

      // 2) fallback heuristique
      const hasNeg = negatives.some(n => html.toLowerCase().includes(n.toLowerCase()));
      return {exists: !hasNeg, confidence: 0.5, reason: hasNeg ? "marqueur négatif trouvé" : "aucun marqueur négatif (heuristique)"};
    } catch {
      return {exists:false, confidence:0, reason:"erreur réseau"};
    }
  };
}

async function md5(str) {
  const buf = new TextEncoder().encode(str);
  const hash = await crypto.subtle.digest("MD5", buf);
  return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, "0")).join("");
}

// Gravatar : hash MD5 de l'email → vérifie si un avatar public existe
async function checkGravatar(email) {
  try {
    // L'API crypto du navigateur ne supporte pas MD5 nativement,
    // on utilise donc un service public de hash (ou on peut utiliser SHA-256 côté gravatar? non, MD5 obligatoire).
    // Fallback : on passe par l'endpoint de vérification directe.
    const md5hex = await md5(email.trim().toLowerCase());
    const url = `https://www.gravatar.com/avatar/${md5hex}?d=404`;
    const r = await fetch(P(url));
    if (r.status === 200) {
      const txt = await r.text();
      // Réponse vide = pas de gravatar (d=404 renvoie 404 si inexistant)
      return { exists: txt.length > 0, reason: txt.length > 0 ? "avatar Gravatar public trouvé" : "aucun Gravatar" };
    }
    return { exists: false, reason: "aucun Gravatar public" };
  } catch {
    return { exists: false, reason: "vérification impossible" };
  }
}

// Have I Been Pwned (endpoint public — retourne juste les noms des breaches, pas de clé)
// Note : HIBP bloque le CORS et requiert une clé API pour "breachedaccount".
// On utilise donc Firefox Monitor (Mozilla) qui expose un endpoint public.
async function checkHIBP(email) {
  try {
    // Firefox Monitor : pas d'API JSON publique directe non plus.
    // On tente HIBP v3 (fonctionne si pas bloqué par CORS depuis le proxy).
    const url = `https://haveibeenpwned.com/api/v3/breachedaccount/${encodeURIComponent(email)}?truncateResponse=true`;
    const r = await fetch(P(url), { headers: { "user-agent": "OSINT-AI" } });
    if (r.status === 404) return { exists: false, breaches: [], reason: "aucune fuite connue" };
    if (r.status === 200) {
      const data = await r.json();
      return { exists: true, breaches: data.map(b => b.Name), reason: `${data.length} fuite(s) connue(s)` };
    }
    if (r.status === 401) return { exists: false, breaches: [], reason: "API HIBP requiert une clé (non fournie)" };
    return { exists: false, breaches: [], reason: `HIBP: HTTP ${r.status}` };
  } catch {
    return { exists: false, breaches: [], reason: "HIBP inaccessible" };
  }
}

// Vérification DNS / MX du domaine — peut-il recevoir du courrier ?
// On utilise l'API publique Google DNS-over-HTTPS (aucune clé requise).
async function checkMX(domain) {
  try {
    const url = `https://dns.google/resolve?name=${encodeURIComponent(domain)}&type=MX`;
    const r = await fetch(url);
    if (!r.ok) return { hasMX: false, records: [], reason: `DNS: HTTP ${r.status}` };
    const j = await r.json();
    const records = (j.Answer || []).filter(a => a.type === 15).map(a => a.data);
    return { hasMX: records.length > 0, records, reason: records.length > 0 ? `${records.length} serveur(s) MX` : "aucun MX" };
  } catch {
    return { hasMX: false, records: [], reason: "DNS inaccessible" };
  }
}

async function checkA(domain) {
  try {
    const url = `https://dns.google/resolve?name=${encodeURIComponent(domain)}&type=A`;
    const r = await fetch(url);
    if (!r.ok) return { hasA: false, records: [] };
    const j = await r.json();
    const records = (j.Answer || []).filter(a => a.type === 1).map(a => a.data);
    return { hasA: records.length > 0, records };
  } catch {
    return { hasA: false, records: [] };
  }
}

N'indique pas de nom, âge, localisation, ou toute autre info qui ne figure pas dans les faits.
Format : puces "- ...". Termine par "Sources : ..." si pertinent.`;

  try {
    const r = await fetch(

      {

async function renderIdentity(target) {

  out.innerHTML = `<div class="status" id="status">analyse de ${PLATFORMS.length} plateformes (IA)…</div>`;

  let done = 0, found = 0;
  const foundEls = [];

  PLATFORMS.forEach(([name, urlFn, checker]) => {
    const url = urlFn(norm);
    Promise.resolve(checker(norm, name)).then(res => {
      // res = {exists, confidence, reason}
      done++;
      if (res && res.exists && res.confidence >= 0.5) {
        found++;
        const div = document.createElement("div");
        div.className = "card";
        const conf = Math.round((res.confidence || 0) * 100);
        const badgeCls = res.confidence >= 0.85 ? "ok" : res.confidence >= 0.5 ? "warn" : "neg";
        div.innerHTML = `
          <div class="dot"></div>
          <div class="info">
            <a href="${url}" target="_blank" rel="noopener">${name}
              <span class="badge ${badgeCls}">${conf}%</span>
            </a>
            <div class="meta">${url}</div>
            <div class="meta">${escapeHtml(res.reason || "")}</div>
          </div>
        `;
        foundEls.push(div);
      }
      const st = document.getElementById("status");
      if (st) st.textContent = `${done}/${PLATFORMS.length} · ${found} compte(s) trouvé(s)`;
      if (done === PLATFORMS.length) {
        out.innerHTML = "";
        if (found === 0) {
          out.innerHTML = `<div class="none">aucun compte trouvé avec un niveau de confiance suffisant</div>`;
        } else {
          const head = document.createElement("div");
          head.className = "status";
          head.textContent = `${found} compte(s) trouvé(s) — trié par détection`;
          out.appendChild(head);
          foundEls.forEach(el => out.appendChild(el));
        }
      }
    }).catch(() => {
      done++;
      const st = document.getElementById("status");
      if (st) st.textContent = `${done}/${PLATFORMS.length} · ${found} compte(s) trouvé(s)`;
      if (done === PLATFORMS.length) {
        out.innerHTML = "";
        if (found === 0) out.innerHTML = `<div class="none">aucun compte trouvé</div>`;
        else {
          const head = document.createElement("div");
          head.className = "status";
          head.textContent = `${found} compte(s) trouvé(s)`;
          out.appendChild(head);
          foundEls.forEach(el => out.appendChild(el));
        }
      }
    });
  });
}

/* ============================================================
   UTILITAIRES
   ============================================================ */
function addInfoCard(parent, {dotClass, title, meta, badge}) {
  const c = document.createElement("div");
  c.className = "card info-card";
  c.innerHTML = `
    <div class="dot ${dotClass}"></div>
    <div class="info">
      <div class="title">${escapeHtml(title)}${badge ? ` <span class="badge ${badge.cls}">${escapeHtml(badge.text)}</span>` : ""}</div>
      <div class="meta">${escapeHtml(meta || "")}</div>
    </div>
  `;
  parent.appendChild(c);
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

function validate(t) {
  t = (t || "").trim();
  if (!t) return false;
  return /^[a-zA-Z0-9_.@\- ]{2,}$/.test(t);
}

/* ============================================================
   EVENT
   ============================================================ */
document.getElementById("go").addEventListener("click", () => {
  const type = document.getElementById("type").value;
  const target = document.getElementById("target").value;
  const out = document.getElementById("out");

  if (!validate(target)) {
    out.innerHTML = `<div class="empty">cible invalide</div>`;
    return;
  }

  if (type === "email") {
    renderEmail(target.trim());
  } else {
    renderIdentity(target);
  }
});

document.getElementById("target").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("go").click();
});
</script>
