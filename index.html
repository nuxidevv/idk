<script>
/* ============================================================
   CAPTURE D'ERREURS
   ============================================================ */
window.addEventListener("error", e => {
  const out = document.getElementById("out");
  if (out) out.innerHTML = `<div class="err">Erreur : ${e.message}</div>`;
});

/* ============================================================
   PROXY CORS (multi-fallback)
   ============================================================ */
const PROXIES = [
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`
];

async function P(url) {
  for (const proxy of PROXIES) {
    try {
      const r = await fetch(proxy(url));
      if (r.ok) return r;
    } catch {}
  }
  throw new Error("proxy failed");
}

/* ============================================================
   APIs OFFICIELLES PSEUDO (pour la recherche par nom)
   ============================================================ */
async function vGitHub(u) {
  try {
    const r = await fetch(`https://api.github.com/users/${u}`);
    if (r.status === 200) {
      const j = await r.json();
      return { exists:true, confidence:1, reason:`${j.public_repos} repos · ${j.followers} followers`, url:`https://github.com/${u}` };
    }
    return { exists:false, confidence:1, reason:"404" };
  } catch { return { exists:false, confidence:0, reason:"erreur réseau" }; }
}

async function vReddit(u) {
  try {
    const r = await fetch(`https://www.reddit.com/user/${u}/about.json`);
    if (r.status !== 200) return { exists:false, confidence:1, reason:"404" };
    const j = await r.json();
    if (j?.data?.name) {
      return { exists:true, confidence:1, reason:`karma: ${j.data.link_karma + j.data.comment_karma}`, url:`https://www.reddit.com/user/${u}` };
    }
    return { exists:false, confidence:1, reason:"pas de donnée" };
  } catch { return { exists:false, confidence:0, reason:"erreur réseau" }; }
}

async function vGitLab(u) {
  try {
    const r = await fetch(`https://gitlab.com/api/v4/users?username=${u}`);
    if (r.status !== 200) return { exists:false, confidence:1, reason:"404" };
    const j = await r.json();
    if (Array.isArray(j) && j.length > 0) {
      return { exists:true, confidence:1, reason:j[0].name || j[0].username, url:`https://gitlab.com/${u}` };
    }
    return { exists:false, confidence:1, reason:"liste vide" };
  } catch { return { exists:false, confidence:0, reason:"erreur réseau" }; }
}

/* ============================================================
   CHECKER HTML avec signatures
   ============================================================ */
function htmlCheck(options) {
  const { negatives = [], positives = [], minScore = 0.4 } = options;
  return async (u, url) => {
    try {
      const r = await P(url);
      if (r.status !== 200) return { exists:false, confidence:1, reason:`HTTP ${r.status}` };
      const html = await r.text();
      const low = html.toLowerCase();

      for (const n of negatives) {
        if (low.includes(n.toLowerCase())) {
          return { exists:false, confidence:0.9, reason:`négatif` };
        }
      }

      let found = 0;
      const hits = [];
      for (const p of positives) {
        if (low.includes(p.toLowerCase())) { found++; hits.push(p); }
      }

      const ratio = positives.length > 0 ? found / positives.length : 0.5;
      return {
        exists: ratio >= minScore,
        confidence: Math.min(0.5 + ratio * 0.4, 0.9),
        reason: hits.length ? `${hits.slice(0,2).join(", ")}` : `${found}/${positives.length} signaux`
      };
    } catch {
      return { exists:false, confidence:0, reason:"proxy inaccessible" };
    }
  };
}

/* ============================================================

const PLATFORMS = [

  })],

  })],
  ["Vimeo", u=>`https://vimeo.com/${u}`, htmlCheck({

  })],
  ["CodePen", u=>`https://codepen.io/${u}`, htmlCheck({
    negatives: ["page not found","404"],

  })],
  ["HackerNews", u=>`https://news.ycombinator.com/user?id=${u}`, htmlCheck({
    negatives: ["no such user","sorry"],
    positives: ["karma","created","about"]
  })],
  ["9GAG", u=>`https://9gag.com/u/${u}`, htmlCheck({

    positives: ["og:title","9gag","profile"]
  })],
  ["ArtStation", u=>`https://www.artstation.com/${u}`, htmlCheck({

  })],
  ["Product Hunt", u=>`https://www.producthunt.com/@${u}`, htmlCheck({

/* ============================================================
   GOOGLE DORKS — moteurs de recherche (via proxy)
   ============================================================ */

// Génère les variantes de recherche
function buildDorks(fullName, criteria) {
  const [first, ...rest] = fullName.trim().split(/\s+/);
  const last = rest.join(" ") || "";
  const f = first || "";
  const l = last;

  const crit = criteria.crit || "";
  const val = criteria.value || "";

  // Dorks de base (toujours exécutés)
  const dorks = [
    { label: "Nom complet exact",          q: `"${fullName}"` },
    { label: "Nom + LinkedIn",             q: `"${fullName}" site:linkedin.com` },
    { label: "Nom + Facebook",             q: `"${fullName}" site:facebook.com` },
    { label: "Nom + Instagram",            q: `"${fullName}" site:instagram.com` },
    { label: "Nom + Twitter/X",            q: `"${fullName}" site:twitter.com OR site:x.com` },
    { label: "Nom + GitHub",               q: `"${fullName}" site:github.com` },
    { label: "Nom + PDF",                  q: `"${fullName}" filetype:pdf` },
    { label: "Nom + CV / Resume",          q: `"${fullName}" (CV OR resume OR curriculum)` },
    { label: "Nom + Email",                q: `"${fullName}" (email OR mail OR contact)` },
    { label: "Nom + Téléphone",            q: `"${fullName}" (téléphone OR phone OR tel)` },
    { label: "Nom sur Pastebin",           q: `"${fullName}" site:pastebin.com` },
    { label: "Nom sur Documents publics",  q: `"${fullName}" filetype:docx OR filetype:xlsx OR filetype:pptx` },
  ];

  // Dork selon critère
  if (crit && val) {
    const critMap = {
      email:    `"${fullName}" "${val}"`,
      username: `"${fullName}" "${val}"`,
      phone:    `"${fullName}" "${val}"`,
      city:     `"${fullName}" "${val}"`,
      country:  `"${fullName}" "${val}"`,
      company:  `"${fullName}" "${val}" (LinkedIn OR site:linkedin.com)`,
      school:   `"${fullName}" "${val}"`,
      job:      `"${fullName}" "${val}"`,
      birth:    `"${fullName}" "${val}"`,
      site:     `"${fullName}" site:${val}`,
      linkedin: `"${fullName}" site:linkedin.com "${val}"`,
      twitter:  `"${fullName}" (site:twitter.com OR site:x.com) "${val}"`,
      github:   `"${fullName}" site:github.com "${val}"`,
      facebook: `"${fullName}" site:facebook.com "${val}"`,
      instagram:`"${fullName}" site:instagram.com "${val}"`,
    };
    if (critMap[crit]) {
      dorks.unshift({ label: `Critère : ${crit} = ${val}`, q: critMap[crit] });
    }
  }

  return dorks;
}

// Vérifie si un résultat est valide via DuckDuckGo HTML
async function searchDork(query) {
  try {
    // Utilise DuckDuckGo HTML (pas d'API, mais accessible via proxy)
    const ddgUrl = `https://html.duckduckgo.com/html/?q=${encodeURIComponent(query)}`;
    const r = await P(ddgUrl);
    if (r.status !== 200) return { found:false, count:0, hits:[] };
    const html = await r.text();

    // Extrait les résultats (liens + titres)
    const results = [];
    const regex = /<a[^>]*class="result__a"[^>]*href="([^"]+)"[^>]*>(.*?)<\/a>/g;
    let m;
    while ((m = regex.exec(html)) !== null && results.length < 5) {
      const url = decodeURIComponent(m[1].replace(/^.*uddg=/, "").replace(/&rut=.*$/, ""));
      const title = m[2].replace(/<[^>]+>/g, "").trim();
      if (title && url && !url.includes("duckduckgo.com")) {
        results.push({ title, url });
      }
    }

    return { found: results.length > 0, count: results.length, hits: results };
  } catch (e) {
    return { found:false, count:0, hits:[], error:true };
  }
}

/* ============================================================
   RENDU — RECHERCHE PROFONDE PRÉNOM NOM
   ============================================================ */
async function renderDeepSearch(fullName, criteria) {
  const out = document.getElementById("out");
  out.innerHTML = `<div class="status" id="status">préparation…</div>`;

  // 1) Génère les dorks
  const dorks = buildDorks(fullName, criteria);

  // 2) Génère les variantes de pseudo possibles
  const [first, ...rest] = fullName.trim().toLowerCase().split(/\s+/);
  const last = rest.join(" ");
  const usernameVariants = [
    first + last,
    first + "." + last,
    first + "_" + last,
    first[0] + last,
    first + last[0],
    first + "-" + last
  ].filter(u => u && u.length >= 2);

  // 3) Lance TOUT en parallèle
  document.getElementById("status").textContent = `analyse de ${dorks.length} dorks + ${usernameVariants.length} variantes…`;

  const dorkPromises = dorks.map(async d => ({ type:"dork", label:d.label, query:d.q, result: await searchDork(d.q) }));

  const platformPromises = [];
  for (const variant of usernameVariants) {
    for (const [name, urlFn, checker] of PLATFORMS) {
      const url = urlFn(variant);
      platformPromises.push(
        Promise.resolve(checker(variant, url)).then(res => ({ type:"platform", platform:name, variant, url, result:res })).catch(() => null)
      );
    }
  }

  const [dorkResults, platformResults] = await Promise.all([
    Promise.all(dorkPromises),
    Promise.all(platformPromises)
  ]);

  // 4) Filtre et affiche
  out.innerHTML = "";

  // --- Résultats dorks ---
  const foundDorks = dorkResults.filter(d => d.result.found);
  addSection(out, `Google Dorks — ${foundDorks.length}/${dorks.length} positifs`);

  if (foundDorks.length === 0) {
    out.innerHTML += `<div class="none">aucun résultat de dork</div>`;
  } else {
    foundDorks.forEach(d => {
      const card = document.createElement("div");
      card.className = "card dork-card";
      const hitsHtml = d.result.hits.slice(0,3).map(h =>
        `<div class="meta" style="margin-left:0;">→ <a href="${h.url}" target="_blank" rel="noopener" style="color:#4da3ff;">${escapeHtml(h.title.slice(0,70))}</a></div>`
      ).join("");
      card.innerHTML = `
        <div class="dot blue"></div>
        <div class="info">
          <div class="title">${escapeHtml(d.label)}
            <span class="badge ok">${d.result.count}</span>
          </div>
          <div class="meta">${escapeHtml(d.query)}</div>
          ${hitsHtml}
        </div>
      `;
      out.appendChild(card);
    });
  }

  // --- Résultats plateformes ---
  const foundPlatforms = platformResults.filter(p => p && p.result.exists && p.result.confidence >= 0.5);

  addSection(out, `Plateformes — ${foundPlatforms.length} profil(s)`);

  if (foundPlatforms.length === 0) {
    out.innerHTML += `<div class="none">aucun profil trouvé via variantes de pseudo</div>`;
  } else {
    // Déduplique par plateforme (garde la meilleure variante)
    const best = {};
    for (const p of foundPlatforms) {
      if (!best[p.platform] || best[p.platform].result.confidence < p.result.confidence) {
        best[p.platform] = p;
      }
    }
    Object.values(best).forEach(p => {
      const conf = Math.round((p.result.confidence || 0) * 100);
      const badgeCls = p.result.confidence >= 0.85 ? "ok" : "warn";
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="dot"></div>
        <div class="info">
          <a href="${p.url}" target="_blank" rel="noopener">${p.platform}
            <span class="badge ${badgeCls}">${conf}%</span>
          </a>
          <div class="meta">${escapeHtml(p.url)}</div>
          <div class="meta">variante : ${escapeHtml(p.variant)} · ${escapeHtml(p.result.reason || "")}</div>
        </div>
      `;
      out.appendChild(card);
    });
  }
}

/* ============================================================
   UI — critères
   ============================================================ */
const activeCriteria = { crit: null, value: "" };

document.getElementById("criteriaToggle").addEventListener("click", () => {
  document.getElementById("criteriaList").classList.toggle("open");
});

document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    const crit = chip.dataset.crit;
    const isActive = chip.classList.contains("active");

    // Désactive tous les autres
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));

    if (isActive) {
      activeCriteria.crit = null;
    } else {
      chip.classList.add("active");
      activeCriteria.crit = crit;
    }
    updateCriteriaCount();
  });
});

document.getElementById("extraValue").addEventListener("input", e => {
  activeCriteria.value = e.target.value.trim();
  updateCriteriaCount();
});

function updateCriteriaCount() {
  const el = document.getElementById("criteriaCount");
  if (activeCriteria.crit && activeCriteria.value) {
    el.textContent = `1 actif`;
    el.style.color = "#00e07a";
  } else {
    el.textContent = "0 sélectionné";
    el.style.color = "";
  }
}

/* ============================================================
   UTILITAIRES
   ============================================================ */
function addSection(parent, title) {
  const s = document.createElement("div");
  s.className = "section-title";
  s.textContent = title;
  parent.appendChild(s);
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

function validate(t) {
  t = (t || "").trim();
  if (!t) return false;
  if (t.length < 3) return false;
  return /^[a-zA-ZÀ-ÿ'\- ]{2,}$/.test(t);
}

/* ============================================================
   EVENT
   ============================================================ */
document.getElementById("go").addEventListener("click", () => {
  const target = document.getElementById("target").value;
  const out = document.getElementById("out");
  const btn = document.getElementById("go");

  if (!validate(target)) {
    out.innerHTML = `<div class="none">entre un prénom et un nom valides</div>`;
    return;
  }

  btn.disabled = true;
  btn.textContent = "Recherche en cours…";

  renderDeepSearch(target.trim(), activeCriteria).finally(() => {
    btn.disabled = false;
    btn.textContent = "Rechercher";
  });
});

document.getElementById("target").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("go").click();
});
</script>
