<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeekIt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --bg:#000;
    --card:#0a0a0a;
    --card-hover:#0d0d0d;
    --border:#1a1a1a;
    --border-hover:#2a2a2a;
    --text:#eaeaea;
    --text-dim:#666;
    --text-dimmer:#444;
    --accent:#fff;
    --green:#00e07a;
    --green-dim:#0a2a1a;
    --orange:#ffaa4d;
    --orange-dim:#2a1a0a;
    --red:#ff6b6b;
    --blue:#4da3ff;
    --input-bg:#0a0a0a;
    --input-focus-bg:#0d0d0d;
    --row-border:#141414;
    --overlay:rgba(0,0,0,0.4);
  }

  body.light {
    --bg:#f5f5f7;
    --card:#ffffff;
    --card-hover:#fafafa;
    --border:#e0e0e5;
    --border-hover:#c8c8d0;
    --text:#1a1a1a;
    --text-dim:#888;
    --text-dimmer:#bbb;
    --accent:#000;
    --green-dim:#d4f5e0;
    --orange-dim:#fde8d4;
    --input-bg:#ffffff;
    --input-focus-bg:#fafafa;
    --row-border:#ececef;
    --overlay:rgba(255,255,255,0.4);
  }

  html, body { height:100%; }

  body {
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:60px 20px 80px;
    overflow-x:hidden;
    position:relative;
    transition:background 0.4s, color 0.4s;
  }

  /* Fond animé renforcé */
  body::before {
    content:'';
    position:fixed;
    top:-50%; left:-50%;
    width:200%; height:200%;
    background:
      radial-gradient(circle at 20% 30%, rgba(0,224,122,0.06) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(77,163,255,0.06) 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(255,170,77,0.03) 0%, transparent 50%);
    animation:bgFloat 18s ease-in-out infinite;
    pointer-events:none;
    z-index:0;
  }

  @keyframes bgFloat {
    0%,100% { transform:translate(0,0) scale(1); }
    33% { transform:translate(2%,-2%) scale(1.05); }
    66% { transform:translate(-2%,2%) scale(1.02); }
  }

  /* Grille animée en fond */
  body::after {
    content:'';
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(0,224,122,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,224,122,0.04) 1px, transparent 1px);
    background-size:50px 50px;
    pointer-events:none;
    z-index:0;
    mask-image:radial-gradient(ellipse at center, black 30%, transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse at center, black 30%, transparent 75%);
    animation:gridMove 30s linear infinite;
  }

  body.light::after {
    background-image:
      linear-gradient(rgba(0,150,90,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,150,90,0.05) 1px, transparent 1px);
  }

  @keyframes gridMove {
    from { background-position:0 0; }
    to { background-position:50px 50px; }
  }

  /* Barre de progression en haut */
  .progress-bar {
    position:fixed;
    top:0; left:0;
    height:2px;
    width:0%;
    background:linear-gradient(90deg, var(--green), var(--blue));
    z-index:100;
    transition:width 0.3s ease-out, opacity 0.3s;
    opacity:0;
    box-shadow:0 0 12px rgba(0,224,122,0.6);
  }

  .progress-bar.active { opacity:1; }

  .wrap {
    width:100%; max-width:680px;
    position:relative; z-index:1;
  }

  /* Header */
  .header {
    margin-bottom:36px;
    animation:fadeUp 0.6s ease-out;
    position:relative;
  }

  .logo-row {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
  }

  .logo {
    display:flex; align-items:center; gap:10px;
  }

  .logo-mark {
    width:28px; height:28px;
    border-radius:8px;
    background:linear-gradient(135deg, #fff 0%, #888 100%);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    overflow:hidden;
  }

  .logo-mark::after {
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.4) 50%, transparent 60%);
    animation:shimmer 3s ease-in-out infinite;
  }

  @keyframes shimmer {
    0% { transform:translateX(-100%); }
    100% { transform:translateX(100%); }
  }

  .logo-mark svg {
    width:16px; height:16px;
    color:#000;
    position:relative; z-index:1;
  }

  h1 {
    font-size:1.35rem;
    font-weight:700;
    color:var(--text);
    letter-spacing:-0.02em;
  }

  /* Toggle mode clair/sombre */
  .theme-toggle {
    width:34px; height:34px;
    border-radius:8px;
    background:var(--card);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:border-color 0.2s, transform 0.2s, background 0.2s;
    flex-shrink:0;
  }

  .theme-toggle:hover {
    border-color:var(--border-hover);
    transform:rotate(15deg);
  }

  .theme-toggle svg {
    width:16px; height:16px;
    color:var(--text-dim);
    transition:color 0.2s;
  }

  .theme-toggle:hover svg { color:var(--text); }

  /* Compteur animé */
  .counter-row {
    display:flex;
    align-items:baseline;
    gap:6px;
    font-size:0.75rem;
    color:var(--text-dim);
    letter-spacing:0.02em;
    margin-top:6px;
  }

  .counter-row::before {
    content:'';
    width:4px; height:4px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 8px var(--green);
    animation:pulse 2s ease-in-out infinite;
    flex-shrink:0;
    align-self:center;
  }

  .counter {
    font-family:'JetBrains Mono', monospace;
    font-weight:600;
    color:var(--green);
    font-size:0.8rem;
    letter-spacing:0.02em;
  }

  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.4; transform:scale(0.8); }
  }

  /* Input */
  .input-wrap {
    position:relative;
    margin-bottom:12px;
    animation:fadeUp 0.6s ease-out 0.1s backwards;
  }

  .input-wrap .input-icon {
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    width:16px;
    height:16px;
    color:var(--text-dimmer);
    pointer-events:none;
    transition:color 0.2s;
    z-index:2;
  }

  input {
    background:var(--input-bg);
    border:1px solid var(--border);
    color:var(--text);
    padding:14px 42px 14px 42px;
    border-radius:10px;
    font-size:0.9rem;
    font-family:inherit;
    outline:none;
    width:100%;
    transition:border-color 0.2s, background 0.2s, box-shadow 0.2s;
    position:relative;
    z-index:1;
  }

  input::placeholder { color:var(--text-dimmer); }

  input:focus {
    border-color:var(--border-hover);
    background:var(--input-focus-bg);
    box-shadow:0 0 0 4px rgba(0,224,122,0.05);
  }

  .input-wrap:focus-within .input-icon { color:var(--green); }

  /* Bouton clear */
  .input-clear {
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    width:20px; height:20px;
    border-radius:50%;
    background:var(--border);
    border:none;
    display:none;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:3;
    transition:background 0.15s;
  }

  .input-clear:hover { background:var(--border-hover); }
  .input-clear.visible { display:flex; }
  .input-clear svg { width:10px; height:10px; color:var(--text-dim); }

  /* Button */
  button.primary {
    width:100%;
    background:var(--accent);
    color:var(--bg);
    border:none;
    padding:14px;
    border-radius:10px;
    font-size:0.88rem;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    letter-spacing:0.01em;
    transition:transform 0.15s, opacity 0.15s, box-shadow 0.2s;
    position:relative;
    overflow:hidden;
    animation:fadeUp 0.6s ease-out 0.2s backwards;
  }

  button.primary:hover:not(:disabled) {
    opacity:0.9;
    box-shadow:0 8px 24px rgba(0,224,122,0.15);
  }

  button.primary:active:not(:disabled) { transform:scale(0.99); }

  button.primary:disabled {
    background:var(--border);
    color:var(--text-dimmer);
    cursor:default;
  }

  button.primary .spinner {
    display:none;
    width:14px; height:14px;
    border:2px solid rgba(0,0,0,0.15);
    border-top-color:currentColor;
    border-radius:50%;
    animation:spin 0.7s linear infinite;
    margin-right:8px;
    vertical-align:middle;
  }

  button.primary.loading .spinner { display:inline-block; }

  @keyframes spin { to { transform:rotate(360deg); } }

  #out { margin-top:28px; }

  .status {
    font-size:0.72rem;
    color:var(--text-dim);
    text-align:center;
    margin-bottom:18px;
    letter-spacing:0.02em;
    animation:fadeUp 0.4s ease-out;
  }

  .none {
    color:var(--text-dim);
    font-size:0.85rem;
    text-align:center;
    padding:40px 20px;
    animation:fadeUp 0.4s ease-out;
  }

  /* Squelettes de chargement */
  .skeleton {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:12px;
    animation:fadeUp 0.3s ease-out;
  }

  .skel-line {
    height:10px;
    border-radius:4px;
    background:linear-gradient(90deg, var(--border) 0%, var(--border-hover) 50%, var(--border) 100%);
    background-size:200% 100%;
    animation:skelShimmer 1.5s linear infinite;
    margin-bottom:8px;
  }

  .skel-line.title { width:60%; height:14px; margin-bottom:12px; }
  .skel-line.short { width:35%; }
  .skel-line.medium { width:80%; }

  @keyframes skelShimmer {
    0% { background-position:200% 0; }
    100% { background-position:-200% 0; }
  }

  /* Cards */
  .card {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:12px;
    transition:border-color 0.2s, transform 0.2s, box-shadow 0.2s, background 0.2s;
    animation:cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) backwards;
    position:relative;
    overflow:hidden;
  }

  .card::before {
    content:'';
    position:absolute;
    top:0; left:0;
    width:2px; height:100%;
    background:linear-gradient(180deg, var(--green), transparent);
    opacity:0.4;
  }

  .card:hover {
    border-color:var(--border-hover);
    background:var(--card-hover);
    transform:translateY(-1px);
    box-shadow:0 8px 24px rgba(0,0,0,0.2);
  }

  .card:hover::before { opacity:1; }

  @keyframes cardIn {
    from { opacity:0; transform:translateY(12px); }
    to { opacity:1; transform:translateY(0); }
  }

  .card-header {
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px;
    padding-bottom:12px;
    border-bottom:1px solid var(--row-border);
  }

  .card-header-left {
    display:flex;
    align-items:flex-start;
    gap:10px;
    min-width:0;
    flex:1;
  }

  .card-avatar {
    width:36px; height:36px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--green) 0%, var(--blue) 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#000;
    font-weight:700;
    font-size:0.85rem;
    flex-shrink:0;
    letter-spacing:-0.03em;
  }

  .card-title-block { min-width:0; flex:1; }

  .card-title {
    font-size:0.95rem;
    font-weight:600;
    color:var(--text);
    word-break:break-word;
    letter-spacing:-0.01em;
  }

  .card-sub {
    font-size:0.7rem;
    color:var(--text-dim);
    margin-top:4px;
    font-family:'JetBrains Mono', monospace;
  }

  .card-actions {
    display:flex;
    gap:6px;
    flex-shrink:0;
  }

  .icon-btn {
    width:28px; height:28px;
    border-radius:6px;
    background:transparent;
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:border-color 0.15s, background 0.15s, transform 0.15s;
  }

  .icon-btn:hover {
    border-color:var(--border-hover);
    background:var(--card-hover);
    transform:scale(1.05);
  }

  .icon-btn:active { transform:scale(0.95); }

  .icon-btn svg { width:13px; height:13px; color:var(--text-dim); }
  .icon-btn:hover svg { color:var(--text); }

  .score {
    font-size:0.65rem;
    padding:4px 9px;
    border-radius:6px;
    background:var(--green-dim);
    color:var(--green);
    font-weight:700;
    flex-shrink:0;
    font-family:'JetBrains Mono', monospace;
    border:1px solid rgba(0,224,122,0.2);
    align-self:flex-start;
  }

  .score.mid {
    background:var(--orange-dim);
    color:var(--orange);
    border-color:rgba(255,170,77,0.2);
  }

  .score.low {
    background:#2a0a0a;
    color:var(--red);
    border-color:rgba(255,107,107,0.2);
  }

  .row {
    display:flex;
    gap:14px;
    padding:6px 0;
    font-size:0.78rem;
    align-items:flex-start;
  }

  .row-label {
    color:var(--text-dim);
    min-width:110px;
    flex-shrink:0;
    font-size:0.7rem;
    padding-top:2px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    font-weight:500;
  }

  .row-value {
    color:var(--text);
    word-break:break-word;
    flex:1;
    font-size:0.82rem;
    display:flex;
    align-items:center;
    gap:6px;
    justify-content:space-between;
  }

  .row-value .val-text { flex:1; min-width:0; word-break:break-word; }

  .row-value.mono .val-text {
    font-family:'JetBrains Mono', monospace;
    font-size:0.75rem;
  }

  .row-value a {
    color:var(--blue);
    text-decoration:none;
    transition:color 0.15s;
  }

  .row-value a:hover {
    color:#6fb5ff;
    text-decoration:underline;
  }

  .copy-btn {
    width:20px; height:20px;
    border-radius:5px;
    background:transparent;
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    opacity:0;
    transition:opacity 0.15s, border-color 0.15s, background 0.15s, transform 0.15s;
  }

  .card:hover .copy-btn { opacity:1; }

  .copy-btn:hover {
    border-color:var(--border-hover);
    background:var(--card-hover);
  }

  .copy-btn:active { transform:scale(0.9); }

  .copy-btn svg { width:11px; height:11px; color:var(--text-dim); }
  .copy-btn:hover svg { color:var(--green); }
  .copy-btn.copied svg { color:var(--green); }
  .copy-btn.copied { border-color:var(--green); }

  .section-title {
    font-size:0.7rem;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:1.5px;
    margin:22px 0 12px;
    font-weight:600;
  }

  .err {
    background:#1a0a0a;
    color:var(--red);
    padding:14px 16px;
    border-radius:10px;
    font-size:0.75rem;
    margin-top:14px;
    white-space:pre-wrap;
    word-break:break-word;
    border:1px solid rgba(255,107,107,0.2);
    animation:fadeUp 0.4s ease-out;
  }

  .raw-toggle {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    font-size:0.72rem;
    color:var(--text-dim);
    cursor:pointer;
    padding:12px;
    margin-top:14px;
    user-select:none;
    border-radius:8px;
    transition:color 0.15s, background 0.15s;
  }

  .raw-toggle:hover {
    color:var(--text);
    background:var(--card);
  }

  .raw-toggle svg {
    width:12px; height:12px;
    transition:transform 0.25s;
  }

  .raw-toggle.open svg { transform:rotate(90deg); }

  .raw {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px;
    margin-top:10px;
    font-size:0.65rem;
    color:var(--text-dim);
    max-height:400px;
    overflow:auto;
    white-space:pre-wrap;
    word-break:break-word;
    font-family:'JetBrains Mono', monospace;
    line-height:1.6;
    display:none;
    animation:fadeUp 0.3s ease-out;
  }

  .raw.open { display:block; }

  @keyframes fadeUp {
    from { opacity:0; transform:translateY(8px); }
    to { opacity:1; transform:translateY(0); }
  }

  /* Bouton flottant remonter */
  .scroll-top {
    position:fixed;
    bottom:24px;
    right:24px;
    width:44px; height:44px;
    border-radius:50%;
    background:var(--accent);
    color:var(--bg);
    border:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 20px rgba(0,224,122,0.3);
    opacity:0;
    pointer-events:none;
    transform:translateY(20px);
    transition:opacity 0.3s, transform 0.3s, background 0.3s;
    z-index:50;
  }

  .scroll-top.visible {
    opacity:1;
    pointer-events:auto;
    transform:translateY(0);
  }

  .scroll-top:hover {
    transform:translateY(-2px);
    box-shadow:0 6px 24px rgba(0,224,122,0.4);
  }

  .scroll-top:active { transform:translateY(0) scale(0.95); }

  .scroll-top svg {
    width:18px; height:18px;
    color:var(--bg);
  }

  /* Toasts */
  .toast-container {
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    flex-direction:column;
    gap:8px;
    z-index:200;
    pointer-events:none;
  }

  .toast {
    background:var(--card);
    border:1px solid var(--border-hover);
    color:var(--text);
    padding:10px 16px;
    border-radius:10px;
    font-size:0.78rem;
    font-weight:500;
    box-shadow:0 8px 32px rgba(0,0,0,0.4);
    animation:toastIn 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    display:flex;
    align-items:center;
    gap:8px;
    max-width:90vw;
  }

  .toast.success { border-color:rgba(0,224,122,0.4); }
  .toast.error { border-color:rgba(255,107,107,0.4); }

  .toast::before {
    content:'';
    width:6px; height:6px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 8px var(--green);
    flex-shrink:0;
  }

  .toast.error::before {
    background:var(--red);
    box-shadow:0 0 8px var(--red);
  }

  .toast.leaving {
    animation:toastOut 0.3s ease-out forwards;
  }

  @keyframes toastIn {
    from { opacity:0; transform:translateY(20px) scale(0.95); }
    to { opacity:1; transform:translateY(0) scale(1); }
  }

  @keyframes toastOut {
    to { opacity:0; transform:translateY(20px) scale(0.95); }
  }

  /* Watermark */
  .watermark {
    text-align:center;
    font-size:0.65rem;
    color:var(--text-dimmer);
    margin-top:48px;
    padding-top:24px;
    border-top:1px solid var(--border);
    letter-spacing:0.05em;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--border-hover); border-radius:3px; }
  ::-webkit-scrollbar-thumb:hover { background:var(--text-dimmer); }

  ::selection { background:rgba(0,224,122,0.3); color:var(--text); }

  @media (max-width:480px) {
    body { padding:40px 16px 80px; }
    .row { flex-direction:column; gap:2px; }
    .row-label { min-width:0; }
    .copy-btn { opacity:1; }
  }
</style>
</head>
<body>

<div class="progress-bar" id="progressBar"></div>

<div class="wrap">
  <div class="header">
    <div class="logo-row">
      <div class="logo">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>
        <h1>SeekIt</h1>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Mode">

(function animateCounter() {
  const el = document.getElementById("counter");
  const target = 22000000000;
  const duration = 2200;
  const start = performance.now();
  const format = n => {
    if (n >= 1e9) return (n / 1e9).toFixed(1).replace(".0", "") + " Md";
    if (n >= 1e6) return (n / 1e6).toFixed(0) + " M";
    return n.toLocaleString("fr-FR");
  };
  function step(now) {
    const t = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = format(Math.floor(target * eased));
    if (t < 1) requestAnimationFrame(step);
    else el.textContent = "22 Md";
  }
  requestAnimationFrame(step);
})();
