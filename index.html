<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSINT</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#000; color:#eaeaea;
    font-family:-apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height:100vh; display:flex; justify-content:center;
    padding:60px 20px;
  }
  .wrap { width:100%; max-width:680px; }
  h1 { font-size:1.1rem; font-weight:600; margin-bottom:4px; color:#fff; }
  .sub { font-size:0.75rem; color:#555; margin-bottom:32px; }
  input {
    background:#0d0d0d; border:1px solid #1e1e1e; color:#eaeaea;
    padding:12px 14px; border-radius:8px; font-size:0.85rem;
    font-family:inherit; outline:none;
    width:100%; margin-bottom:12px;
  }
  input:focus { border-color:#333; }
  button {
    width:100%; background:#fff; color:#000; border:none;
    padding:13px; border-radius:8px; font-size:0.85rem;
    font-weight:600; cursor:pointer;
    transition:opacity 0.15s;
  }
  button:hover { opacity:0.85; }
  button:active { opacity:0.7; }
  button:disabled { background:#1a1a1a; color:#555; cursor:default; }

  #out { margin-top:28px; }
  .status {
    font-size:0.72rem; color:#666; text-align:center;
    margin-bottom:14px; letter-spacing:0.5px;
  }
  .none {
    color:#666; font-size:0.82rem; text-align:center;
    padding:30px 20px;
  }
  .card {
    background:#0b0b0b; border:1px solid #3d2f1f; border-radius:10px;
    padding:14px 16px; margin-bottom:8px;
    display:flex; align-items:flex-start; gap:12px;
  }
  .card:hover { border-color:#5d4a2f; }
  .dot {
    width:8px; height:8px; border-radius:50%; flex-shrink:0;
    background:#ffaa4d; box-shadow:0 0 8px #ffaa4d88;
    margin-top:6px;
  }
  .info { flex:1; min-width:0; }
  .info a, .info .title {
    color:#eaeaea; text-decoration:none; font-size:0.85rem;
    display:block; word-break:break-word;
  }
  .info a:hover { color:#4da3ff; }
  .info .title { font-weight:500; }
  .meta { font-size:0.65rem; color:#555; margin-top:4px; word-break:break-all; line-height:1.4; }
  .meta a { color:#4da3ff; text-decoration:none; display:block; margin-top:2px; }
  .meta a:hover { text-decoration:underline; }
  .section-title {
    font-size:0.7rem; color:#888; text-transform:uppercase;
    letter-spacing:1px; margin:18px 0 10px;
  }
  .err {
    background:#1a0a0a; color:#ff6b6b; padding:12px;
    border-radius:8px; font-size:0.72rem; margin-top:14px;
    white-space:pre-wrap; word-break:break-word;
  }
  .raw {
    background:#0a0a0a; border:1px solid #1a1a1a; border-radius:8px;
    padding:12px; margin-top:14px; font-size:0.65rem; color:#888;
    max-height:400px; overflow:auto; white-space:pre-wrap;
    word-break:break-word; font-family:monospace;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>OSINT</h1>
  <div class="sub">recherche par prénom nom</div>

  <input id="target" placeholder="prénom nom..." autocomplete="off">
  <button id="go">Rechercher</button>

  <div id="out"></div>
</div>

<script>
/* ============================================================
   URL DU PROXY VERCEL
   Le proxy tourne dans /api/search et ajoute la clé BRIXHUB_KEY
   ============================================================ */
const PROXY_URL = "/api/search";

/* ============================================================
   UTILITAIRES
   ============================================================ */
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

function validate(t) {
  t = (t || "").trim();
  if (t.length < 3) return false;
  return /^[a-zA-ZÀ-ÿ'\- ]{2,}$/.test(t);
}

/* ============================================================
   APPEL AU PROXY VERCEL
   ============================================================ */
async function searchBrixHub(fullName) {
  const parts = fullName.trim().split(/\s+/);
  const firstName = parts[0] || "";
  const lastName = parts.slice(1).join(" ") || "";

  const url = `${PROXY_URL}?first_name=${encodeURIComponent(firstName)}&last_name=${encodeURIComponent(lastName)}`;

  try {
    const res = await fetch(url, { method: "GET" });
    const text = await res.text();
    let data = null;
    try { data = JSON.parse(text); } catch { data = text; }
    return { ok: res.ok, status: res.status, data };
  } catch (err) {
    return { ok: false, status: 0, data: null, error: err.message };
  }
}

/* ============================================================
   NORMALISATION DES RÉSULTATS
   Détecte automatiquement le format renvoyé par BrixHub
   ============================================================ */
function normalize(data) {
  const hits = [];
  if (!data) return hits;

  function findArray(obj, depth = 0) {
    if (depth > 4 || !obj) return null;
    if (Array.isArray(obj)) return obj;
    if (typeof obj === "object") {
      for (const k of ["results","data","items","records","hits","matches","persons","people"]) {
        if (Array.isArray(obj[k])) return obj[k];
      }
      for (const k of Object.keys(obj)) {
        const r = findArray(obj[k], depth + 1);
        if (r) return r;
      }
    }
    return null;
  }

  const arr = findArray(data);
  if (!arr) return hits;

  arr.slice(0, 30).forEach(item => {
    if (typeof item === "string") {
      hits.push({ title: item, url: "#" });
      return;
    }
    const title =
      item.full_name || item.fullName || item.name ||
      [item.first_name || item.firstName, item.last_name || item.lastName].filter(Boolean).join(" ") ||
      item.title || item.email || "Résultat";

    const url =
      item.url || item.profile_url || item.link || item.source_url ||
      (item.id ? `https://api.brixhub.to/api/v1/record/${item.id}` : "#");

    const extra = Object.entries(item)
      .filter(([k, v]) => v && typeof v !== "object" && k !== "url" && k !== "id")
      .map(([k, v]) => `${k}: ${v}`)
      .join(" · ");

    hits.push({ title: String(title).slice(0, 120), url, extra });
  });

  return hits;
}

/* ============================================================
   AFFICHAGE
   ============================================================ */
function render(result) {
  const out = document.getElementById("out");
  out.innerHTML = "";

  if (!result.ok) {
    const err = document.createElement("div");
    err.className = "err";
    err.textContent = `Échec (HTTP ${result.status})${result.error ? " — " + result.error : ""}\n\n${
      typeof result.data === "string" ? result.data : JSON.stringify(result.data, null, 2)
    }`;
    out.appendChild(err);
    return;
  }

  const hits = normalize(result.data);

  const status = document.createElement("div");
  status.className = "status";
  status.textContent = `${hits.length} résultat(s)`;
  out.appendChild(status);

  if (hits.length === 0) {
    const none = document.createElement("div");
    none.className = "none";
    none.textContent = "aucun résultat";
    out.appendChild(none);

    const raw = document.createElement("div");
    raw.className = "raw";
    raw.textContent = JSON.stringify(result.data, null, 2).slice(0, 4000);
    out.appendChild(raw);
    return;
  }

  const list = document.createElement("div");
  hits.forEach(h => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="dot"></div>
      <div class="info">
        <div class="title">${escapeHtml(h.title)}</div>
        ${h.extra ? `<div class="meta">${escapeHtml(h.extra)}</div>` : ""}
        ${h.url !== "#" ? `<div class="meta"><a href="${h.url}" target="_blank" rel="noopener">${escapeHtml(h.url)}</a></div>` : ""}
      </div>
    `;
    list.appendChild(card);
  });
  out.appendChild(list);

  const rawTitle = document.createElement("div");
  rawTitle.className = "section-title";
  rawTitle.textContent = "Réponse brute API";
  out.appendChild(rawTitle);

  const raw = document.createElement("div");
  raw.className = "raw";
  try {
    raw.textContent = JSON.stringify(result.data, null, 2).slice(0, 8000);
  } catch {
    raw.textContent = String(result.data).slice(0, 8000);
  }
  out.appendChild(raw);
}

/* ============================================================
   EVENT
   ============================================================ */
document.getElementById("go").addEventListener("click", async () => {
  const target = document.getElementById("target").value;
  const out = document.getElementById("out");
  const btn = document.getElementById("go");

  if (!validate(target)) {
    out.innerHTML = `<div class="none">entre un prénom et un nom valides</div>`;
    return;
  }

  btn.disabled = true;
  btn.textContent = "Recherche…";

  try {
    const result = await searchBrixHub(target.trim());
    render(result);
  } catch (e) {
    out.innerHTML = `<div class="err">${escapeHtml(e.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "Rechercher";
  }
});

document.getElementById("target").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("go").click();
});
</script>
</body>
</html>
