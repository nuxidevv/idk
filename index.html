<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSINT — Recherche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --bg:#000;
    --card:#0a0a0a;
    --border:#1a1a1a;
    --border-hover:#2a2a2a;
    --text:#eaeaea;
    --text-dim:#666;
    --text-dimmer:#444;
    --accent:#fff;
    --green:#00e07a;
    --green-dim:#0a2a1a;
    --orange:#ffaa4d;
    --orange-dim:#2a1a0a;
    --red:#ff6b6b;
    --blue:#4da3ff;
  }

  html, body { height:100%; }

  body {
    background:#000;
    color:var(--text);
    font-family:'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:60px 20px;
    overflow-x:hidden;
    position:relative;
  }

  /* Fond animé subtil */
  body::before {
    content:'';
    position:fixed;
    top:-50%; left:-50%;
    width:200%; height:200%;
    background:
      radial-gradient(circle at 20% 30%, rgba(0,224,122,0.04) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(77,163,255,0.04) 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(255,170,77,0.02) 0%, transparent 50%);
    animation:bgFloat 20s ease-in-out infinite;
    pointer-events:none;
    z-index:0;
  }

  @keyframes bgFloat {
    0%,100% { transform:translate(0,0) scale(1); }
    50% { transform:translate(-2%,2%) scale(1.05); }
  }

  /* Grille en fond */
  body::after {
    content:'';
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size:40px 40px;
    pointer-events:none;
    z-index:0;
    mask-image:radial-gradient(ellipse at center, black 20%, transparent 80%);
    -webkit-mask-image:radial-gradient(ellipse at center, black 20%, transparent 80%);
  }

  .wrap {
    width:100%; max-width:680px;
    position:relative; z-index:1;
  }

  /* Header */
  .header {
    margin-bottom:36px;
    animation:fadeUp 0.6s ease-out;
  }

  .logo {
    display:flex; align-items:center; gap:10px;
    margin-bottom:8px;
  }

  .logo-mark {
    width:28px; height:28px;
    border-radius:8px;
    background:linear-gradient(135deg, #fff 0%, #888 100%);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    overflow:hidden;
  }

  .logo-mark::after {
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.4) 50%, transparent 60%);
    animation:shimmer 3s ease-in-out infinite;
  }

  @keyframes shimmer {
    0% { transform:translateX(-100%); }
    100% { transform:translateX(100%); }
  }

  .logo-mark svg {
    width:16px; height:16px;
    color:#000;
    position:relative; z-index:1;
  }

  h1 {
    font-size:1.35rem;
    font-weight:700;
    color:#fff;
    letter-spacing:-0.02em;
  }

  .sub {
    font-size:0.75rem;
    color:var(--text-dim);
    letter-spacing:0.02em;
    display:flex;
    align-items:center;
    gap:6px;
  }

  .sub::before {
    content:'';
    width:4px; height:4px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 8px var(--green);
    animation:pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.4; transform:scale(0.8); }
  }

  /* Input */
  .input-wrap {
    position:relative;
    margin-bottom:12px;
    animation:fadeUp 0.6s ease-out 0.1s backwards;
  }

  .input-icon {
    position:absolute;
    left:14px; top:50%;
    transform:translateY(-50%);
    width:16px; height:16px;
    color:var(--text-dimmer);
    pointer-events:none;
    transition:color 0.2s;
  }

  input {
    background:#0a0a0a;
    border:1px solid var(--border);
    color:var(--text);
    padding:14px 14px 14px 42px;
    border-radius:10px;
    font-size:0.9rem;
    font-family:inherit;
    outline:none;
    width:100%;
    transition:border-color 0.2s, background 0.2s, box-shadow 0.2s;
  }

  input::placeholder { color:var(--text-dimmer); }

  input:focus {
    border-color:#333;
    background:#0d0d0d;
    box-shadow:0 0 0 4px rgba(255,255,255,0.03);
  }

  input:focus ~ .input-icon { color:#888; }

  /* Button */
  button {
    width:100%;
    background:#fff;
    color:#000;
    border:none;
    padding:14px;
    border-radius:10px;
    font-size:0.88rem;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    letter-spacing:0.01em;
    transition:transform 0.15s, opacity 0.15s, box-shadow 0.2s;
    position:relative;
    overflow:hidden;
    animation:fadeUp 0.6s ease-out 0.2s backwards;
  }

  button:hover:not(:disabled) {
    opacity:0.9;
    box-shadow:0 8px 24px rgba(255,255,255,0.1);
  }

  button:active:not(:disabled) { transform:scale(0.99); }

  button:disabled {
    background:#1a1a1a;
    color:#555;
    cursor:default;
  }

  button::after {
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(135deg, transparent 30%, rgba(0,0,0,0.1) 50%, transparent 70%);
    transform:translateX(-100%);
    transition:transform 0.6s;
  }

  button:hover:not(:disabled)::after { transform:translateX(100%); }

  /* Loading spinner dans le bouton */
  button .spinner {
    display:none;
    width:14px; height:14px;
    border:2px solid rgba(0,0,0,0.2);
    border-top-color:#000;
    border-radius:50%;
    animation:spin 0.7s linear infinite;
    margin-right:8px;
    vertical-align:middle;
  }

  button.loading .spinner { display:inline-block; }

  @keyframes spin { to { transform:rotate(360deg); } }

  #out { margin-top:28px; }

  /* Status */
  .status {
    font-size:0.72rem;
    color:var(--text-dim);
    text-align:center;
    margin-bottom:18px;
    letter-spacing:0.02em;
    animation:fadeUp 0.4s ease-out;
  }

  .none {
    color:var(--text-dim);
    font-size:0.85rem;
    text-align:center;
    padding:40px 20px;
    animation:fadeUp 0.4s ease-out;
  }

  /* Cards */
  .card {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:12px;
    transition:border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    animation:cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) backwards;
    position:relative;
    overflow:hidden;
  }

  .card::before {
    content:'';
    position:absolute;
    top:0; left:0;
    width:2px; height:100%;
    background:linear-gradient(180deg, var(--green), transparent);
    opacity:0.4;
  }

  .card:hover {
    border-color:var(--border-hover);
    transform:translateY(-1px);
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }

  .card:hover::before { opacity:1; }

  @keyframes cardIn {
    from { opacity:0; transform:translateY(12px); }
    to { opacity:1; transform:translateY(0); }
  }

  .card-header {
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px;
    padding-bottom:12px;
    border-bottom:1px solid #141414;
  }

  .card-title {
    font-size:0.95rem;
    font-weight:600;
    color:#fff;
    word-break:break-word;
    letter-spacing:-0.01em;
  }

  .card-sub {
    font-size:0.7rem;
    color:var(--text-dim);
    margin-top:4px;
    font-family:'JetBrains Mono', monospace;
  }

  .score {
    font-size:0.65rem;
    padding:4px 9px;
    border-radius:6px;
    background:var(--green-dim);
    color:var(--green);
    font-weight:700;
    flex-shrink:0;
    font-family:'JetBrains Mono', monospace;
    border:1px solid rgba(0,224,122,0.2);
  }

  .score.mid {
    background:var(--orange-dim);
    color:var(--orange);
    border-color:rgba(255,170,77,0.2);
  }

  .score.low {
    background:#2a0a0a;
    color:var(--red);
    border-color:rgba(255,107,107,0.2);
  }

  .row {
    display:flex;
    gap:14px;
    padding:6px 0;
    font-size:0.78rem;
    align-items:flex-start;
  }

  .row-label {
    color:var(--text-dim);
    min-width:110px;
    flex-shrink:0;
    font-size:0.7rem;
    padding-top:2px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    font-weight:500;
  }

  .row-value {
    color:var(--text);
    word-break:break-word;
    flex:1;
    font-size:0.82rem;
  }

  .row-value.mono {
    font-family:'JetBrains Mono', monospace;
    font-size:0.75rem;
  }

  .row-value a {
    color:var(--blue);
    text-decoration:none;
    transition:color 0.15s;
  }

  .row-value a:hover {
    color:#6fb5ff;
    text-decoration:underline;
  }

  .section-title {
    font-size:0.7rem;
    color:#888;
    text-transform:uppercase;
    letter-spacing:1.5px;
    margin:22px 0 12px;
    font-weight:600;
  }

  .err {
    background:#1a0a0a;
    color:var(--red);
    padding:14px 16px;
    border-radius:10px;
    font-size:0.75rem;
    margin-top:14px;
    white-space:pre-wrap;
    word-break:break-word;
    border:1px solid rgba(255,107,107,0.2);
    animation:fadeUp 0.4s ease-out;
  }

  /* Raw toggle */
  .raw-toggle {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    font-size:0.72rem;
    color:var(--text-dim);
    cursor:pointer;
    padding:12px;
    margin-top:14px;
    user-select:none;
    border-radius:8px;
    transition:color 0.15s, background 0.15s;
  }

  .raw-toggle:hover {
    color:#aaa;
    background:rgba(255,255,255,0.02);
  }

  .raw-toggle svg {
    width:12px; height:12px;
    transition:transform 0.25s;
  }

  .raw-toggle.open svg { transform:rotate(90deg); }

  .raw {
    background:#080808;
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px;
    margin-top:10px;
    font-size:0.65rem;
    color:#777;
    max-height:400px;
    overflow:auto;
    white-space:pre-wrap;
    word-break:break-word;
    font-family:'JetBrains Mono', monospace;
    line-height:1.6;
    display:none;
    animation:fadeUp 0.3s ease-out;
  }

  .raw.open { display:block; }

  /* Animations utilitaires */
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(8px); }
    to { opacity:1; transform:translateY(0); }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#222; border-radius:3px; }
  ::-webkit-scrollbar-thumb:hover { background:#333; }

  /* Sélection */
  ::selection { background:rgba(0,224,122,0.3); color:#fff; }

  @media (max-width:480px) {
    body { padding:40px 16px; }
    .row { flex-direction:column; gap:2px; }
    .row-label { min-width:0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
      <h1>OSINT</h1>
    </div>
    <div class="sub">recherche par prénom nom</div>
  </div>

  <div class="input-wrap">
    <input id="target" placeholder="prénom nom..." autocomplete="off" spellcheck="false">
    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
  </div>

  <button id="go">
    <span class="spinner"></span>
    <span class="btn-text">Rechercher</span>
  </button>

  <div id="out"></div>
</div>

<script>
const PROXY_URL = "/api/search";

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

function validate(t) {
  t = (t || "").trim();
  if (t.length < 3) return false;
  return /^[a-zA-ZÀ-ÿ'\- ]{2,}$/.test(t);
}

const LABELS = {
  _source_db: "Source",
  _confidence: "Fiabilité",
  adresse: "Adresse",
  annee_naissance: "Année naissance",
  code_postal: "Code postal",
  date_naissance: "Date de naissance",
  departement: "Département",
  email: "Email",
  lieu_naissance: "Lieu de naissance",
  nom_famille: "Nom",
  nom_utilisateur: "Pseudo",
  pays: "Pays",
  prenom: "Prénom",
  ville: "Ville",
  telephone: "Téléphone",
  phone: "Téléphone",
  genre: "Genre",
  sexe: "Sexe"
};

const ORDER = [
  "prenom","nom_famille","date_naissance","annee_naissance","lieu_naissance",
  "adresse","code_postal","ville","departement","pays",
  "email","telephone","phone","nom_utilisateur",
  "_source_db","_confidence","genre","sexe"
];

function labelOf(k) {
  return LABELS[k] || k.replace(/_/g, " ");
}

async function searchBrixHub(fullName) {
  const parts = fullName.trim().split(/\s+/);
  const firstName = parts[0] || "";
  const lastName = parts.slice(1).join(" ") || "";

  const url = `${PROXY_URL}?first_name=${encodeURIComponent(firstName)}&last_name=${encodeURIComponent(lastName)}`;

  try {
    const res = await fetch(url);
    const text = await res.text();
    let data = null;
    try { data = JSON.parse(text); } catch { data = text; }
    return { ok: res.ok, status: res.status, data };
  } catch (err) {
    return { ok: false, status: 0, error: err.message };
  }
}

function findArray(obj, depth = 0) {
  if (depth > 4 || !obj) return null;
  if (Array.isArray(obj)) return obj;
  if (typeof obj === "object") {
    for (const k of ["results","data","items","records","hits","matches","persons","people"]) {
      if (Array.isArray(obj[k])) return obj[k];
    }
    for (const k of Object.keys(obj)) {
      const r = findArray(obj[k], depth + 1);
      if (r) return r;
    }
  }
  return null;
}

function scoreClass(c) {
  const n = Number(c);
  if (!n || isNaN(n)) return "";
  if (n >= 70) return "";
  if (n >= 40) return "mid";
  return "low";
}

function renderCard(item, idx) {
  const prenom = item.prenom || item.first_name || "";
  const nom = item.nom_famille || item.last_name || item.name || "";
  const title = [prenom, nom].filter(Boolean).join(" ") || item.email || `Résultat ${idx + 1}`;
  const sub = item.email && (prenom || nom) ? item.email : "";

  const conf = item._confidence ?? item.confidence ?? null;
  const scoreHtml = conf != null
    ? `<div class="score ${scoreClass(conf)}">${escapeHtml(conf)}%</div>`
    : "";

  const keys = Object.keys(item).filter(k =>
    item[k] != null && item[k] !== "" && typeof item[k] !== "object"
  );
  const sorted = [
    ...ORDER.filter(k => keys.includes(k)),
    ...keys.filter(k => !ORDER.includes(k))
  ];

  const monoKeys = ["email","telephone","phone","nom_utilisateur","code_postal","date_naissance"];

  const rows = sorted.map(k => {
    let v = item[k];
    let html;
    if (k === "email") {
      html = `<a href="mailto:${escapeHtml(v)}">${escapeHtml(v)}</a>`;
    } else if (k === "telephone" || k === "phone") {
      html = `<a href="tel:${escapeHtml(v)}">${escapeHtml(v)}</a>`;
    } else {
      html = escapeHtml(v);
    }
    const monoClass = monoKeys.includes(k) ? " mono" : "";
    return `<div class="row"><div class="row-label">${escapeHtml(labelOf(k))}</div><div class="row-value${monoClass}">${html}</div></div>`;
  }).join("");

  return `
    <div class="card" style="animation-delay:${idx * 0.05}s">
      <div class="card-header">
        <div>
          <div class="card-title">${escapeHtml(title)}</div>
          ${sub ? `<div class="card-sub">${escapeHtml(sub)}</div>` : ""}
        </div>
        ${scoreHtml}
      </div>
      ${rows}
    </div>
  `;
}

function render(result) {
  const out = document.getElementById("out");
  out.innerHTML = "";

  if (!result.ok || !result.data) {
    const err = document.createElement("div");
    err.className = "err";
    err.textContent = `Échec (HTTP ${result.status})${result.error ? " — " + result.error : ""}\n\n${JSON.stringify(result.data, null, 2)}`;
    out.appendChild(err);
    return;
  }

  const arr = findArray(result.data) || [];

  const status = document.createElement("div");
  status.className = "status";
  status.textContent = `${arr.length} résultat(s) trouvé(s)`;
  out.appendChild(status);

  if (arr.length === 0) {
    const none = document.createElement("div");
    none.className = "none";
    none.textContent = "aucun résultat";
    out.appendChild(none);
  } else {
    const list = document.createElement("div");
    arr.forEach((item, i) => {
      if (typeof item === "string") item = { valeur: item };
      list.insertAdjacentHTML("beforeend", renderCard(item, i));
    });
    out.appendChild(list);
  }

  const toggle = document.createElement("div");
  toggle.className = "raw-toggle";
  toggle.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg> Afficher la réponse brute`;
  out.appendChild(toggle);

  const raw = document.createElement("div");
  raw.className = "raw";
  try { raw.textContent = JSON.stringify(result.data, null, 2); }
  catch { raw.textContent = String(result.data); }
  out.appendChild(raw);

  toggle.addEventListener("click", () => {
    raw.classList.toggle("open");
    toggle.classList.toggle("open");
    toggle.innerHTML = toggle.classList.contains("open")
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg> Masquer la réponse brute`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg> Afficher la réponse brute`;
  });
}

document.getElementById("go").addEventListener("click", async () => {
  const target = document.getElementById("target").value;
  const out = document.getElementById("out");
  const btn = document.getElementById("go");
  const btnText = btn.querySelector(".btn-text");

  if (!validate(target)) {
    out.innerHTML = `<div class="none">entre un prénom et un nom valides</div>`;
    return;
  }

  btn.disabled = true;
  btn.classList.add("loading");
  btnText.textContent = "Recherche…";

  try {
    const result = await searchBrixHub(target.trim());
    render(result);
  } catch (e) {
    out.innerHTML = `<div class="err">${escapeHtml(e.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.classList.remove("loading");
    btnText.textContent = "Rechercher";
  }
});

document.getElementById("target").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("go").click();
});
</script>
</body>
</html>
