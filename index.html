<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSINT AI</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#000;
    color:#eaeaea;
    font-family:-apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:60px 20px;
  }
  .wrap { width:100%; max-width:640px; }
  h1 {
    font-size:1.1rem;
    font-weight:600;
    letter-spacing:0.5px;
    margin-bottom:4px;
    color:#fff;
  }
  .sub {
    font-size:0.75rem;
    color:#555;
    margin-bottom:32px;
  }
  .row { display:flex; gap:10px; margin-bottom:12px; }
  select, input {
    background:#0d0d0d;
    border:1px solid #1e1e1e;
    color:#eaeaea;
    padding:12px 14px;
    border-radius:8px;
    font-size:0.85rem;
    font-family:inherit;
    outline:none;
    transition:border 0.15s;
  }
  select { width:150px; }
  input { flex:1; }
  select:focus, input:focus { border-color:#333; }
  button {
    width:100%;
    background:#fff;
    color:#000;
    border:none;
    padding:13px;
    border-radius:8px;
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
    transition:opacity 0.15s;
  }
  button:hover { opacity:0.85; }
  button:disabled { background:#1a1a1a; color:#555; cursor:default; }
  #out { margin-top:28px; }
  .empty {
    color:#444;
    font-size:0.8rem;
    text-align:center;
    padding:20px;
  }
  .card {
    background:#0b0b0b;
    border:1px solid #181818;
    border-radius:10px;
    padding:16px 18px;
    margin-bottom:10px;
  }
  .card .label {
    font-size:0.68rem;
    color:#666;
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:8px;
  }
  .card .value {
    font-size:0.85rem;
    color:#eaeaea;
    line-height:1.5;
    word-break:break-word;
  }
  .card a { color:#4da3ff; text-decoration:none; }
  .card a:hover { text-decoration:underline; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; }
  .tag {
    background:#141414;
    border:1px solid #222;
    border-radius:6px;
    padding:6px 12px;
    font-size:0.75rem;
  }
  .tag a { color:#eaeaea; }
  .score {
    font-size:0.75rem;
    color:#666;
    margin-bottom:20px;
    text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>OSINT AI</h1>
  <div class="sub">email · username · nom prénom</div>

  <div class="row">
    <select id="type">
      <option value="email">Email</option>
      <option value="username">Username</option>
      <option value="fullname">Nom Prénom</option>
    </select>
    <input id="target" placeholder="cible..." autocomplete="off">
  </div>
  <button id="go">Rechercher</button>

  <div id="out"></div>
</div>

<script>
// Génère les dorks selon le type de cible
function buildDorks(type, t) {
  t = t.trim();
  if (type === "email") return [
    `"${t}"`,
    `"${t}" site:pastebin.com`,
    `"${t}" filetype:pdf`,
    `"${t}" -site:${t.split("@")[1] || "mail.com"}`
  ];
  if (type === "username") return [
    `"${t}" site:github.com`,
    `"${t}" (site:twitter.com OR site:x.com)`,
    `"${t}" site:reddit.com`,
    `"${t}" inurl:profile`,
    `intitle:"${t}"`
  ];
  const p = t.split(/\s+/);
  if (p.length >= 2) return [
    `"${p[0]}" "${p[1]}"`,
    `"${p[0]} ${p[1]}" site:linkedin.com`,
    `"${p[0]} ${p[1]}" site:facebook.com`,
    `"${p[0]} ${p[1]}" filetype:pdf`,
    `"${p[0]} ${p[1]}" email OR contact`
  ];
  return [`"${t}"`];
}

// Liens directs vers outils OSINT selon type
function buildTools(type, t) {
  const e = encodeURIComponent(t.trim());
  if (type === "email") return [
    ["Have I Been Pwned", `https://haveibeenpwned.com/account/${e}`],
    ["Hunter.io", `https://hunter.io/search/${e}`],
    ["Epieos", `https://epieos.com/?q=${e}`]
  ];
  if (type === "username") return [
    ["WhatsMyName", `https://whatsmyname.app/?q=${e}`],
    ["GitHub Users", `https://github.com/search?q=${e}&type=users`],
    ["Namechk", `https://namechk.com/?q=${e}`]
  ];
  return [
    ["LinkedIn", `https://www.linkedin.com/search/results/all/?keywords=${e}`],
    ["TruePeopleSearch", `https://www.truepeoplesearch.com/results?name=${e}`],
    ["Facebook", `https://www.facebook.com/search/top?q=${e}`]
  ];
}

// Score IA local — heuristique de pertinence du format de cible
function aiScore(type, t) {
  t = t.trim();
  let s = 0;
  if (type === "email") {
    if (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(t)) s += 60;
    if (/\d/.test(t)) s += 20;
    if (t.length > 15) s += 20;
  } else if (type === "username") {
    if (/^[a-zA-Z0-9_.]+$/.test(t)) s += 40;
    if (t.length >= 6 && t.length <= 15) s += 40;
    if (/\d/.test(t)) s += 20;
  } else {
    const p = t.split(/\s+/);
    if (p.length >= 2) s += 50;
    if (p.every(x => /^[A-Za-zÀ-ÿ-]+$/.test(x))) s += 30;
    if (t.length > 8) s += 20;
  }
  return Math.min(s, 100);
}

// Rendu final : uniquement les résultats exploitables
function render(type, target) {
  const out = document.getElementById("out");
  const dorks = buildDorks(type, target);
  const tools = buildTools(type, target);
  const score = aiScore(type, target);

  let html = `<div class="score">pertinence ${score}/100</div>`;

  if (dorks.length) {
    html += `<div class="card"><div class="label">Google Dorks</div><div class="value">`;
    dorks.forEach(d => {
      const q = encodeURIComponent(d);
      html += `<div>· ${d} — <a href="https://www.google.com/search?q=${q}" target="_blank">Google</a></div>`;
    });
    html += `</div></div>`;
  }

  if (tools.length) {
    html += `<div class="card"><div class="label">Outils</div><div class="tags">`;
    tools.forEach(([n, u]) => {
      html += `<span class="tag"><a href="${u}" target="_blank">${n}</a></span>`;
    });
    html += `</div></div>`;
  }

  out.innerHTML = html;
}

document.getElementById("go").addEventListener("click", () => {
  const type = document.getElementById("type").value;
  const target = document.getElementById("target").value;
  const out = document.getElementById("out");
  if (!target.trim()) {
    out.innerHTML = `<div class="empty">saisir une cible</div>`;
    return;
  }
  out.innerHTML = `<div class="empty">analyse...</div>`;
  setTimeout(() => render(type, target), 300);
});
</script>
</body>
</html>
