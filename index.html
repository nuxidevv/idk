<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSINT AI</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#000;
    color:#eaeaea;
    font-family:-apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:60px 20px;
  }
  .wrap { width:100%; max-width:640px; }
  h1 {
    font-size:1.1rem;
    font-weight:600;
    letter-spacing:0.5px;
    margin-bottom:4px;
    color:#fff;
  }
  .sub {
    font-size:0.75rem;
    color:#555;
    margin-bottom:32px;
  }
  .row { display:flex; gap:10px; margin-bottom:12px; }
  select, input {
    background:#0d0d0d;
    border:1px solid #1e1e1e;
    color:#eaeaea;
    padding:12px 14px;
    border-radius:8px;
    font-size:0.85rem;
    font-family:inherit;
    outline:none;
    transition:border 0.15s;
  }
  select { width:150px; }
  input { flex:1; }
  select:focus, input:focus { border-color:#333; }
  button {
    width:100%;
    background:#fff;
    color:#000;
    border:none;
    padding:13px;
    border-radius:8px;
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
    transition:opacity 0.15s;
  }
  button:hover { opacity:0.85; }
  button:disabled { background:#1a1a1a; color:#555; cursor:default; }
  #out { margin-top:28px; }
  .empty {
    color:#444;
    font-size:0.8rem;
    text-align:center;
    padding:20px;
  }
  .card {
    background:#0b0b0b;
    border:1px solid #181818;
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:8px;
    transition:border 0.15s;
  }
  .card:hover { border-color:#2a2a2a; }
  .card a {
    color:#eaeaea;
    text-decoration:none;
    display:block;
    font-size:0.85rem;
  }
  .card a:hover { color:#4da3ff; }
  .card .meta {
    font-size:0.68rem;
    color:#555;
    margin-top:4px;
  }
  .count {
    font-size:0.7rem;
    color:#555;
    margin-bottom:14px;
    text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>OSINT AI</h1>
  <div class="sub">email · username · nom prénom</div>

  <div class="row">
    <select id="type">
      <option value="email">Email</option>
      <option value="username">Username</option>
      <option value="fullname">Nom Prénom</option>
    </select>
    <input id="target" placeholder="cible..." autocomplete="off">
  </div>
  <button id="go">Rechercher</button>

  <div id="out"></div>
</div>

<script>
// Retourne la liste des plateformes où la cible peut être trouvée selon le type
function buildSites(type, t) {
  t = t.trim();
  const e = encodeURIComponent(t);
  if (type === "email") return [
    { name: "Google", url: `https://www.google.com/search?q=${e}` },
    { name: "Have I Been Pwned", url: `https://haveibeenpwned.com/account/${e}` },
    { name: "Hunter.io", url: `https://hunter.io/search/${e}` },
    { name: "Epieos", url: `https://epieos.com/?q=${e}` },
    { name: "EmailRep", url: `https://emailrep.io/${e}` },
    { name: "Pastebin", url: `https://www.google.com/search?q=${e}+site:pastebin.com` }
  ];
  if (type === "username") return [
    { name: "Google", url: `https://www.google.com/search?q=${e}` },
    { name: "GitHub", url: `https://github.com/search?q=${e}&type=users` },
    { name: "Twitter / X", url: `https://x.com/${e}` },
    { name: "Reddit", url: `https://www.reddit.com/user/${e}` },
    { name: "Instagram", url: `https://www.instagram.com/${e}` },
    { name: "TikTok", url: `https://www.tiktok.com/@${e}` },
    { name: "WhatsMyName", url: `https://whatsmyname.app/?q=${e}` },
    { name: "Namechk", url: `https://namechk.com/?q=${e}` }
  ];
  const p = t.split(/\s+/);
  const first = p[0] || "";
  const last = p[1] || "";
  const fe = encodeURIComponent(first);
  const le = encodeURIComponent(last);
  return [
    { name: "Google", url: `https://www.google.com/search?q=${e}` },
    { name: "LinkedIn", url: `https://www.linkedin.com/search/results/all/?keywords=${e}` },
    { name: "Facebook", url: `https://www.facebook.com/search/top?q=${e}` },
    { name: "Instagram", url: `https://www.instagram.com/${encodeURIComponent(first + last)}` },
    { name: "TruePeopleSearch", url: `https://www.truepeoplesearch.com/results?name=${e}` },
    { name: "FastPeopleSearch", url: `https://www.fastpeoplesearch.com/name/${fe}-${le}` }
  ];
}

// Score IA local — heuristique de validité du format de cible
function aiScore(type, t) {
  t = t.trim();
  let s = 0;
  if (type === "email") {
    if (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(t)) s += 60;
    if (/\d/.test(t)) s += 20;
    if (t.length > 15) s += 20;
  } else if (type === "username") {
    if (/^[a-zA-Z0-9_.]+$/.test(t)) s += 40;
    if (t.length >= 6 && t.length <= 15) s += 40;
    if (/\d/.test(t)) s += 20;
  } else {
    const p = t.split(/\s+/);
    if (p.length >= 2) s += 50;
    if (p.every(x => /^[A-Za-zÀ-ÿ-]+$/.test(x))) s += 30;
    if (t.length > 8) s += 20;
  }
  return Math.min(s, 100);
}

// Rendu : uniquement les sites exploitables avec lien cliquable
function render(type, target) {
  const out = document.getElementById("out");
  const sites = buildSites(type, target);
  const score = aiScore(type, target);

  if (!sites.length) {
    out.innerHTML = `<div class="empty">aucun résultat</div>`;
    return;
  }

  let html = `<div class="count">${sites.length} site(s) · pertinence ${score}/100</div>`;
  sites.forEach(s => {
    html += `<div class="card">
      <a href="${s.url}" target="_blank" rel="noopener">${s.name}</a>
      <div class="meta">${s.url}</div>
    </div>`;
  });
  out.innerHTML = html;
}

document.getElementById("go").addEventListener("click", () => {
  const type = document.getElementById("type").value;
  const target = document.getElementById("target").value;
  const out = document.getElementById("out");
  if (!target.trim()) {
    out.innerHTML = `<div class="empty">saisir une cible</div>`;
    return;
  }
  out.innerHTML = `<div class="empty">analyse...</div>`;
  setTimeout(() => render(type, target), 300);
});
</script>
</body>
</html>
