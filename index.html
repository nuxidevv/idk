<html lang="fr">
<head>

<title>OSINT</title>
<style>

  }
  .criteria-input-row button {

  }
  .criteria-active {
    display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;
  }
  .criteria-tag {
    background:#1f3d5a; color:#a8d4ff;
    padding:5px 10px; border-radius:6px;
    font-size:0.7rem; font-weight:500;
    display:flex; align-items:center; gap:6px;
  }
  .criteria-tag span {
    cursor:pointer; opacity:0.6; font-weight:bold;
  }
  .criteria-tag span:hover { opacity:1; }

  #out { margin-top:28px; }
  .status {
    font-size:0.72rem; color:#666; text-align:center;
    margin-bottom:14px; letter-spacing:0.5px;
  }
  .none {
    color:#666; font-size:0.82rem; text-align:center;
    padding:30px 20px;
  }
  .card {
    background:#0b0b0b; border:1px solid #1f3d2a; border-radius:10px;

  .card:hover { border-color:#2f5d3f; }
  .card.dork-card { border-color:#1f3d5a; }
  .card.dork-card:hover { border-color:#2f5d8f; }
  .dot {

  .dot.blue { background:#4da3ff; box-shadow:0 0 8px #4da3ff88; }

  .badge.neg { background:#3d1f1f; color:#ff6b6b; }
  .section-title {
    font-size:0.7rem; color:#888; text-transform:uppercase;
    letter-spacing:1px; margin:18px 0 10px;
  }
  .err {
    background:#1a0a0a; color:#ff6b6b; padding:12px;

</style>

  <div class="sub">recherche approfondie par prénom nom</div>

    <div class="criteria-grid" id="criteriaGrid">

<script>
/* ============================================================
   CAPTURE D'ERREURS
   ============================================================ */
window.addEventListener("error", e => {
  const out = document.getElementById("out");
  if (out) out.innerHTML = `<div class="err">Erreur : ${e.message}</div>`;
});

/* ============================================================
   PROXY CORS avec timeout court (2s par proxy)
   ============================================================ */
const PROXIES = [
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
  u => `https://corsproxy.io/?${encodeURIComponent(u)}`
];

async function fetchWithTimeout(url, ms) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  try {
    const r = await fetch(url, { signal: controller.signal });
    clearTimeout(timer);
    return r;
  } catch (e) {
    clearTimeout(timer);
    throw e;
  }
}

async function P(url) {
  // Lance les 3 proxies en parallèle, prend le premier qui répond
  const promises = PROXIES.map(p =>
    fetchWithTimeout(p(url), 6000).then(r => r.ok ? r : Promise.reject())
  );
  return Promise.any(promises);
}

/* ============================================================
   APIs OFFICIELLES PSEUDO (rapides, CORS direct)
   ============================================================ */
async function vGitHub(u) {
  try {
    const r = await fetchWithTimeout(`https://api.github.com/users/${u}`, 5000);
    if (r.status === 200) {
      const j = await r.json();
      return { exists:true, confidence:1, reason:`${j.public_repos} repos · ${j.followers} followers` };
    }
    return { exists:false, confidence:1, reason:"404" };
  } catch { return { exists:false, confidence:0, reason:"timeout" }; }
}

async function vReddit(u) {
  try {
    const r = await fetchWithTimeout(`https://www.reddit.com/user/${u}/about.json`, 5000);
    if (r.status !== 200) return { exists:false, confidence:1, reason:"404" };
    const j = await r.json();
    if (j?.data?.name) {
      return { exists:true, confidence:1, reason:`karma: ${j.data.link_karma + j.data.comment_karma}` };
    }
    return { exists:false, confidence:1, reason:"pas de donnée" };
  } catch { return { exists:false, confidence:0, reason:"timeout" }; }
}

async function vGitLab(u) {
  try {
    const r = await fetchWithTimeout(`https://gitlab.com/api/v4/users?username=${u}`, 5000);
    if (r.status !== 200) return { exists:false, confidence:1, reason:"404" };
    const j = await r.json();
    if (Array.isArray(j) && j.length > 0) {
      return { exists:true, confidence:1, reason:j[0].name || j[0].username };
    }
    return { exists:false, confidence:1, reason:"liste vide" };
  } catch { return { exists:false, confidence:0, reason:"timeout" }; }
}

/* ============================================================
   CHECKER HTML
   ============================================================ */
function htmlCheck(options) {
  const { negatives = [], positives = [], minScore = 0.4 } = options;
  return async (u, url) => {
    try {
      const r = await P(url);
      if (r.status !== 200) return { exists:false, confidence:1, reason:`HTTP ${r.status}` };
      const html = await r.text();
      const low = html.toLowerCase();

      for (const n of negatives) {
        if (low.includes(n.toLowerCase())) {
          return { exists:false, confidence:0.9, reason:`négatif` };
        }
      }

      let found = 0;
      const hits = [];
      for (const p of positives) {
        if (low.includes(p.toLowerCase())) { found++; hits.push(p); }
      }

      const ratio = positives.length > 0 ? found / positives.length : 0.5;
      return {
        exists: ratio >= minScore,
        confidence: Math.min(0.5 + ratio * 0.4, 0.9),
        reason: hits.length ? hits.slice(0,2).join(", ") : `${found}/${positives.length} signaux`
      };
    } catch {
      return { exists:false, confidence:0, reason:"timeout" };
    }
  };
}

/* ============================================================
   PLATEFORMES — réduites aux plus fiables pour rapidité
   ============================================================ */
const PLATFORMS = [
  ["GitHub", u=>`https://github.com/${u}`, vGitHub],
  ["GitLab", u=>`https://gitlab.com/${u}`, vGitLab],
  ["Reddit", u=>`https://www.reddit.com/user/${u}`, vReddit],
  ["Instagram", u=>`https://www.instagram.com/${u}/`, htmlCheck({
    negatives: ["sorry, this page isn't available","page not found"],
    positives: ["og:title","profile_pic_url","biography","followers"]
  })],
  ["TikTok", u=>`https://www.tiktok.com/@${u}`, htmlCheck({
    negatives: ["couldn't find this account","not found"],
    positives: ["uniqueid","nickname","followercount","avatarLarger"]

  ["Twitter / X", u=>`https://x.com/${u}`, htmlCheck({

    positives: ["og:title","screen_name","followers_count"]

  ["Facebook", u=>`https://www.facebook.com/${u}`, htmlCheck({

    positives: ["og:title","profile_id","cover_photo"]
  })],
  ["YouTube", u=>`https://www.youtube.com/@${u}`, htmlCheck({

  })],
  ["Twitch", u=>`https://www.twitch.tv/${u}`, htmlCheck({

    positives: ["og:title","channel","follower"]
  })],
  ["Pinterest", u=>`https://www.pinterest.com/${u}/`, htmlCheck({

    positives: ["og:title","profile","pins"]
  })],
  ["Medium", u=>`https://medium.com/@${u}`, htmlCheck({
    negatives: ["out of nothing","404"],
    positives: ["og:title","profile","followers"]
  })],
  ["Steam", u=>`https://steamcommunity.com/id/${u}`, htmlCheck({

    positives: ["profile_header","persona_name"]
  })],
  ["SoundCloud", u=>`https://soundcloud.com/${u}`, htmlCheck({

    positives: ["og:title","followers_count","tracks"]
  })],
  ["Behance", u=>`https://www.behance.net/${u}`, htmlCheck({

  })],
  ["VK", u=>`https://vk.com/${u}`, htmlCheck({

    positives: ["og:title","profile","friends"]
  })],
  ["Flickr", u=>`https://www.flickr.com/people/${u}`, htmlCheck({
    negatives: ["page not found","404"],
    positives: ["og:title","flickr","photostream"]
  })],
  ["Quora", u=>`https://www.quora.com/profile/${u}`, htmlCheck({
    negatives: ["page not found","404","we couldn't find"],
    positives: ["og:title","quora","profile"]
  })],
  ["Vimeo", u=>`https://vimeo.com/${u}`, htmlCheck({
    negatives: ["page not found","404"],
    positives: ["og:title","vimeo","profile"]
  })],
  ["Dev.to", u=>`https://dev.to/${u}`, htmlCheck({
    negatives: ["not found","404"],
    positives: ["og:title","dev.to","profile"]
  })],
  ["HackerNews", u=>`https://news.ycombinator.com/user?id=${u}`, htmlCheck({
    negatives: ["no such user","sorry"],
    positives: ["karma","created","about"]
  })],
  ["ArtStation", u=>`https://www.artstation.com/${u}`, htmlCheck({
    negatives: ["not found","404"],
    positives: ["og:title","artstation","profile"]
  })]
];

/* ============================================================
   GOOGLE DORKS
   ============================================================ */
function buildDorks(fullName, criteria) {
  const dorks = [
    { label: "Nom complet exact",     q: `"${fullName}"` },
    { label: "Nom + LinkedIn",        q: `"${fullName}" site:linkedin.com` },
    { label: "Nom + Facebook",        q: `"${fullName}" site:facebook.com` },
    { label: "Nom + Instagram",       q: `"${fullName}" site:instagram.com` },
    { label: "Nom + GitHub",          q: `"${fullName}" site:github.com` },
    { label: "Nom + PDF",             q: `"${fullName}" filetype:pdf` },
    { label: "Nom + CV",              q: `"${fullName}" (CV OR resume)` },
    { label: "Nom + Email",           q: `"${fullName}" (email OR contact)` },
  ];

  // Ajoute un dork par critère actif
  for (const { crit, value } of criteria) {
    const critMap = {
      email:    `"${fullName}" "${value}"`,
      username: `"${fullName}" "${value}"`,
      phone:    `"${fullName}" "${value}"`,
      city:     `"${fullName}" "${value}"`,
      country:  `"${fullName}" "${value}"`,
      company:  `"${fullName}" "${value}" (LinkedIn OR site:linkedin.com)`,
      school:   `"${fullName}" "${value}"`,
      job:      `"${fullName}" "${value}"`,
      birth:    `"${fullName}" "${value}"`,
      site:     `"${fullName}" site:${value}`,
      linkedin: `"${fullName}" site:linkedin.com "${value}"`,
      twitter:  `"${fullName}" (site:twitter.com OR site:x.com) "${value}"`,
      github:   `"${fullName}" site:github.com "${value}"`,
      facebook: `"${fullName}" site:facebook.com "${value}"`,
      instagram:`"${fullName}" site:instagram.com "${value}"`,
    };
    if (critMap[crit]) {
      dorks.push({ label: `${crit}: ${value}`, q: critMap[crit] });
    }
  }

  return dorks;
}

// DuckDuckGo HTML — récupère les résultats
async function searchDork(query) {
  try {
    const ddgUrl = `https://html.duckduckgo.com/html/?q=${encodeURIComponent(query)}`;
    const r = await P(ddgUrl);
    if (r.status !== 200) return { found:false, count:0, hits:[] };
    const html = await r.text();

    const results = [];
    // Regex sur les liens de résultats DDG
    const regex = /<a[^>]*class="result__a"[^>]*href="([^"]+)"[^>]*>([\s\S]*?)<\/a>/g;
    let m;
    while ((m = regex.exec(html)) !== null && results.length < 4) {
      let url = m[1];
      // DDG encode l'URL réelle dans uddg=
      const uddg = url.match(/uddg=([^&]+)/);
      if (uddg) url = decodeURIComponent(uddg[1]);
      const title = m[2].replace(/<[^>]+>/g, "").replace(/&amp;/g,"&").trim();
      if (title && url && url.startsWith("http")) {
        results.push({ title: title.slice(0,80), url });
      }
    }

    return { found: results.length > 0, count: results.length, hits: results };
  } catch (e) {
    return { found:false, count:0, hits:[] };
  }
}

/* ============================================================
   RECHERCHE PROFONDE — AFFICHAGE AU FUR ET À MESURE
   ============================================================ */
async function renderDeepSearch(fullName, criteria) {
  const out = document.getElementById("out");
  out.innerHTML = "";

  const dorks = buildDorks(fullName, criteria);

  // Variantes de pseudo
  const parts = fullName.trim().toLowerCase().split(/\s+/);
  const first = parts[0];
  const last = parts.slice(1).join("");
  const variants = [...new Set([
    first + last,
    first + "." + last,
    first + "_" + last,
    first[0] + last,
    first + last[0],
    first + "-" + last
  ])].filter(u => u && u.length >= 3);

  // Compteur global
  const total = dorks.length + (variants.length * PLATFORMS.length);
  let done = 0;
  let foundCount = 0;

  const statusEl = document.createElement("div");
  statusEl.className = "status";
  statusEl.textContent = `0/${total} analysé…`;
  out.appendChild(statusEl);

  // Sections créées à l'avance
  const sectionDorks = document.createElement("div");
  const dorksList = document.createElement("div");
  sectionDorks.innerHTML = `<div class="section-title">Google Dorks</div>`;
  sectionDorks.appendChild(dorksList);
  out.appendChild(sectionDorks);

  const sectionPlatforms = document.createElement("div");
  const platformsList = document.createElement("div");
  sectionPlatforms.innerHTML = `<div class="section-title">Profils plateformes</div>`;
  sectionPlatforms.appendChild(platformsList);
  out.appendChild(sectionPlatforms);

  const noDorkEl = document.createElement("div");
  noDorkEl.className = "none";
  noDorkEl.textContent = "aucun dork positif";
  dorksList.appendChild(noDorkEl);

  const noPlatEl = document.createElement("div");
  noPlatEl.className = "none";
  noPlatEl.textContent = "aucun profil trouvé";
  platformsList.appendChild(noPlatEl);

  let dorkFound = 0;
  let platFound = 0;

  function updateStatus() {
    statusEl.textContent = `${done}/${total} analysé · ${foundCount} résultat(s)`;
  }

  // 1) Lance tous les dorks en parallèle
  dorks.forEach(async (dork) => {
    const result = await searchDork(dork.q);
    done++;
    if (result.found) {
      foundCount++;
      dorkFound++;
      if (dorkFound === 1) noDorkEl.remove();
      const card = document.createElement("div");
      card.className = "card dork-card";
      const hitsHtml = result.hits.slice(0,3).map(h =>
        `<a href="${h.url}" target="_blank" rel="noopener">${escapeHtml(h.title)}</a>`
      ).join("");
      card.innerHTML = `
        <div class="dot blue"></div>
        <div class="info">
          <div class="title">${escapeHtml(dork.label)}
            <span class="badge ok">${result.count}</span>
          </div>
          <div class="meta">${escapeHtml(dork.q)}</div>
          <div class="meta">${hitsHtml}</div>
        </div>
      `;
      dorksList.appendChild(card);
    }
    updateStatus();
  });

  // 2) Lance toutes les plateformes × variantes
  variants.forEach(variant => {
    PLATFORMS.forEach(async ([name, urlFn, checker]) => {
      const url = urlFn(variant);
      let res;
      try {
        res = await checker(variant, url);
      } catch {
        res = { exists:false, confidence:0, reason:"erreur" };
      }
      done++;
      if (res && res.exists && res.confidence >= 0.5) {
        foundCount++;
        platFound++;
        if (platFound === 1) noPlatEl.remove();
        const conf = Math.round((res.confidence || 0) * 100);
        const badgeCls = res.confidence >= 0.85 ? "ok" : "warn";
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="dot"></div>
          <div class="info">
            <a href="${url}" target="_blank" rel="noopener">${name}
              <span class="badge ${badgeCls}">${conf}%</span>
            </a>
            <div class="meta">${escapeHtml(url)}</div>
            <div class="meta">variante: ${escapeHtml(variant)} · ${escapeHtml(res.reason || "")}</div>
          </div>
        `;
        platformsList.appendChild(card);
      }
      updateStatus();
    });
  });
}

/* ============================================================
   UI — CRITÈRES MULTIPLES
   ============================================================ */
const activeCriteria = [];
let selectedCrit = null;

document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    const crit = chip.dataset.crit;
    // Toggle : un seul chip actif à la fois pour saisir sa valeur
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    if (selectedCrit === crit) {
      selectedCrit = null;
    } else {
      chip.classList.add("active");
      selectedCrit = crit;
    }
    document.getElementById("extraValue").focus();
  });
});

document.getElementById("addCrit").addEventListener("click", () => {
  const val = document.getElementById("extraValue").value.trim();
  if (!selectedCrit || !val) return;

  // Évite les doublons
  if (!activeCriteria.some(c => c.crit === selectedCrit && c.value === val)) {
    activeCriteria.push({ crit: selectedCrit, value: val });
  }

  // Reset
  document.getElementById("extraValue").value = "";
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  selectedCrit = null;

  renderActiveCriteria();
});

function renderActiveCriteria() {
  const el = document.getElementById("activeCriteria");
  el.innerHTML = "";
  activeCriteria.forEach((c, i) => {
    const tag = document.createElement("div");
    tag.className = "criteria-tag";
    tag.innerHTML = `${escapeHtml(c.crit)}: ${escapeHtml(c.value)} <span data-i="${i}">×</span>`;
    tag.querySelector("span").addEventListener("click", () => {
      activeCriteria.splice(i, 1);
      renderActiveCriteria();
    });
    el.appendChild(tag);
  });
}

/* ============================================================
   UTILITAIRES
   ============================================================ */
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

function validate(t) {
  t = (t || "").trim();
  if (t.length < 3) return false;
  return /^[a-zA-ZÀ-ÿ'\- ]{2,}$/.test(t);
}

/* ============================================================
   EVENT
   ============================================================ */
document.getElementById("go").addEventListener("click", () => {
  const target = document.getElementById("target").value;
  const out = document.getElementById("out");
  const btn = document.getElementById("go");

  if (!validate(target)) {
    out.innerHTML = `<div class="none">entre un prénom et un nom valides</div>`;
    return;
  }

  btn.disabled = true;
  btn.textContent = "Recherche en cours…";

  renderDeepSearch(target.trim(), [...activeCriteria]).finally(() => {
    btn.disabled = false;
    btn.textContent = "Rechercher";
  });
});

document.getElementById("target").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("go").click();
});
</script>
