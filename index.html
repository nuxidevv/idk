<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSINT AI</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#000; color:#eaeaea;
    font-family:-apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height:100vh; display:flex; justify-content:center;
    padding:60px 20px;
  }
  .wrap { width:100%; max-width:640px; }
  h1 { font-size:1.1rem; font-weight:600; margin-bottom:4px; color:#fff; }
  .sub { font-size:0.75rem; color:#555; margin-bottom:32px; }
  .row { display:flex; gap:10px; margin-bottom:12px; }
  select, input {
    background:#0d0d0d; border:1px solid #1e1e1e; color:#eaeaea;
    padding:12px 14px; border-radius:8px; font-size:0.85rem;
    font-family:inherit; outline:none;
  }
  select { width:150px; }
  input { flex:1; }
  select:focus, input:focus { border-color:#333; }
  button {
    width:100%; background:#fff; color:#000; border:none;
    padding:13px; border-radius:8px; font-size:0.85rem;
    font-weight:600; cursor:pointer;
  }
  button:hover { opacity:0.85; }
  button:disabled { background:#1a1a1a; color:#555; cursor:default; }
  #out { margin-top:28px; }
  .status {
    font-size:0.72rem; color:#666; text-align:center;
    margin-bottom:14px; letter-spacing:0.5px;
  }
  .empty { color:#444; font-size:0.8rem; text-align:center; padding:20px; }
  .none {
    color:#666; font-size:0.82rem; text-align:center;
    padding:30px 20px;
  }
  .card {
    background:#0b0b0b; border:1px solid #1f3d2a; border-radius:10px;
    padding:14px 16px; margin-bottom:8px;
    display:flex; align-items:center; gap:12px;
  }
  .card:hover { border-color:#2f5d3f; }
  .dot {
    width:8px; height:8px; border-radius:50%; flex-shrink:0;
    background:#00e07a; box-shadow:0 0 8px #00e07a88;
  }
  .info { flex:1; min-width:0; }
  .info a {
    color:#eaeaea; text-decoration:none; font-size:0.85rem;
    display:block; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap;
  }
  .info a:hover { color:#4da3ff; }
  .meta { font-size:0.65rem; color:#555; margin-top:3px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>OSINT AI</h1>
  <div class="sub">email · username · nom prénom</div>

  <div class="row">
    <select id="type">
      <option value="email">Email</option>
      <option value="username">Username</option>
      <option value="fullname">Nom Prénom</option>
    </select>
    <input id="target" placeholder="cible..." autocomplete="off">
  </div>
  <button id="go">Rechercher</button>

  <div id="out"></div>
</div>

<script>
/* ============================================================
   BASE DE PLATEFORMES MONDIALES
   Chaque entrée : [nom, urlTemplate, mode]
   mode = "api"     → endpoint JSON vérifiable directement
   mode = "cors"    → récupération HTML via proxy allorigins
   mode = "status"  → simple test du status HTTP (200 = existe)
   ============================================================ */

// Helper proxy CORS pour éviter les blocages navigateur
const P = u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`;

// Vérification GitHub (API officielle)
async function vGitHub(u){ try{ const r=await fetch(`https://api.github.com/users/${u}`); return r.status===200; }catch{return false;} }
// Vérification Reddit (JSON public)
async function vReddit(u){ try{ const r=await fetch(`https://www.reddit.com/user/${u}/about.json`); if(r.status!==200)return false; const j=await r.json(); return !!(j&&j.data&&j.data.name); }catch{return false;} }
// Vérification GitLab (API officielle)
async function vGitLab(u){ try{ const r=await fetch(`https://gitlab.com/api/v4/users?username=${u}`); if(r.status!==200)return false; const j=await r.json(); return Array.isArray(j)&&j.length>0; }catch{return false;} }
// Vérification via proxy HTML + marqueur négatif
function corsCheck(negatives){
  return async u => {
    try{
      const r=await fetch(P(u));
      if(r.status!==200) return false;
      const txt=await r.text();
      return !negatives.some(n=>txt.includes(n));
    }catch{return false;}
  };
}
// Vérification par status HTTP simple via proxy
const statusCheck = async u => { try{ const r=await fetch(P(u)); return r.status===200; }catch{return false;} };

// Base mondiale de plateformes (les plus utilisées sur tous les continents)
const PLATFORMS = [
  // --- Réseaux sociaux majeurs ---
  ["Facebook",     u=>`https://www.facebook.com/${u}`,        corsCheck(["Page Not Found","content isn't available"])],
  ["Instagram",    u=>`https://www.instagram.com/${u}/`,      corsCheck(["Sorry, this page isn't available"])],
  ["Twitter / X",  u=>`https://x.com/${u}`,                   corsCheck(["This account doesn","doesn't exist"])],
  ["TikTok",       u=>`https://www.tiktok.com/@${u}`,         corsCheck(["Couldn't find this account"])],
  ["Snapchat",     u=>`https://www.snapchat.com/add/${u}`,    statusCheck],
  ["LinkedIn",     u=>`https://www.linkedin.com/in/${u}`,     statusCheck],
  ["Pinterest",    u=>`https://www.pinterest.com/${u}/`,      statusCheck],
  ["Tumblr",       u=>`https://${u}.tumblr.com`,              statusCheck],
  ["VK",           u=>`https://vk.com/${u}`,                  statusCheck],
  ["Weibo",        u=>`https://weibo.com/${u}`,               statusCheck],
  ["Douyin",       u=>`https://www.douyin.com/user/${u}`,     statusCheck],
  ["Line",         u=>`https://line.me/ti/p/~${u}`,           statusCheck],
  ["KakaoTalk",    u=>`https://open.kakao.com/o/${u}`,        statusCheck],

  // --- Messageries / chat ---
  ["Telegram",     u=>`https://t.me/${u}`,                    corsCheck(["tgme_page_title","If you have Telegram"])],
  ["Discord",      u=>`https://discord.com/users/${u}`,       statusCheck],
  ["WhatsApp",     u=>`https://wa.me/${u}`,                   statusCheck],

  // --- Développement / code ---
  ["GitHub",       u=>`https://github.com/${u}`,              vGitHub],
  ["GitLab",       u=>`https://gitlab.com/${u}`,              vGitLab],
  ["Bitbucket",    u=>`https://bitbucket.org/${u}/`,          statusCheck],
  ["Stack Overflow",u=>`https://stackoverflow.com/users/${u}`,statusCheck],
  ["CodePen",      u=>`https://codepen.io/${u}`,              statusCheck],
  ["Replit",       u=>`https://replit.com/@${u}`,             statusCheck],
  ["HackerNews",   u=>`https://news.ycombinator.com/user?id=${u}`, corsCheck(["No such user"])],

  // --- Médias / vidéo / streaming ---
  ["YouTube",      u=>`https://www.youtube.com/@${u}`,        corsCheck(["404","This page isn't available"])],
  ["Twitch",       u=>`https://www.twitch.tv/${u}`,           corsCheck(["page not found"])],
  ["Vimeo",        u=>`https://vimeo.com/${u}`,               statusCheck],
  ["Dailymotion",  u=>`https://www.dailymotion.com/${u}`,     statusCheck],
  ["SoundCloud",   u=>`https://soundcloud.com/${u}`,          statusCheck],
  ["Spotify",      u=>`https://open.spotify.com/user/${u}`,   statusCheck],
  ["Bandcamp",     u=>`https://bandcamp.com/${u}`,            statusCheck],

  // --- Blogging / publication ---
  ["Medium",       u=>`https://medium.com/@${u}`,             statusCheck],
  ["Substack",     u=>`https://${u}.substack.com`,            statusCheck],
  ["WordPress",    u=>`https://${u}.wordpress.com`,           statusCheck],
  ["Blogger",      u=>`https://${u}.blogspot.com`,            statusCheck],
  ["Dev.to",       u=>`https://dev.to/${u}`,                  statusCheck],
  ["Hashnode",     u=>`https://hashnode.com/@${u}`,           statusCheck],

  // --- Forums / communautés ---
  ["Reddit",       u=>`https://www.reddit.com/user/${u}`,     vReddit],
  ["Quora",        u=>`https://www.quora.com/profile/${u}`,   statusCheck],
  ["9GAG",         u=>`https://9gag.com/u/${u}`,              statusCheck],
  ["Imgur",        u=>`https://imgur.com/user/${u}`,          statusCheck],
  ["Flickr",       u=>`https://www.flickr.com/people/${u}`,   statusCheck],
  ["DeviantArt",   u=>`https://www.deviantart.com/${u}`,      statusCheck],
  ["ArtStation",   u=>`https://www.artstation.com/${u}`,      statusCheck],
  ["Behance",      u=>`https://www.behance.net/${u}`,         statusCheck],
  ["Dribbble",     u=>`https://dribbble.com/${u}`,            statusCheck],

  // --- Jeux vidéo ---
  ["Steam",        u=>`https://steamcommunity.com/id/${u}`,   statusCheck],
  ["Xbox",         u=>`https://xboxgamertag.com/search/${u}`, statusCheck],
  ["PlayStation",  u=>`https://psnprofiles.com/${u}`,         statusCheck],
  ["Roblox",       u=>`https://www.roblox.com/user.aspx?username=${u}`, statusCheck],
  ["Minecraft",    u=>`https://namemc.com/profile/${u}`,      statusCheck],

  // --- Professionnel / business ---
  ["AngelList",    u=>`https://angel.co/u/${u}`,              statusCheck],
  ["Product Hunt", u=>`https://www.producthunt.com/@${u}`,    statusCheck],
  ["Crunchbase",   u=>`https://www.crunchbase.com/person/${u}`, statusCheck],

  // --- Musique / audio ---
  ["Mixcloud",     u=>`https://www.mixcloud.com/${u}/`,       statusCheck],
  ["Audiomack",    u=>`https://audiomack.com/${u}`,           statusCheck],

  // --- Rencontres / lifestyle ---
  ["Tinder",       u=>`https://tinder.com/@${u}`,             statusCheck],
  ["Badoo",        u=>`https://badoo.com/en/${u}`,            statusCheck],
  ["OnlyFans",     u=>`https://onlyfans.com/${u}`,            statusCheck],
  ["Patreon",      u=>`https://www.patreon.com/${u}`,         statusCheck],

  // --- Régionaux / mondiaux ---
  ["Naver",        u=>`https://blog.naver.com/${u}`,          statusCheck],
  ["Niconico",     u=>`https://www.nicovideo.jp/user/${u}`,   statusCheck],
  ["Renren",       u=>`https://www.renren.com/${u}`,          statusCheck],
  ["Bilibili",     u=>`https://space.bilibili.com/${u}`,      statusCheck],
  ["Odnoklassniki",u=>`https://ok.ru/${u}`,                   statusCheck],
  ["Mastodon",     u=>`https://mastodon.social/@${u}`,        statusCheck],
  ["Bluesky",      u=>`https://bsky.app/profile/${u}`,        statusCheck],
  ["Threads",      u=>`https://www.threads.net/@${u}`,        statusCheck],
  ["Truth Social", u=>`https://truthsocial.com/@${u}`,        statusCheck],
  ["Gab",          u=>`https://gab.com/${u}`,                 statusCheck],
  ["Parler",       u=>`https://parler.com/${u}`,              statusCheck],
  ["Gettr",        u=>`https://gettr.com/user/${u}`,          statusCheck],
  ["Rumble",       u=>`https://rumble.com/user/${u}`,         statusCheck],
  ["Odysee",       u=>`https://odysee.com/@${u}`,             statusCheck]
];

// Rendu : boucle toutes les plateformes, n'affiche QUE les comptes existants
function render(type, target){
  const out = document.getElementById("out");
  const norm = target.trim().replace(/\s+/g,"").toLowerCase();

  out.innerHTML = `<div class="status" id="status">analyse de ${PLATFORMS.length} plateformes...</div>`;

  let done = 0;
  let found = 0;
  const foundEls = [];

  PLATFORMS.forEach(([name, urlFn, checker], i) => {
    const url = urlFn(norm);
    checker(url).then(exists => {
      done++;
      if (exists) {
        found++;
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <div class="dot"></div>
          <div class="info">
            <a href="${url}" target="_blank" rel="noopener">${name}</a>
            <div class="meta">${url}</div>
          </div>
        `;
        foundEls.push(div);
      }
      const st = document.getElementById("status");
      if (st) st.textContent = `${done}/${PLATFORMS.length} analysé(s) · ${found} compte(s) trouvé(s)`;
      if (done === PLATFORMS.length) {
        // Fin : on remplace le statut par le rendu final
        out.innerHTML = "";
        if (found === 0) {
          out.innerHTML = `<div class="none">aucun compte trouvé</div>`;
        } else {
          const head = document.createElement("div");
          head.className = "status";
          head.textContent = `${found} compte(s) trouvé(s)`;
          out.appendChild(head);
          foundEls.forEach(el => out.appendChild(el));
        }
      }
    });
  });
}

// Validation minimale selon le type de cible
function validate(t){
  t = t.trim();
  if (!t) return false;
  return /^[a-zA-Z0-9_.@-]{2,}$/.test(t.replace(/\s+/g,""));
}

document.getElementById("go").addEventListener("click", () => {
  const target = document.getElementById("target").value;
  const out = document.getElementById("out");
  if (!validate(target)) {
    out.innerHTML = `<div class="empty">cible invalide</div>`;
    return;
  }
  render(document.getElementById("type").value, target);
});
</script>
</body>
</html>
