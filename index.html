<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSINT DEBUG</title>
<style>
  body {
    background:#000; color:#eaeaea;
    font-family:-apple-system, sans-serif;
    padding:20px; font-size:14px;
  }
  h1 { font-size:16px; margin-bottom:16px; }
  input, select, button {
    width:100%; padding:12px; margin-bottom:10px;
    background:#111; color:#eee; border:1px solid #333;
    border-radius:6px; font-size:14px;
  }
  button { background:#fff; color:#000; font-weight:bold; }
  #log {
    background:#0a0a0a; border:1px solid #222; border-radius:6px;
    padding:12px; margin-top:16px;
    font-family:monospace; font-size:11px;
    white-space:pre-wrap; word-break:break-all;
    max-height:70vh; overflow-y:auto;
  }
  .ok { color:#0f0; }
  .err { color:#f55; }
  .info { color:#4da3ff; }
  .warn { color:#fa4; }
</style>
</head>
<body>
  <h1>OSINT DEBUG</h1>

  <select id="type">
    <option value="email">Email</option>
    <option value="username">Pseudo</option>
    <option value="fullname">Prénom Nom</option>
  </select>
  <input id="target" placeholder="cible..." autocomplete="off">
  <button id="go">Rechercher</button>

  <div id="log">En attente…</div>

<script>
/* ---------- Affichage ---------- */
const logEl = document.getElementById("log");
function log(msg, cls = "") {
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}
function clearLog() { logEl.innerHTML = ""; }

/* ---------- Debug global ---------- */
window.addEventListener("error", e => {
  log("❌ ERREUR: " + e.message + " (ligne " + e.lineno + ")", "err");
});
window.addEventListener("unhandledrejection", e => {
  log("❌ PROMESSE REJETÉE: " + (e.reason?.message || e.reason), "err");
});

/* ---------- Proxy CORS simple ---------- */
async function fetchViaProxy(url) {
  // Essai 1 : allorigins
  try {
    log("→ proxy 1 (allorigins)…", "info");
    const r = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(url));
    log("  status: " + r.status, "info");
    if (r.ok) return r;
  } catch (e) {
    log("  proxy 1 échec: " + e.message, "warn");
  }
  // Essai 2 : codetabs
  try {
    log("→ proxy 2 (codetabs)…", "info");
    const r = await fetch("https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(url));
    log("  status: " + r.status, "info");
    if (r.ok) return r;
  } catch (e) {
    log("  proxy 2 échec: " + e.message, "warn");
  }
  throw new Error("tous les proxies ont échoué");
}

/* ---------- Recherche email ---------- */
async function searchEmail(email) {
  log("=== EMAIL: " + email + " ===", "info");

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
    log("❌ format d'email invalide", "err");
    return;
  }
  log("✓ format valide", "ok");

  const domain = email.split("@")[1];
  log("domaine: " + domain, "info");

  // Test DNS MX via Google DNS (fonctionne directement, pas de proxy)
  try {
    log("→ requête DNS MX…", "info");
    const r = await fetch("https://dns.google/resolve?name=" + encodeURIComponent(domain) + "&type=MX");
    log("  status DNS: " + r.status, "info");
    if (r.ok) {
      const j = await r.json();
      const mx = (j.Answer || []).filter(a => a.type === 15);
      if (mx.length > 0) {
        log("✓ MX trouvés: " + mx.map(a => a.data).join(", "), "ok");
      } else {
        log("✗ aucun MX", "warn");
      }
    }
  } catch (e) {
    log("❌ DNS échec: " + e.message, "err");
  }

  // Test Gravatar
  try {
    log("→ test Gravatar…", "info");
    // MD5 via service externe
    const hashResp = await fetch("https://api.hashify.net/hash/md5/hex?value=" + encodeURIComponent(email.trim().toLowerCase()));
    if (hashResp.ok) {
      const hashJson = await hashResp.json();
      const hash = hashJson.Digest;
      log("  hash: " + hash, "info");
      const r = await fetch("https://www.gravatar.com/avatar/" + hash + "?d=404");
      log("  status Gravatar: " + r.status, "info");
      if (r.status === 200) {
        log("✓ Gravatar existe", "ok");
      } else {
        log("✗ pas de Gravatar", "warn");
      }
    }
  } catch (e) {
    log("❌ Gravatar échec: " + e.message, "err");
  }

  log("=== FIN EMAIL ===", "ok");
}

/* ---------- Recherche pseudo ---------- */
async function searchUsername(u) {
  log("=== PSEUDO: " + u + " ===", "info");

  // GitHub (API directe, pas de proxy, CORS autorisé)
  try {
    log("→ GitHub API…", "info");
    const r = await fetch("https://api.github.com/users/" + encodeURIComponent(u));
    log("  status: " + r.status, "info");
    if (r.status === 200) {
      const j = await r.json();
      log("✓ GitHub trouvé: " + j.login + " (" + j.public_repos + " repos)", "ok");
    } else if (r.status === 404) {
      log("✗ pas de compte GitHub", "warn");
    }
  } catch (e) {
    log("❌ GitHub échec: " + e.message, "err");
  }

  // Reddit (API directe)
  try {
    log("→ Reddit API…", "info");
    const r = await fetch("https://www.reddit.com/user/" + encodeURIComponent(u) + "/about.json");
    log("  status: " + r.status, "info");
    if (r.status === 200) {
      const j = await r.json();
      if (j?.data?.name) {
        log("✓ Reddit trouvé: " + j.data.name + " (karma: " + j.data.link_karma + ")", "ok");
      }
    } else if (r.status === 404) {
      log("✗ pas de compte Reddit", "warn");
    }
  } catch (e) {
    log("❌ Reddit échec: " + e.message, "err");
  }

  // GitLab (API directe)
  try {
    log("→ GitLab API…", "info");
    const r = await fetch("https://gitlab.com/api/v4/users?username=" + encodeURIComponent(u));
    log("  status: " + r.status, "info");
    if (r.ok) {
      const j = await r.json();
      if (Array.isArray(j) && j.length > 0) {
        log("✓ GitLab trouvé: " + j[0].username, "ok");
      } else {
        log("✗ pas de compte GitLab", "warn");
      }
    }
  } catch (e) {
    log("❌ GitLab échec: " + e.message, "err");
  }

  // Test via proxy sur 1 plateforme (pour voir si le proxy marche)
  try {
    log("→ test proxy sur Instagram…", "info");
    const r = await fetchViaProxy("https://www.instagram.com/" + encodeURIComponent(u) + "/");
    const html = await r.text();
    log("  HTML reçu: " + html.length + " caractères", "info");
    if (html.toLowerCase().includes("sorry, this page isn't available")) {
      log("✗ compte Instagram inexistant", "warn");
    } else if (html.toLowerCase().includes("og:title")) {
      log("✓ Instagram semble exister (og:title trouvé)", "ok");
    } else {
      log("? Instagram: résultat ambigu", "warn");
    }
  } catch (e) {
    log("❌ proxy Instagram échec: " + e.message, "err");
  }

  log("=== FIN PSEUDO ===", "ok");
}

/* ---------- Recherche prénom nom ---------- */
async function searchFullname(name) {
  const u = name.trim().replace(/\s+/g, "").toLowerCase();
  log("=== PRÉNOM NOM: " + name + " (transformé en: " + u + ") ===", "info");
  await searchUsername(u);
}

/* ---------- Clic ---------- */
document.getElementById("go").addEventListener("click", async () => {
  clearLog();
  const type = document.getElementById("type").value;
  const target = document.getElementById("target").value.trim();

  log("🚀 Démarrage recherche", "ok");
  log("type: " + type, "info");
  log("cible: " + target, "info");
  log("");

  if (!target) {
    log("❌ cible vide", "err");
    return;
  }

  try {
    if (type === "email") {
      await searchEmail(target);
    } else if (type === "username") {
      await searchUsername(target);
    } else {
      await searchFullname(target);
    }
  } catch (e) {
    log("❌ ERREUR GLOBALE: " + e.message, "err");
  }
});
</script>
</body>
</html>
