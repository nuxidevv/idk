<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seek It — Recherche par Nom, Email ou Téléphone</title>
<meta name="description" content="Retrouvez n'importe qui à partir d'un nom, d'un email ou d'un numéro de téléphone. Recherche instantanée, anonyme, sans trace.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#050505;
    --card:rgba(20,20,24,0.55);
    --card-solid:#0d0d0f;
    --card-hover:rgba(28,28,34,0.7);
    --border:rgba(255,255,255,0.08);
    --border-hover:rgba(255,255,255,0.18);
    --text:#f5f5f7;
    --text-dim:#8a8a95;
    --text-dimmer:#4a4a55;
    --green:#00e07a;
    --green-dim:rgba(0,224,122,0.12);
    --orange:#ffaa4d;
    --orange-dim:rgba(255,170,77,0.12);
    --red:#ff6b6b;
    --blue:#4da3ff;
    --input-bg:rgba(15,15,18,0.55);
    --row-border:rgba(255,255,255,0.06);
    --glow:rgba(0,224,122,0.15);
    --glass-tint:rgba(20,20,24,0.45);
    --glass-highlight:rgba(255,255,255,0.10);
    --glass-shadow:rgba(0,0,0,0.4);
    --btn-bg:linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(220,220,220,0.9) 100%);
    --btn-border:rgba(255,255,255,0.5);
    --btn-text:#050505;
    --btn-highlight:rgba(255,255,255,0.6);
    --nav-shine:rgba(0,224,122,0.10);
  }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--text);
    font-family:'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height:100vh; overflow-x:hidden;
    transition:background 0.4s, color 0.4s;
    -webkit-font-smoothing:antialiased;
    padding-top:80px;
    position:relative;
  }
  body.modal-open { overflow:hidden; }

  #particles {
    position:fixed; inset:0;
    z-index:0; pointer-events:none;
    opacity:0.5;
  }

  body::before {
    content:''; position:fixed; top:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:1400px; height:700px;
    background:radial-gradient(ellipse at top, rgba(0,224,122,0.10) 0%, transparent 60%);
    pointer-events:none; z-index:0;
    animation:heroGlow 6s ease-in-out infinite;
  }
  @keyframes heroGlow {
    0%,100% { opacity:0.8; transform:translateX(-50%) scale(1); }
    50% { opacity:1; transform:translateX(-50%) scale(1.05); }
  }

  .page-loader {
    position:fixed; inset:0;
    background:rgba(5,5,5,0.55);
    backdrop-filter:blur(6px) saturate(140%);
    -webkit-backdrop-filter:blur(6px) saturate(140%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:20px; z-index:9999; transition:opacity 0.6s ease-out, visibility 0.6s;
  }
  .page-loader.hidden { opacity:0; visibility:hidden; pointer-events:none; }
  .loader-logo {
    width:64px; height:64px; border-radius:16px;
    background:linear-gradient(135deg, #fff 0%, #888 100%);
    display:flex; align-items:center; justify-content:center;
    animation:loaderPulse 1.5s ease-in-out infinite;
    box-shadow:0 0 60px rgba(0,224,122,0.3);
  }
  .loader-logo svg { width:32px; height:32px; color:#000; }
  @keyframes loaderPulse {
    0%,100% { transform:scale(1); box-shadow:0 0 60px rgba(0,224,122,0.3); }
    50% { transform:scale(1.05); box-shadow:0 0 80px rgba(0,224,122,0.5); }
  }
  .loader-text {
    font-size:1.5rem; font-weight:800; letter-spacing:-0.03em;
    color:var(--text); opacity:0; animation:loaderFadeIn 0.6s 0.2s forwards;
  }
  .loader-sub {
    font-size:0.75rem; color:var(--text-dim); letter-spacing:0.05em;
    opacity:0; animation:loaderFadeIn 0.6s 0.4s forwards;
  }
  @keyframes loaderFadeIn { to { opacity:1; } }
  .loader-bar {
    width:200px; height:2px; background:var(--border);
    border-radius:2px; overflow:hidden; margin-top:12px;
  }
  .loader-bar-fill {
    height:100%; background:linear-gradient(90deg, var(--green), var(--blue));
    width:0%; animation:loaderBar 1.5s ease-out forwards;
    box-shadow:0 0 12px var(--green);
  }
  @keyframes loaderBar { 0% { width:0%; } 100% { width:100%; } }

  .progress-bar {
    position:fixed; top:0; left:0; height:2px; width:0%;
    background:linear-gradient(90deg, var(--green), var(--blue));
    z-index:100; transition:width 0.3s ease-out, opacity 0.3s;
    opacity:0; box-shadow:0 0 12px rgba(0,224,122,0.6);
  }
  .progress-bar.active { opacity:1; }

  nav.topbar {
    position:fixed;
    top:14px;
    left:50%;
    transform:translateX(-50%);
    z-index:50;
    max-width:calc(1400px - 32px);
    width:calc(100% - 32px);
    padding:10px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-radius:100px;
    background:var(--glass-tint);
    backdrop-filter:blur(28px) saturate(200%);
    -webkit-backdrop-filter:blur(28px) saturate(200%);
    border:1px solid var(--border);
    box-shadow:
      0 8px 32px var(--glass-shadow),
      0 1px 0 0 var(--glass-highlight) inset,
      0 -1px 0 0 rgba(0,0,0,0.15) inset,
      0 0 0 0.5px rgba(255,255,255,0.04) inset;
    transition:all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    overflow:hidden;
  }
  nav.topbar::before {
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height:50%;
    background:linear-gradient(180deg, var(--glass-highlight) 0%, transparent 100%);
    border-radius:100px 100px 0 0;
    pointer-events:none;
    opacity:0.8;
  }
  nav.topbar::after {
    content:'';
    position:absolute;
    top:0; left:-100%;
    width:60%; height:100%;
    background:linear-gradient(90deg, transparent 0%, var(--nav-shine) 50%, transparent 100%);
    transition:left 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events:none;
  }
  nav.topbar:hover::after { left:200%; }

  .brand {
    display:flex; align-items:center; gap:10px;
    font-weight:800; font-size:1rem; letter-spacing:-0.02em;
    cursor:default;
    position:relative;
    z-index:2;
  }
  .brand-mark {
    width:30px; height:30px; border-radius:9px;
    background:linear-gradient(135deg, #fff 0%, #888 100%);
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
    box-shadow:0 4px 16px rgba(0,0,0,0.15), 0 0 0 1px rgba(255,255,255,0.05) inset;
    transition:transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .brand:hover .brand-mark { transform:rotateY(180deg) scale(1.05); }
  .brand-mark::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.5) 50%, transparent 60%);
    animation:shimmer 3s ease-in-out infinite;
  }
  @keyframes shimmer {
    0% { transform:translateX(-100%); }
    100% { transform:translateX(100%); }
  }
  .brand-mark svg { width:15px; height:15px; color:#000; position:relative; z-index:1; }

  .nav-actions { display:flex; gap:8px; align-items:center; position:relative; z-index:2; }

  .nav-btn {
    width:34px; height:34px; border-radius:12px;
    background:var(--glass-tint);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    position:relative;
    overflow:hidden;
    box-shadow:
      0 4px 12px var(--glass-shadow),
      0 1px 0 0 var(--glass-highlight) inset;
  }
  .nav-btn::before {
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height:50%;
    background:linear-gradient(180deg, var(--glass-highlight) 0%, transparent 100%);
    border-radius:12px 12px 0 0;
    pointer-events:none;
  }
  .nav-btn:hover {
    border-color:var(--border-hover);
    transform:translateY(-2px);
    box-shadow:
      0 8px 20px var(--glow),
      0 1px 0 0 var(--glass-highlight) inset;
  }
  .nav-btn:active { transform:translateY(0) scale(0.95); }
  .nav-btn svg {
    width:15px; height:15px;
    color:var(--text-dim);
    transition:color 0.2s, transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    position:relative; z-index:1;
  }
  .nav-btn:hover svg { color:var(--text); }
  .nav-btn.off svg { color:var(--text-dimmer); }

  #settingsToggle:hover svg { transform:rotate(90deg); }

  .nav-link {
    font-size:0.78rem; font-weight:500;
    color:var(--text-dim); text-decoration:none;
    padding:9px 16px; border-radius:12px;
    cursor:pointer;
    border:1px solid var(--border);
    background:var(--glass-tint);
    font-family:inherit;
    position:relative;
    overflow:hidden;
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    box-shadow:
      0 4px 12px var(--glass-shadow),
      0 1px 0 0 var(--glass-highlight) inset;
    transition:all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .nav-link::before {
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height:50%;
    background:linear-gradient(180deg, var(--glass-highlight) 0%, transparent 100%);
    pointer-events:none;
    border-radius:12px 12px 0 0;
  }
  .nav-link:hover {
    color:var(--text);
    border-color:var(--border-hover);
    transform:translateY(-2px);
    box-shadow:
      0 8px 20px var(--glow),
      0 1px 0 0 var(--glass-highlight) inset;
  }

  main { position:relative; z-index:1; }
  .container { max-width:900px; margin:0 auto; padding:0 24px; }

  section.hero {
    padding:20px 24px 60px;
    text-align:center;
    position:relative;
  }

  .badges-row {
    display:flex; flex-wrap:wrap; justify-content:center;
    gap:8px; margin-bottom:28px;
    animation:fadeUp 0.8s ease-out 0.1s backwards;
  }

  .badge {
    display:inline-flex; align-items:center; gap:6px;
    padding:7px 14px; border-radius:100px;
    background:var(--glass-tint);
    border:1px solid var(--border);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    font-size:0.7rem; font-weight:500; color:var(--text-dim);
    transition:all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    position:relative;
    overflow:hidden;
    box-shadow:
      0 4px 12px var(--glass-shadow),
      0 1px 0 0 var(--glass-highlight) inset;
  }
  .badge::before {
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height:50%;
    background:linear-gradient(180deg, var(--glass-highlight) 0%, transparent 100%);
    pointer-events:none;
    border-radius:100px 100px 0 0;
  }
  .badge:hover {
    border-color:var(--border-hover);
    transform:translateY(-2px);
    box-shadow:
      0 8px 20px var(--glow),
      0 1px 0 0 var(--glass-highlight) inset;
  }
  .badge .dot {
    width:5px; height:5px; border-radius:50%;
    background:var(--green); box-shadow:0 0 6px var(--green);
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.4; transform:scale(0.8); }
  }

  h1.hero-title {
    font-size:clamp(1.8rem, 5vw, 3rem);
    font-weight:800; letter-spacing:-0.035em;
    line-height:1.1; margin-bottom:20px;
    color:var(--text);
    animation:fadeUp 0.8s ease-out 0.2s backwards;
  }
  h1.hero-title .accent {
    background:linear-gradient(135deg, var(--green) 0%, var(--blue) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    display:inline-block;
  }
  .typewriter {
    display:inline-block;
    vertical-align:baseline;
    min-width:1ch;
  }
  .cursor {
    display:inline-block;
    width:3px;
    height:0.9em;
    background:var(--green);
    margin-left:3px;
    vertical-align:-0.05em;
    border-radius:2px;
    box-shadow:0 0 10px var(--green), 0 0 20px rgba(0,224,122,0.4);
    animation:blinkCursor 1s step-end infinite;
  }
  @keyframes blinkCursor {
    0%, 50% { opacity:1; }
    51%, 100% { opacity:0; }
  }
  .reduced-motion .cursor {
    animation:none;
    opacity:1;
  }

  .hero-sub {
    font-size:0.95rem; color:var(--text-dim);
    max-width:600px; margin:0 auto 40px;
    line-height:1.6; font-weight:400;
    animation:fadeUp 0.8s ease-out 0.3s backwards;
  }

  .search-container {
    max-width:640px; margin:0 auto;
    animation:fadeUp 0.8s ease-out 0.4s backwards;
  }

  .input-wrap {
    position:relative;
    margin-bottom:12px;
    transition:transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .input-wrap:focus-within { transform:scale(1.01); }
  .input-wrap .input-icon {
    position:absolute; left:16px; top:50%;
    transform:translateY(-50%);
    width:18px; height:18px;
    color:var(--text-dimmer);
    pointer-events:none;
    transition:color 0.2s, transform 0.3s;
    z-index:2;
  }
  .input-wrap:focus-within .input-icon {
    color:var(--green);
    transform:translateY(-50%) scale(1.15) rotate(15deg);
  }

  input#target {
    background:var(--input-bg);
    border:1px solid var(--border);
    color:var(--text);
    padding:18px 46px 18px 46px;
    border-radius:16px;
    font-size:0.95rem;
    font-family:inherit;
    outline:none; width:100%;
    transition:all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    position:relative; z-index:1;
    backdrop-filter:blur(24px) saturate(200%);
    -webkit-backdrop-filter:blur(24px) saturate(200%);
    box-shadow:
      0 8px 24px var(--glass-shadow),
      0 1px 0 0 var(--glass-highlight) inset,
      0 -1px 0 0 rgba(0,0,0,0.1) inset;
  }
  input#target::placeholder { color:var(--text-dimmer); }
  input#target:focus {
    border-color:var(--border-hover);
    box-shadow:
      0 0 0 4px var(--glow),
      0 12px 40px var(--glass-shadow),
      0 1px 0 0 var(--glass-highlight) inset;
    background:var(--card-hover);
  }

  .input-type-badge {
    position:absolute; right:44px; top:50%;
    transform:translateY(-50%);
    font-size:0.6rem; font-weight:700;
    padding:3px 8px; border-radius:100px;
    background:var(--green-dim); color:var(--green);
    border:1px solid var(--glow);
    letter-spacing:0.05em; text-transform:uppercase;
    font-family:'JetBrains Mono', monospace;
    display:none;
    z-index:2;
    pointer-events:none;
    transition:opacity 0.2s;
  }
  .input-type-badge.visible { display:inline-block; }

  .input-clear {
    position:absolute; right:14px; top:50%;
    transform:translateY(-50%);
    width:24px; height:24px;
    border-radius:50%;
    background:var(--glass-tint);
    border:1px solid var(--border);
    display:none; align-items:center; justify-content:center;
    cursor:pointer; z-index:3;
    transition:all 0.15s;
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    box-shadow:0 1px 0 0 var(--glass-highlight) inset;
  }
  .input-clear:hover {
    background:var(--card-hover);
    transform:translateY(-50%) scale(1.1);
    border-color:var(--border-hover);
  }
  .input-clear.visible { display:flex; }
  .input-clear svg { width:10px; height:10px; color:var(--text-dim); }

  button.primary {
    width:100%;
    background:var(--btn-bg);
    color:var(--btn-text);
    border:1px solid var(--btn-border);
    padding:18px;
    border-radius:16px;
    font-size:0.92rem; font-weight:700;
    cursor:pointer; font-family:inherit;
    letter-spacing:0.01em;
    transition:all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    position:relative; overflow:hidden;
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    box-shadow:
      0 8px 24px var(--glass-shadow),
      0 1px 0 0 var(--btn-highlight) inset,
      0 -1px 0 0 rgba(0,0,0,0.05) inset;
  }
  button.primary::before {
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height:50%;
    background:linear-gradient(180deg, var(--btn-highlight) 0%, transparent 100%);
    border-radius:16px 16px 0 0;
    pointer-events:none;
  }
  button.primary:hover:not(:disabled) {
    transform:translateY(-3px) scale(1.015);
    box-shadow:
      0 18px 48px var(--glow),
      0 1px 0 0 var(--btn-highlight) inset;
  }
  button.primary:active:not(:disabled) {
    transform:translateY(0) scale(0.99);
  }
  button.primary:disabled {
    background:var(--card);
    color:var(--text-dimmer);
    cursor:default;
    border-color:var(--border);
    box-shadow:none;
  }
  button.primary .spinner {
    display:none; width:14px; height:14px;
    border:2px solid rgba(0,0,0,0.15);
    border-top-color:#000;
    border-radius:50%; animation:spin 0.7s linear infinite;
    margin-right:8px; vertical-align:middle;
    position:relative; z-index:1;
  }
  button.primary.loading .spinner { display:inline-block; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .ripple {
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.4);
    transform:scale(0);
    animation:rippleAnim 0.6s ease-out;
    pointer-events:none;
    z-index:0;
  }
  @keyframes rippleAnim {
    to { transform:scale(4); opacity:0; }
  }

  .stats-row {
    display:grid; grid-template-columns:repeat(3, 1fr);
    gap:12px; margin-top:40px;
    max-width:640px; margin-left:auto; margin-right:auto;
    animation:fadeUp 0.8s ease-out 0.5s backwards;
  }
  .stat {
    background:var(--glass-tint);
    border:1px solid var(--border);
    border-radius:16px; padding:20px 12px;
    text-align:center;
    transition:all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    backdrop-filter:blur(24px) saturate(200%);
    -webkit-backdrop-filter:blur(24px) saturate(200%);
    box-shadow:
      0 8px 24px var(--glass-shadow),
      0 1px 0 0 var(--glass-highlight) inset;
    position:relative;
    overflow:hidden;
  }
  .stat::before {
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height:50%;
    background:linear-gradient(180deg, var(--glass-highlight) 0%, transparent 100%);
    border-radius:16px 16px 0 0;
    pointer-events:none;
  }
  .stat:hover {
    border-color:var(--border-hover);
    transform:translateY(-4px);
    box-shadow:
      0 20px 40px var(--glow),
      0 1px 0 0 var(--glass-highlight) inset;
  }
  .stat-value {
    font-size:1.15rem; font-weight:800;
    letter-spacing:-0.02em;
    color:var(--text); margin-bottom:4px;
    font-family:'JetBrains Mono', monospace;
    position:relative;
  }
  .stat-value.green { color:var(--green); text-shadow:0 0 12px var(--green-dim); }
  .stat-label {
    font-size:0.65rem; color:var(--text-dim);
    letter-spacing:0.05em; text-transform:uppercase;
    font-weight:500;
    position:relative;
  }

  section.features { padding:60px 24px; }
  .section-tag {
    display:inline-block; font-size:0.65rem;
    font-weight:700; letter-spacing:0.15em;
    color:var(--green); text-transform:uppercase;
    margin-bottom:12px;
  }
  h2.section-title {
    font-size:clamp(1.4rem, 3.5vw, 2rem);
    font-weight:800; letter-spacing:-0.03em;
    line-height:1.15; margin-bottom:16px;
    color:var(--text);
    max-width:600px;
  }
  .section-sub {
    font-size:0.88rem; color:var(--text-dim);
    line-height:1.6; max-width:560px;
    margin-bottom:36px;
  }

  .sources-grid { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  .source-chip {
    padding:8px 14px;
    background:var(--glass-tint);
    border:1px solid var(--border);
    border-radius:100px;
    font-size:0.72rem; font-weight:500;
    color:var(--text-dim);
    transition:all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    cursor:default;
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    box-shadow:
      0 4px 12px var(--glass-shadow),
      0 1px 0 0 var(--glass-highlight) inset;
    position:relative;
    overflow:hidden;
  }
  .source-chip::before {
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height:50%;
    background:linear-gradient(180deg, var(--glass-highlight) 0%, transparent 100%);
    border-radius:100px 100px 0 0;
