<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSINT</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#000; color:#eaeaea;
    font-family:-apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height:100vh; display:flex; justify-content:center;
    padding:60px 20px;
  }
  .wrap { width:100%; max-width:680px; }
  h1 { font-size:1.1rem; font-weight:600; margin-bottom:4px; color:#fff; }
  .sub { font-size:0.75rem; color:#555; margin-bottom:32px; }
  input {
    background:#0d0d0d; border:1px solid #1e1e1e; color:#eaeaea;
    padding:12px 14px; border-radius:8px; font-size:0.85rem;
    font-family:inherit; outline:none;
    width:100%; margin-bottom:12px;
  }
  input:focus { border-color:#333; }
  button {
    width:100%; background:#fff; color:#000; border:none;
    padding:13px; border-radius:8px; font-size:0.85rem;
    font-weight:600; cursor:pointer;
    transition:opacity 0.15s;
  }
  button:hover { opacity:0.85; }
  button:active { opacity:0.7; }
  button:disabled { background:#1a1a1a; color:#555; cursor:default; }

  #out { margin-top:28px; }
  .status {
    font-size:0.72rem; color:#666; text-align:center;
    margin-bottom:14px; letter-spacing:0.5px;
  }
  .none {
    color:#666; font-size:0.82rem; text-align:center;
    padding:30px 20px;
  }
  .card {
    background:#0b0b0b; border:1px solid #1f3d2a; border-radius:10px;
    padding:14px 16px; margin-bottom:8px;
    display:flex; align-items:flex-start; gap:12px;
  }
  .card:hover { border-color:#2f5d3f; }
  .card.tool-card { border-color:#3d2f1f; }
  .card.tool-card:hover { border-color:#5d4a2f; }
  .dot {
    width:8px; height:8px; border-radius:50%; flex-shrink:0;
    background:#00e07a; box-shadow:0 0 8px #00e07a88;
    margin-top:6px;
  }
  .dot.orange { background:#ffaa4d; box-shadow:0 0 8px #ffaa4d88; }
  .info { flex:1; min-width:0; }
  .info a, .info .title {
    color:#eaeaea; text-decoration:none; font-size:0.85rem;
    display:block; word-break:break-word;
  }
  .info a:hover { color:#4da3ff; }
  .info .title { font-weight:500; }
  .meta { font-size:0.65rem; color:#555; margin-top:4px; word-break:break-all; line-height:1.4; }
  .meta a { color:#4da3ff; text-decoration:none; display:block; margin-top:2px; }
  .meta a:hover { text-decoration:underline; }
  .section-title {
    font-size:0.7rem; color:#888; text-transform:uppercase;
    letter-spacing:1px; margin:18px 0 10px;
  }
  .err {
    background:#1a0a0a; color:#ff6b6b; padding:12px;
    border-radius:8px; font-size:0.72rem; margin-top:14px;
    white-space:pre-wrap; word-break:break-word;
  }
  .raw {
    background:#0a0a0a; border:1px solid #1a1a1a; border-radius:8px;
    padding:12px; margin-top:14px; font-size:0.65rem; color:#888;
    max-height:400px; overflow:auto; white-space:pre-wrap;
    word-break:break-word; font-family:monospace;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>OSINT</h1>
  <div class="sub">recherche par Prénom Nom</div>

  <input id="target" placeholder="prénom nom..." autocomplete="off">

  <button id="go">Rechercher</button>

  <div id="out"></div>
</div>

<script>
/* ============================================================
   CONFIGURATION BRIXHUB
   ============================================================ */
const BRIXHUB_API_KEY = "brix_kTDklqpV-orjSqnZ9mFSU7YqkzCdJVFJhY4Ka1Rni71WWoIh"; // <-- insérer la clé API ici
const BRIXHUB_BASE = "https://api.brixhub.to/api/v1/search";

/* ============================================================
   CAPTURE D'ERREURS GLOBALES
   ============================================================ */
window.addEventListener("error", e => {
  const out = document.getElementById("out");
  if (out) out.innerHTML = `<div class="err">Erreur JS : ${e.message}</div>`;
});

/* ============================================================
   UTILITAIRES
   ============================================================ */
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

function validate(t) {
  t = (t || "").trim();
  if (t.length < 3) return false;
  return /^[a-zA-ZÀ-ÿ'\- ]{2,}$/.test(t);
}

/* ============================================================
   APPEL BRIXHUB — plusieurs tentatives d'auth / URL
   L'API est testée avec plusieurs combinaisons :
   - clé dans header Authorization Bearer
   - clé dans header X-API-Key
   - clé en query string ?api_key=
   ============================================================ */

// Tentative 1 : Authorization Bearer + first_name / last_name
async function brixhubCall1(firstName, lastName) {
  const url = `${BRIXHUB_BASE}?first_name=${encodeURIComponent(firstName)}&last_name=${encodeURIComponent(lastName)}`;
  const res = await fetch(url, {
    method: "GET",
    headers: {
      "Accept": "application/json",
      "Authorization": `Bearer ${BRIXHUB_API_KEY}`
    }
  });
  return { url, status: res.status, ok: res.ok, body: res.ok ? await res.json().catch(()=>null) : await res.text().catch(()=>null) };
}

// Tentative 2 : header X-API-Key
async function brixhubCall2(firstName, lastName) {
  const url = `${BRIXHUB_BASE}?first_name=${encodeURIComponent(firstName)}&last_name=${encodeURIComponent(lastName)}`;
  const res = await fetch(url, {
    method: "GET",
    headers: {
      "Accept": "application/json",
      "X-API-Key": BRIXHUB_API_KEY
    }
  });
  return { url, status: res.status, ok: res.ok, body: res.ok ? await res.json().catch(()=>null) : await res.text().catch(()=>null) };
}

// Tentative 3 : clé en query string
async function brixhubCall3(firstName, lastName) {
  const url = `${BRIXHUB_BASE}?first_name=${encodeURIComponent(firstName)}&last_name=${encodeURIComponent(lastName)}&api_key=${encodeURIComponent(BRIXHUB_API_KEY)}`;
  const res = await fetch(url, {
    method: "GET",
    headers: { "Accept": "application/json" }
  });
  return { url, status: res.status, ok: res.ok, body: res.ok ? await res.json().catch(()=>null) : await res.text().catch(()=>null) };
}

// Tentative 4 : paramètre "q" (nom complet)
async function brixhubCall4(fullName) {
  const url = `${BRIXHUB_BASE}?q=${encodeURIComponent(fullName)}`;
  const res = await fetch(url, {
    method: "GET",
    headers: {
      "Accept": "application/json",
      "Authorization": `Bearer ${BRIXHUB_API_KEY}`
    }
  });
  return { url, status: res.status, ok: res.ok, body: res.ok ? await res.json().catch(()=>null) : await res.text().catch(()=>null) };
}

// Tentative 5 : paramètre "name"
async function brixhubCall5(fullName) {
  const url = `${BRIXHUB_BASE}?name=${encodeURIComponent(fullName)}`;
  const res = await fetch(url, {
    method: "GET",
    headers: {
      "Accept": "application/json",
      "Authorization": `Bearer ${BRIXHUB_API_KEY}`
    }
  });
  return { url, status: res.status, ok: res.ok, body: res.ok ? await res.json().catch(()=>null) : await res.text().catch(()=>null) };
}

// Lance les 5 tentatives et retourne la première qui répond OK avec des données
async function searchBrixHub(fullName) {
  const parts = fullName.trim().split(/\s+/);
  const firstName = parts[0] || "";
  const lastName = parts.slice(1).join(" ") || "";

  const attempts = [
    { name: "Bearer + first_name/last_name", fn: () => brixhubCall1(firstName, lastName) },
    { name: "X-API-Key + first_name/last_name", fn: () => brixhubCall2(firstName, lastName) },
    { name: "query api_key + first_name/last_name", fn: () => brixhubCall3(firstName, lastName) },
    { name: "Bearer + q=nom complet", fn: () => brixhubCall4(fullName) },
    { name: "Bearer + name=nom complet", fn: () => brixhubCall5(fullName) }
  ];

  const logs = [];
  for (const a of attempts) {
    try {
      const r = await a.fn();
      logs.push({ tentative: a.name, url: r.url, status: r.status, ok: r.ok, body: r.body });
      if (r.ok && r.body) {
        return { ok: true, attempts: logs, data: r.body, usedAttempt: a.name };
      }
    } catch (err) {
      logs.push({ tentative: a.name, error: err.message });
    }
  }
  return { ok: false, attempts: logs, data: null };
}

/* ============================================================
   NORMALISATION DES RÉSULTATS BRIXHUB
   ============================================================ */
function normalizeBrixHubResults(data) {
  const hits = [];
  if (!data) return hits;

  // Recherche récursive d'un tableau dans la structure
  function findArray(obj, depth = 0) {
    if (depth > 4 || !obj) return null;
    if (Array.isArray(obj)) return obj;
    if (typeof obj === "object") {
      const keys = ["results","data","items","records","hits","matches","entries","list","persons","people","response"];
      for (const k of keys) {
        if (obj[k] && Array.isArray(obj[k])) return obj[k];
      }
      for (const k of Object.keys(obj)) {
        const r = findArray(obj[k], depth + 1);
        if (r) return r;
      }
    }
    return null;
  }

  const arr = findArray(data);
  if (!arr) return hits;

  arr.slice(0, 20).forEach(item => {
    if (typeof item === "string") {
      hits.push({ title: item, url: "#" });
      return;
    }
    const title =
      item.full_name || item.fullName || item.name ||
      [item.first_name || item.firstName, item.last_name || item.lastName].filter(Boolean).join(" ") ||
      item.title || item.email || "Résultat BrixHub";

    const url =
      item.url || item.profile_url || item.profileUrl ||
      item.link || item.source_url || item.sourceUrl ||
      (item.id ? `https://api.brixhub.to/api/v1/record/${item.id}` : "#");

    const extra = Object.entries(item)
      .filter(([k, v]) => v && typeof v !== "object" && k !== "url" && k !== "id")
      .map(([k, v]) => `${k}: ${v}`)
      .join(" · ");

    hits.push({ title: String(title).slice(0, 120), url, extra });
  });

  return hits;
}

/* ============================================================
   AFFICHAGE DES RÉSULTATS
   ============================================================ */
function renderResults(result, fullName) {
  const out = document.getElementById("out");
  out.innerHTML = "";

  // Status
  const statusEl = document.createElement("div");
  statusEl.className = "status";
  out.appendChild(statusEl);

  if (!result.ok) {
    statusEl.textContent = "aucune tentative n'a abouti";
    const err = document.createElement("div");
    err.className = "err";
    err.textContent = "Tentatives échouées :\n" +
      result.attempts.map(a =>
        `• ${a.tentative} → ${a.error ? "ERR " + a.error : "HTTP " + a.status}`
      ).join("\n");
    out.appendChild(err);

    // Affiche le détail brut pour diagnostic
    const raw = document.createElement("div");
    raw.className = "raw";
    raw.textContent = JSON.stringify(result.attempts, null, 2).slice(0, 5000);
    out.appendChild(raw);
    return;
  }

  // Normalisation
  const hits = normalizeBrixHubResults(result.data);
  statusEl.textContent = `${hits.length} résultat(s) — via ${result.usedAttempt}`;

  // Section titre
  const section = document.createElement("div");
  section.innerHTML = `<div class="section-title">BrixHub API</div>`;
  out.appendChild(section);

  const list = document.createElement("div");
  section.appendChild(list);

  if (hits.length === 0) {
    const none = document.createElement("div");
    none.className = "none";
    none.textContent = "aucun résultat exploitable";
    list.appendChild(none);
  } else {
    hits.forEach(h => {
      const card = document.createElement("div");
      card.className = "card tool-card";
      const urlHtml = h.url && h.url !== "#"
        ? `<a href="${h.url}" target="_blank" rel="noopener">${escapeHtml(h.url)}</a>`
        : "";
      const extraHtml = h.extra
        ? `<div class="meta">${escapeHtml(h.extra)}</div>`
        : "";
      card.innerHTML = `
        <div class="dot orange"></div>
        <div class="info">
          <div class="title">${escapeHtml(h.title)}</div>
          ${extraHtml}
          <div class="meta">${urlHtml}</div>
        </div>
      `;
      list.appendChild(card);
    });
  }

  // Bloc réponse brute (repliable visuellement via scroll)
  const rawTitle = document.createElement("div");
  rawTitle.className = "section-title";
  rawTitle.textContent = "Réponse brute API";
  out.appendChild(rawTitle);

  const raw = document.createElement("div");
  raw.className = "raw";
  try {
    raw.textContent = JSON.stringify(result.data, null, 2).slice(0, 8000);
  } catch {
    raw.textContent = String(result.data).slice(0, 8000);
  }
  out.appendChild(raw);
}

/* ============================================================
   EVENT
   ============================================================ */
document.getElementById("go").addEventListener("click", async () => {
  const target = document.getElementById("target").value;
  const out = document.getElementById("out");
  const btn = document.getElementById("go");

  if (!validate(target)) {
    out.innerHTML = `<div class="none">entre un prénom et un nom valides</div>`;
    return;
  }

  btn.disabled = true;
  btn.textContent = "Recherche en cours…";

  try {
    const result = await searchBrixHub(target.trim());
    renderResults(result, target.trim());
  } catch (e) {
    out.innerHTML = `<div class="err">Erreur : ${escapeHtml(e.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "Rechercher";
  }
});

document.getElementById("target").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("go").click();
});
</script>
</body>
</html>
