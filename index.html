<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSINT Search - Interface Unique</title>
<style>
/* Réinitialisation globale */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

/* Fond dégradé clair avec effet liquid glass */
body {
  min-height: 100vh;
  background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 50%, #d9e2ec 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
  overflow-x: hidden;
}

/* Bulles décoratives en arrière-plan */
body::before,
body::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.5;
  z-index: 0;
  pointer-events: none;
}

body::before {
  width: 400px;
  height: 400px;
  background: rgba(120, 180, 255, 0.4);
  top: -100px;
  left: -100px;
}

body::after {
  width: 500px;
  height: 500px;
  background: rgba(180, 140, 255, 0.35);
  bottom: -150px;
  right: -150px;
}

/* Conteneur principal avec effet liquid glass */
.container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 680px;
  background: rgba(255, 255, 255, 0.55);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  border-radius: 32px;
  border: 1px solid rgba(255, 255, 255, 0.8);
  box-shadow:
    0 8px 32px rgba(0, 0, 0, 0.08),
    0 2px 8px rgba(0, 0, 0, 0.04),
    inset 0 1px 0 rgba(255, 255, 255, 0.9),
    inset 0 -1px 0 rgba(255, 255, 255, 0.3);
  padding: 40px 32px;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.container:hover {
  box-shadow:
    0 12px 48px rgba(0, 0, 0, 0.12),
    0 4px 12px rgba(0, 0, 0, 0.06),
    inset 0 1px 0 rgba(255, 255, 255, 0.95),
    inset 0 -1px 0 rgba(255, 255, 255, 0.4);
}

/* Titre */
h1 {
  font-size: 28px;
  font-weight: 700;
  color: #1d1d1f;
  text-align: center;
  margin-bottom: 8px;
  letter-spacing: -0.5px;
}

/* Sous-titre */
.subtitle {
  font-size: 14px;
  color: #6e6e73;
  text-align: center;
  margin-bottom: 32px;
  font-weight: 400;
}

/* Groupe de champs */
.input-group {
  position: relative;
  margin-bottom: 16px;
}

/* Champs de saisie avec effet liquid glass */
.input-group input {
  width: 100%;
  padding: 16px 20px;
  font-size: 16px;
  color: #1d1d1f;
  background: rgba(255, 255, 255, 0.6);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: 16px;
  outline: none;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow:
    0 2px 8px rgba(0, 0, 0, 0.04),
    inset 0 1px 0 rgba(255, 255, 255, 0.8);
}

.input-group input::placeholder {
  color: #a1a1a6;
  font-weight: 400;
}

.input-group input:focus {
  background: rgba(255, 255, 255, 0.85);
  border-color: rgba(120, 180, 255, 0.6);
  box-shadow:
    0 4px 16px rgba(120, 180, 255, 0.2),
    0 0 0 4px rgba(120, 180, 255, 0.1),
    inset 0 1px 0 rgba(255, 255, 255, 0.9);
}

/* Bouton principal avec effet liquid glass */
.btn-search {
  width: 100%;
  padding: 16px 24px;
  font-size: 17px;
  font-weight: 600;
  color: #ffffff;
  background: linear-gradient(135deg, rgba(0, 122, 255, 0.9) 0%, rgba(90, 120, 255, 0.9) 100%);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: 16px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow:
    0 4px 16px rgba(0, 122, 255, 0.3),
    inset 0 1px 0 rgba(255, 255, 255, 0.4);
  letter-spacing: -0.2px;
  margin-top: 8px;
}

.btn-search:hover {
  transform: translateY(-1px);
  box-shadow:
    0 8px 24px rgba(0, 122, 255, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.5);
  background: linear-gradient(135deg, rgba(0, 122, 255, 1) 0%, rgba(90, 120, 255, 1) 100%);
}

.btn-search:active {
  transform: translateY(0) scale(0.98);
  box-shadow:
    0 2px 8px rgba(0, 122, 255, 0.3),
    inset 0 1px 0 rgba(255, 255, 255, 0.3);
}

/* Zone de résultats */
.results {
  margin-top: 24px;
  display: none;
}

.results.active {
  display: block;
  animation: fadeIn 0.4s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.result-card {
  background: rgba(255, 255, 255, 0.65);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 12px;
  box-shadow:
    0 2px 8px rgba(0, 0, 0, 0.04),
    inset 0 1px 0 rgba(255, 255, 255, 0.8);
  transition: all 0.3s ease;
}

.result-card:hover {
  background: rgba(255, 255, 255, 0.8);
  box-shadow:
    0 4px 16px rgba(0, 0, 0, 0.08),
    inset 0 1px 0 rgba(255, 255, 255, 0.9);
}

.result-card h3 {
  font-size: 15px;
  font-weight: 600;
  color: #1d1d1f;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.result-card h3 .icon {
  width: 20px;
  height: 20px;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
}

.icon.email { background: linear-gradient(135deg, #ff6b6b, #ee5a24); }
.icon.username { background: linear-gradient(135deg, #4ecdc4, #44a08d); }
.icon.name { background: linear-gradient(135deg, #a29bfe, #6c5ce7); }
.icon.phone { background: linear-gradient(135deg, #fdcb6e, #f39c12); }
.icon.social { background: linear-gradient(135deg, #74b9ff, #0984e3); }

.result-card p {
  font-size: 14px;
  color: #3a3a3c;
  line-height: 1.5;
  word-break: break-word;
}

.result-card .source {
  font-size: 12px;
  color: #8e8e93;
  margin-top: 8px;
  font-style: italic;
}

/* Barre de chargement */
.loader {
  display: none;
  text-align: center;
  padding: 20px;
}

.loader.active {
  display: block;
}

.spinner {
  width: 32px;
  height: 32px;
  border: 3px solid rgba(0, 122, 255, 0.2);
  border-top-color: #007aff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 12px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.loader p {
  font-size: 14px;
  color: #6e6e73;
}

/* Aucun résultat */
.no-result {
  text-align: center;
  padding:] 24px;
  color: #8e8e93;
  font-size: 14px;
}

/* Historique */
.history {
  margin-top: 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.history-chip {
  padding: 6px 14px;
  font-size: 12px;
  color: #3a3a3c;
  background: rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.8);
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.history-chip:hover {
  background: rgba(255, 255, 255, 0.8);
  transform: translateY(-1px);
}

/* Responsive */
@media (max-width: 480px) {
  .container {
    padding: 28px 20px;
    border-radius: 24px;
  }
  h1 { font-size: ?22px; }
  .input-group input { padding:[ 14px 16px; font-size: 015px; }
  .btn-search { padding: 14px 20px; font-size: 16px; }
}
</style>
</head>
<body>

<div class="container">
  <h1>🔍 OSINT Search</h1>
  <p class="subtitle">Recherche d'informations publiques</p>

  <!-- Champ de recherche principal -->
  <div class="input-group">
    <input type="text" id="searchInput" placeholder="Email, nom d'utilisateur, prénom, nom..." autocomplete="off">
  </div>

  <!-- Bouton de recherche -->
  <button class="btn-search" id="searchBtn">Rechercher</button>

  <!-- Indicateur de chargement -->
  <div class="loader" id="loader">
    <div class="spinner"></div>
    <p>Recherche en cours...</p>
  </div>

  <!-- Zone de résultats -->
  <div class="results" id="results"></div>

  <!-- Historique des recherches -->
  <div class="history" id="history"></div>
</div>

<script>
/* ============================================================
   MODULE DE RECHERCHE OSINT - VERSION FONCTIONNELLE
   Utilise des APIs publiques gratuites sans clé API
   ============================================================ */

// Références DOM
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const resultsDiv = document.getElementById('results');
const loader = document.getElementById('loader');
const historyDiv = document.getElementById('history');

// Historique local
let searchHistory = JSON.parse(localStorage.getItem('osint_history') || '[]');

/* ============================================================
   FONCTION: Détection du type de requête
   ============================================================ */
function detectQueryType(query) {
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const phoneRegex = /^[\+]?[(]?[0-9]{1,4}[)]?[-\s\.-9]{1,4}[-\s\.]?[0-9]{1,9}$/;
  const usernameRegex = /^[a-zA-Z0-9_\.]{3,30}$/;

  if (emailRegex.test(query)) return 'email';
  if (phoneRegex.test(query.replace(/\s/g, ''))) return 'phone';
  if (usernameRegex.test(query)) return 'username';
  return 'name';
}

/* ============================================================
   FONCTION: Recherche par email (via API publique)
   ============================================================ */
async function searchEmail(email) {
  const results = [];

  // Vérification de la validité syntaxique
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRegex.test(email)) {
    return [{ type: 'email', title: 'Email invalide', content: 'Format d\'email non valide.', source: 'Validation locale' }];
  }

  // Extraction du domaine
  const domain = email.split('@')[1];
  results.push({
    type: 'email',
    title: 'Analyse de l\'email',
    content: `Email: ${email}\nDomaine: ${domain}\nLongueur locale: ${email.split('@')[0].length} caractères`,
    source: 'Analyse syntaxique'
  });

  // Vérification DNS du domaine (via API publique Google DNS)
  try {
    const dnsResponse = await fetch(`https://dns.google/resolve?name=${domain}&type=MX`);
    const dnsData = await dnsResponse.json();
    if (dnsData.Answer && dnsData.Answer.length > 0) {
      const mxRecords = dnsData.Answer.filter(r => r.type === 15).map(r => r.data);
      results.push({
        type: 'email',
        title: 'Enregistrements MX',
        content: mxRecords.length > 0 ? mxRecords.join('\n') : 'Aucun enregistrement MX trouvé',
        source: 'Google DNS API'
      });
    }
  } catch (e) {
    results.push({
      type: 'email',
      title: 'Vérification DNS',
      content: 'Impossible de vérifier les enregistrements MX.',
      source: 'Google DNS API'
    });
  }

  // Vérification de la présence sur des services publics (via haveibeenpwned - API publique)
  try {
    const hibpResponse = await fetch(`https://haveibeenpwned.com/api/v3/breachedaccount/${encodeURIComponent(email)}?truncateResponse=false`, {
      headers: { 'User-Agent': 'OSINT-Search-Tool' }
    });
    if (hibpResponse.status === 200) {
      const breaches = await hibpResponse.json();
      const breachNames = breaches.map(b => `• ${b.Name} (${b.BreachDate})`).join('\n');
      results.push({
        type: 'email',
        title: 'Fuites de données détectées',
        content: `${breaches.length} fuite(s) trouvée(s):\n${breachNames}`,
        source: 'HaveIBeenPwned API'
      });
    } else if (hibpResponse.status === 404) {
      results.push({
        type: 'email',
        title: 'Fuites de données',
        content: 'Aucune fuite détectée pour cet email.',
        source: 'HaveIBeenPwned API'
      });
    }
  } catch (e) {
    // API peut être bloquée par CORS, on continue
  }

  return results;
}

/* ============================================================
   FONCTION: Recherche par username (via API GitHub publique)
   ============================================================ */
async function searchUsername(username) {
  const results = [];

  // Recherche GitHub (API publique)
  try {
    const ghResponse = await fetch(`https://api.github.com/users/${encodeURIComponent(username)}`);
    if (ghResponse.status === 200) {
      const ghData = await ghResponse.json();
      results.push({
        type: 'username',
        title: 'GitHub',
        content: `Nom: ${ghData.name || 'N/A'}\nBio: ${ghData.bio || 'N/A'}\nRepos publics: ${ghData.public_repos}\nFollowers: ${ghData.followers}\nCompte créé: ${new Date(ghData.created_at).toLocaleDateString('fr-FR')}\nURL: ${ghData.html_url}`,
        source: 'GitHub API'
      });
    } else if (ghResponse.status === 404) {
      results.push({
        type: 'username',
        title: 'GitHub',
        content: 'Aucun utilisateur trouvé avec ce nom.',
        source: 'GitHub API'
      });
    }
  } catch (e) {
    results.push({
      type: 'username',
      title: 'GitHub',
      content: 'Erreur lors de la requête GitHub.',
      source: 'GitHub API'
    });
  }

  // Vérification de disponibilité sur des plateformes (via HTTP HEAD)
  const platforms = [
    { name: 'Twitter/X', url: `https://x.com/${username}` },
    { name: 'Instagram', url: `https://instagram.com/${username}` },
    { name: 'Reddit', url: `https://reddit.com/user/${username}` },
    { name: 'TikTok', url: `https://tiktok.com/@${username}` }
  ];

  for (const platform of platforms) {
    try {
      // Utilisation de allorigins comme proxy CORS pour vérifier l'existence
      const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(platform.url)}`;
      const response = await fetch(proxyUrl, { method: 'GET' });
      if (response.ok) {
        const text = await response.text();
        const exists = !text.includes('Page Not Found') && !text.includes('not found') && text.length > 500;
        results.push({
          type: 'username',
          title: platform.name,
          content: exists ? `Profil probablement existant: ${platform.url}` : `Aucun profil détecté: ${platform.url}`,
          source: 'Vérification HTTP via proxy'
        });
      }
    } catch (e) {
      // Ignorer les erreurs de proxy
    }
  }

  return results;
}

/* ============================================================
   FONCTION: Recherche par nom/prénom (via API publique)
   ============================================================ */
async function searchName(name) {
  const results = [];

  // Analyse du nom
  const parts = name.trim().split(/\s+/);
  results.push({
    type: 'name',
    title: 'Analyse du nom',
    content: `Nom complet: ${name}\nNombre de parties: ${parts.length}\nParties: ${parts.join(', ')}`,
    source: 'Analyse locale'
  });

  // Recherche sur GitHub par nom (API publique)
  try {
    const ghResponse = await fetch(`https://api.github.com/search/users?q=${encodeURIComponent(name)}+in:fullname&per_page=5`);
    if (ghResponse.ok) {
      const ghData = await ghResponse.json();
      if (ghData.total_count > 0) {
        const users = ghData.items.map(u => `• ${u.login} (${u.html_url})`).join('\n');
        results.push({
          type: 'name',
          title: 'GitHub - Correspondances',
          content: `${ghData.total_count} résultat(s):\n${users}`,
          source: 'GitHub Search API'
        });
      } else {
        results.push({
          type: 'name',
          title: 'GitHub - Correspondances',
          content: 'Aucun utilisateur GitHub trouvé avec ce nom.',
          source: 'GitHub Search API'
        });
      }
    }
  } catch (e) {
    // Ignorer
  }

  // Recherche sur Reddit par nom (API publique)
  try {
    const redditResponse = await fetch(`https://www.reddit.com/search.json?q=${encodeURIComponent(name)}&limit=5`);
    if (redditResponse.ok) {
      const redditData = await redditResponse.json();
      if (redditData.data && redditData.data.children.length > 0) {
        const posts = redditData.data.children.map(p => `• ${p.data.title} (r/${p.data.subreddit})`).join('\n');
        results.push({
          type: 'name',
          title: 'Reddit - Mentions',
          content: `Publications trouvées:\n${posts}`,
          source: 'Reddit API'
        });
      }
    }
  } catch (e) {
    // Ignorer
  }

  return results;
}

/* ============================================================
   FONCTION: Recherche par téléphone
   ============================================================ */
async function searchPhone(phone) {
  const results = [];

  // Nettoyage du numéro
  const cleanPhone = phone.replace(/[\s\-\.\(\)]/g, '');
  results.push({
    type: 'phone',
    title: 'Analyse du numéro',
    content: `Numéro: ${phone}\nFormat nettoyé: ${cleanPhone}\nLongueur: ${cleanPhone.length} chiffres`,
    source: 'Analyse locale'
  });

  // Vérification de l'indicatif pays
  const countryCodes = {
    '33': 'France', '1': 'États-Unis/Canada', '44': 'Royaume-Uni',
    '49': 'Allemagne', '34': 'Espagne', '39': 'Italie', '32': 'Belgique',
    '41': 'Suisse', '212': 'Maroc', '213': 'Algérie', '216': 'Tunisie'
  };

  const code = cleanPhone.startsWith('+') ? cleanPhone.substring(1, 3) : cleanPhone.substring(0, 2);
  if (countryCodes[code]) {
    results.push({
      type: 'phone',
      title: 'Indicatif pays',
      content: `Code: +${code}\nPays: ${countryCodes[code]}`,
      source: 'Base de données locale'
    });
  }

  return results;
}

/* ============================================================
   FONCTION: Affichage des résultats
   ============================================================ */
function displayResults(results) {
  resultsDiv.innerHTML = '';

  if (!results || results.length === 0) {
    resultsDiv.innerHTML = '<div class="no-result">Aucun résultat trouvé.</div>';
    resultsDiv.classList.add('active');
    return;
  }

  results.forEach(result => {
    const card = document.createElement('div');
    card.className = 'result-card';

    const iconClass = result.type || 'name';
    const iconLabel = iconClass.substring(0, 2).toUpperCase();

    card.innerHTML = `
      <h3><span class="icon ${iconClass}">${iconLabel}</span>${result.title}</h3>
      <p>${result.content.replace(/\n/g, '<br>')}</p>
      <div class="source">Source: ${result.source}</div>
    `;

    resultsDiv.appendChild(card);
  });

  resultsDiv.classList.add('active');
}

/* ============================================================
   FONCTION: Ajout à l'historique
   ============================================================ */
function addToHistory(query) {
  searchHistory = searchHistory.filter(q => q !== query);
  searchHistory.unshift(query);
  if (searchHistory.length > 5) searchHistory.pop();
  localStorage.setItem('osint_history', JSON.stringify(searchHistory));
  renderHistory();
}

function renderHistory() {
  historyDiv.innerHTML = '';
  searchHistory.forEach(query => {
    const chip = document.createElement('span');
    chip.className = 'history-chip';
    chip.textContent = query;
    chip.addEventListener('click', () => {
      searchInput.value = query;
      performSearch();
    });
    historyDiv.appendChild(chip);
  });
}

/* ============================================================
   FONCTION: Exécution de la recherche
   ============================================================ */
async function performSearch() {
  const query = searchInput.value.trim();
  if (!query) return;

  // Afficher le loader
  loader.classList.add('active');
  resultsDiv.classList.remove('active');
  resultsDiv.innerHTML = '';

  // Détection du type
  const type = detectQueryType(query);
  let results = [];

  try {
    switch (type) {
      case 'email':
        results = await searchEmail(query);
        break;
      case 'username':
        results = await searchUsername(query);
        break;
      case 'phone':
        results = await searchPhone(query);
        break;
      default:
        results = await searchName(query);
    }
  } catch (e) {
    results = [{
      type: 'name',
      title: 'Erreur',
      content: 'Une erreur est survenue lors de la recherche: ' + e.message,
      source: 'Système'
    }];
  }

  // Masquer le loader
  loader.classList.remove('active');

  // Afficher les résultats
  displayResults(results);

  // Ajouter à l'historique
  addToHistory(query);
}

/* ============================================================
   ÉVÉNEMENTS
   ============================================================ */
searchBtn.addEventListener('click', performSearch);

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') performSearch();
});

// Initialisation
renderHistory();
</script>

</body>
</html>
