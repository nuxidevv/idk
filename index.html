/* ============================================================
   PROXY CORS — plusieurs en fallback
   ============================================================ */
const PROXIES = [
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`
];

async function P(url) {
  for (const proxy of PROXIES) {
    try {
      const r = await fetch(proxy(url), { redirect: "follow" });
      if (r.ok) return r;
    } catch {}
  }
  throw new Error("proxy failed");
}

/* ============================================================
   CHECKERS APIs OFFICIELLES (fiables à 100%)
   ============================================================ */
async function vGitHub(u){
  try {
    const r = await fetch(`https://api.github.com/users/${u}`);
    return r.status === 200
      ? {exists:true, confidence:1, reason:"API GitHub 200"}
      : {exists:false, confidence:1, reason:"API GitHub 404"};
  } catch { return {exists:false, confidence:0, reason:"erreur réseau"}; }
}

async function vReddit(u){
  try {
    const r = await fetch(`https://www.reddit.com/user/${u}/about.json`);
    if (r.status !== 200) return {exists:false, confidence:1, reason:"404"};
    const j = await r.json();
    const ok = !!(j && j.data && j.data.name);
    return {exists:ok, confidence:1, reason: ok ? "compte Reddit valide" : "pas de donnée"};
  } catch { return {exists:false, confidence:0, reason:"erreur réseau"}; }
}

async function vGitLab(u){
  try {
    const r = await fetch(`https://gitlab.com/api/v4/users?username=${u}`);
    if (r.status !== 200) return {exists:false, confidence:1, reason:"404"};
    const j = await r.json();
    const ok = Array.isArray(j) && j.length > 0;
    return {exists:ok, confidence:1, reason: ok ? "utilisateur GitLab trouvé" : "liste vide"};
  } catch { return {exists:false, confidence:0, reason:"erreur réseau"}; }
}

/* ============================================================
   CHECKER HTML AMÉLIORÉ — score multi-signatures
   Analyse le HTML : cherche des marqueurs POSITIFS (profile,
   username, followers...) et des marqueurs NÉGATIFS (404,
   page not found...). Score 0-1.
   ============================================================ */
function htmlCheck(options) {
  const {
    negatives = [],
    positives = [],
    minScore = 0.5
  } = options;

  return async (u) => {
    try {
      const r = await P(u);
      if (r.status !== 200) {
        return { exists:false, confidence:1, reason:`HTTP ${r.status}` };
      }
      const html = await r.text();
      const low = html.toLowerCase();

      // Vérifie les négatifs en priorité
      for (const n of negatives) {
        if (low.includes(n.toLowerCase())) {
          return { exists:false, confidence:0.9, reason:`marqueur négatif: "${n}"` };
        }
      }

      // Compte les positifs trouvés
      let found = 0;
      const hits = [];
      for (const p of positives) {
        if (low.includes(p.toLowerCase())) {
          found++;
          hits.push(p);
        }
      }

      // Score basé sur le ratio
      const ratio = positives.length > 0 ? found / positives.length : 0.5;
      const exists = ratio >= minScore;

      return {
        exists,
        confidence: Math.min(0.5 + ratio * 0.4, 0.85),
        reason: hits.length
          ? `${found}/${positives.length} marqueur(s): ${hits.slice(0,3).join(", ")}`
          : `${found}/${positives.length} marqueur(s) positif(s)`
      };
    } catch (e) {
      return { exists:false, confidence:0, reason:"proxy inaccessible" };
    }
  };
}

/* ============================================================
   EMAIL
   ============================================================ */
function isValidEmail(e) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
}

/* MD5 pur JS (fonctionne partout, y compris iOS file://) */
function md5(str) {
  function rotl(n, s) { return (n << s) | (n >>> (32 - s)); }
  function add(a, b) { return (a + b) & 0xFFFFFFFF; }
  const bytes = new TextEncoder().encode(str);
  const K = [];
  for (let i = 0; i < 64; i++) K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296);
  const S = [7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,
             5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,
             4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,
             6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  const orig = bytes.length;
  const ml = orig * 8;
  const padded = new Uint8Array(((orig + 8) >> 6 << 6) + 64);
  padded.set(bytes);
  padded[orig] = 0x80;
  const dv = new DataView(padded.buffer);
  dv.setUint32(padded.length - 8, ml, true);
  dv.setUint32(padded.length - 4, Math.floor(ml / 4294967296), true);
  let a = 0 MXx67452301, b = 0xEFCDAB89, c = 0x98BADCFE, d = 0x10325476;
  for (let i = 0; i < padded.length; i += 64) {
    const M = [];
    for (let j = 0; j < 16; j++) M[j] = dv.getUint32(i + j * 4, true);
    let [A,B,C,D] = [a,b,c,d];
    for (let j = 0; j < 64; j++) {
      let F, g;
      if (j < 16)      { F = (B & C) | (~B & D);  g = j; }
      else if (j < 32) { F = (D & B) | (~D & C);  g = (5*j + 1) % 16; }
      else if (j < 48) { F = B ^ C ^ D;           g = (3*j + 5) % 16; }
      else             { F = C ^ (B | ~D);        g = (7*j) % 16; }
      F = add(add(add(F, A), K[j]), M[g]);
      A = D; D = C; C = B;
      B = add(B, rotl(F, S[j]));
    }
    a = add(a, A); b = add(b, B); c = add(c, C); d = add(d, D);
  }
  const toHex = n => n.toString(16).padStart(8, "0").match(/../g).reverse().join("");
  return toHex(a) + toHex(b) + toHex(c) + toHex(d);
}

async function checkGravatar(email) {
  try {
    const hash = md5(email.trim().toLowerCase());
    const url = `https://www.gravatar.com/avatar/${hash}?d=404`;
    const r = await P(url);
    if (r.status === 200) {
      const txt = await r.text();
      return { exists: txt.length > 0, reason: txt.length > 0 ? "avatar Gravatar public trouvé" : "aucun Gravatar" };
    }
    return { exists: false, reason: "aucun Gravatar public" };
  } catch {
    return { exists: false, reason: "vérification impossible" };
  }
}

async function checkHIBP(email) {
  try {
    const url = `https://haveibeenpwned.com/api/v3/breachedaccount/${encodeURIComponent(email)}?truncateResponse=true`;
    const r = await P(url);
    if (r.status === 404) return { exists: false, breaches: [], reason: "aucune fuite connue" };
    if (r.status === 200) {
      const data = await r.json();
      return { exists: true, breaches: data.map(b => b.Name), reason: `${data.length} fuite(s) connue(s)` };
    }
    if (r.status === 401) return { exists: false, breaches: [], reason: "API HIBP requiert une clé" };
    return { exists: false, breaches: [], reason: `HIBP: HTTP ${r.status}` };
  } catch {
    return { exists: false, breaches: [], reason: "HIBP inaccessible" };
  }
}

async function checkMX(domain) {
  try {
    const url = `https://dns.google/resolve?name=${encodeURIComponent(domain)}&type=MX`;
    const r = await fetch(url);
    if (!r.ok) return { hasMX: false, records: [], reason: `DNS: HTTP ${r.status}` };
    const j = await r.json();
    const records = (j.Answer || []).filter(a => a.type === 15).map(a => a.data);
    return { hasMX: records.length > 0, records, reason: records.length > 0 ? `${records.length} serveur(s)` : "aucun MX" };
  } catch {
    return { hasMX: false, records: [], reason: "DNS inaccessible" };
  }
}

async function checkA(domain) {
  try {
    const url = `https://dns.google/resolve?name=${encodeURIComponent(domain)}&type=A`;
    const r = await fetch(url);
    if (!r.ok) return { hasA: false, records: [] };
    const j = await r.json();
    const records = (j.Answer || []).filter(a => a.type === 1).map(a => a.data);
    return { hasA: records.length > 0, records };
  } catch {
    return { hasA: false, records: [] };
  }
}

/* ============================================================
   RENDU — EMAIL
   ============================================================ */
async function renderEmail(email) {
  const out = document.getElementById("out");
  out.innerHTML = `<div class="status" id="status">analyse de l'email…</div>`;

  if (!isValidEmail(email)) {
    out.innerHTML = `<div class="none">format d'email invalide</div>`;
    return;
  }

  const domain = email.toLowerCase().split("@")[1];

  const [mx, a] = await Promise.all([checkMX(domain), checkA(domain)]);

  document.getElementById("status").textContent = "vérification Gravatar…";
  const gravatar = await checkGravatar(email);

  document.getElementById("status").textContent = "vérification fuites (HIBP)…";
  const hibp = await checkHIBP(email);

  out.innerHTML = "";

  const head = document.createElement("div");
  head.className = "status";
  head.textContent = `résultats pour ${email}`;
  out.appendChild(head);

  // Section 1 : Validité technique
  const s1 = document.createElement("div");
  s1.className = "section-title";
  s1.textContent = "Validité technique";
  out.appendChild(s1);

  addInfoCard(out, {
    dotClass: "blue",
    title: "Format email",
    meta: "RFC 5322",
    badge: { text: "valide", cls: "ok" }
  });

  addInfoCard(out, {
    dotClass: mx.hasMX ? "blue" : "red",
    title: "Serveurs MX du domaine",
    meta: mx.hasMX ? mx.records.slice(0,3).join(" · ") : mx.reason,
    badge: mx.hasMX ? { text: `${mx.records.length} MX`, cls: "ok" } : { text: "aucun", cls: "neg" }
  });

  if (a.hasA) {
    addInfoCard(out, {
      dotClass: "gray",
      title: "Enregistrement A",
      meta: a.records.slice(0,3).join(" · ")
    });
  }

  // Section 2 : Présence publique
  const s2 = document.createElement("div");
  s2.className = "section-title";
  s2.textContent = "Présence publique";
  out.appendChild(s2);

  addInfoCard(out, {
    dotClass: gravatar.exists ? "blue" : "gray",
    title: "Gravatar",
    meta: gravatar.exists
      ? "Un avatar public est associé à cet email."
      : "Aucun avatar Gravatar public associé.",
    badge: gravatar.exists
      ? { text: "existe", cls: "ok" }
      : { text: "aucun", cls: "neg" }
  });

  // Section 3 : Fuites
  const s3 = document.createElement("div");
  s3.className = "section-title";
  s3.textContent = "Fuites de données connues";
  out.appendChild(s3);

  if (hibp.exists && hibp.breaches.length) {
    addInfoCard(out, {
      dotClass: "red",
      title: `Have I Been Pwned — ${hibp.breaches.length} fuite(s)`,
      meta: hibp.breaches.join(", "),
      badge: { text: "compromis", cls: "neg" }
    });
  } else {
    addInfoCard(out, {
      dotClass: "gray",
      title: "Have I Been Pwned",
      meta: hibp.reason || "aucune fuite trouvée",
      badge: { text: hibp.reason?.includes("clé") ? "indispo" : "aucune", cls: hibp.reason?.includes("clé") ? "warn" : "ok" }
    });
  }
}

   ============================================================ */
async function renderIdentity(target) {
  const out = document.getElementById("out");
  const norm = target.trim().replace(/\s+/g,"").toLowerCase();

  out.innerHTML = `<div class="status" id="status">analyse de ${PLATFORMS.length} plateformes…</div>`;

  let done = 0, found = 0;
  const foundEls = [];

  PLATFORMS.forEach(([name, urlFn, checker]) => {
    const url = urlFn(norm);
    Promise.resolve(checker(norm, name)).then(res => {
      done++;
      if (res && res.exists && res.confidence >= 0.5) {
        found++;
        const div = document.createElement("div");
        div.className = "card";
        const conf = Math.round((res.confidence || 0) * 100);
        const badgeCls = res.confidence >= 0.85 ? "ok" : "warn";
        div.innerHTML = `
          <div class="dot"></div>
          <div class="info">
            <a href="${url}" target="_blank" rel="noopener">${name}
              <span class="badge ${badgeCls}">${conf}%</span>
            </a>
            <div class="meta">${url}</div>
            <div class="meta">${escapeHtml(res.reason || "")}</div>
          </div>
        `;
        foundEls.push(div);
      }
      const st = document.getElementById("status");
      if (st) st.textContent = `${done}/${PLATFORMS.length} · ${found} trouvé(s)`;
      if (done === PLATFORMS.length) {
        out.innerHTML = "";
        if (found === 0) {
          out.innerHTML = `<div class="none">aucun compte trouvé</div>`;
        } else {
          const head = document.createElement("div");
          head.className = "status";
          head.textContent = `${found} compte(s) trouvé(s)`;
          out.appendChild(head);
          foundEls.forEach(el => out.appendChild(el));
        }
      }
    }).catch(() => {
      done++;
      const st = document.getElementById("status");
      if (st) st.textContent = `${done}/${PLATFORMS.length} · ${found} trouvé(s)`;
      if (done === PLATFORMS.length) {
        out.innerHTML = "";
        if (found === 0) {
          out.innerHTML = `<div class="none">aucun compte trouvé</div>`;
        } else {
          const head = document.createElement("div");
          head.className = "status";
          head.textContent = `${found} compte(s) trouvé(s)`;
          out.appendChild(head);
          foundEls.forEach(el => out.appendChild(el));
        }
      }
    });
  });
}

function addInfoCard(parent, {dotClass, title, meta, badge}) {
  const c = document.createElement("div");
  c.className = "card info-card";
  c.innerHTML = `
    <div class="dot ${dotClass}"></div>
    <div class="info">
      <div class="title">${escapeHtml(title)}${badge ? ` <span class="badge ${badge.cls}">${escapeHtml(badge.text)}</span>` : ""}</div>
      <div class="meta">${escapeHtml(meta || "")}</div>
    </div>
  `;
  parent.appendChild(c);
}
