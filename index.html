<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSINT AI — Recherche Email / Username / Nom</title>
<style>
  /* Reset technique */
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0a0a0a;
    color:#e0e0e0;
    font-family:'Courier New', monospace;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:40px 20px;
  }
  h1 {
    color:#00ff9d;
    font-size:1.6rem;
    letter-spacing:2px;
    margin-bottom:8px;
    text-shadow:0 0 10px #00ff9d55;
  }
  .sub {
    color:#555;
    font-size:0.75rem;
    margin-bottom:30px;
    letter-spacing:1px;
  }
  .panel {
    width:100%;
    max-width:720px;
    background:#111;
    border:1px solid #1f1f1f;
    border-radius:10px;
    padding:24px;
    box-shadow:0 0 30px #000000aa;
  }
  label {
    display:block;
    font-size:0.7rem;
    color:#00ff9d;
    margin-bottom:6px;
    letter-spacing:1px;
  }
  input, select {
    width:100%;
    background:#0a0a0a;
    border:1px solid #222;
    color:#e0e0e0;
    padding:12px;
    border-radius:6px;
    font-family:inherit;
    font-size:0.85rem;
    margin-bottom:16px;
    outline:none;
    transition:border 0.2s;
  }
  input:focus, select:focus { border-color:#00ff9d; }
  button {
    width:100%;
    background:#00ff9d;
    color:#000;
    border:none;
    padding:14px;
    border-radius:6px;
    font-family:inherit;
    font-weight:bold;
    font-size:0.85rem;
    letter-spacing:1px;
    cursor:pointer;
    transition:background 0.2s;
  }
  button:hover { background:#00cc7d; }
  button:disabled { background:#333; color:#666; cursor:not-allowed; }
  .results {
    margin-top:24px;
    background:#0a0a0a;
    border:1px solid #1f1f1f;
    border-radius:8px;
    padding:16px;
    min-height:120px;
    font-size:0.8rem;
    line-height:1.6;
    white-space:pre-wrap;
    word-break:break-all;
  }
  .tag {
    display:inline-block;
    background:#00ff9d22;
    color:#00ff9d;
    border:1px solid #00ff9d55;
    border-radius:4px;
    padding:2px 8px;
    font-size:0.7rem;
    margin:2px;
  }
  .err { color:#ff4d4d; }
  .ok { color:#00ff9d; }
  .info { color:#888; }
  .loader {
    display:none;
    color:#00ff9d;
    font-size:0.75rem;
    margin-top:12px;
  }
  .footer {
    margin-top:20px;
    font-size:0.65rem;
    color:#333;
    text-align:center;
  }
</style>
</head>
<body>

<h1>OSINT AI TERMINAL</h1>
<div class="sub">RECHERCHE : EMAIL / USERNAME / NOM / PRÉNOM</div>

<div class="panel">
  <label>TYPE DE RECHERCHE</label>
  <select id="type">
    <option value="email">Email</option>
    <option value="username">Username</option>
    <option value="fullname">Prénom + Nom</option>
  </select>

  <label>CIBLE</label>
  <input id="target" type="text" placeholder="ex: john.doe@mail.com / johndoe / John Doe">

  <button id="go">LANCER LA RECHERCHE</button>
  <div class="loader" id="loader">> Analyse en cours...</div>

  <div class="results" id="results">
    <span class="info">> En attente d'une requête.</span>
  </div>
</div>

<div class="footer">Mod made by me — usage local uniquement</div>

<script>
/* ============================================================
   MOTEUR OSINT — GÉNÉRATION DE DORKS + LIENS OUTILS + IA LOCALE
   ============================================================ */

// Génère les Google Dorks selon le type et la cible
function buildDorks(type, target) {
  const t = target.trim();
  const dorks = [];
  if (type === "email") {
    dorks.push(`"${t}"`);
    dorks.push(`"${t}" site:pastebin.com`);
    dorks.push(`"${t}" filetype:pdf`);
    dorks.push(`"${t}" -site:${t.split("@")[1] || "example.com"}`);
  } else if (type === "username") {
    dorks.push(`"${t}" site:github.com`);
    dorks.push(`"${t}" site:twitter.com OR site:x.com`);
    dorks.push(`"${t}" site:reddit.com`);
    dorks.push(`"${t}" inurl:profile`);
    dorks.push(`intitle:"${t}"`);
  } else {
    // Prénom + Nom : dorks croisés
    const parts = t.split(" ");
    if (parts.length >= 2) {
      dorks.push(`"${parts[0]}" "${parts[1]}"`);
      dorks.push(`"${parts[0]} ${parts[1]}" site:linkedin.com`);
      dorks.push(`"${parts[0]} ${parts[1]}" site:facebook.com`);
      dorks.push(`"${parts[0]} ${parts[1]}" filetype:pdf`);
      dorks.push(`"${parts[0]} ${parts[1]}" email OR contact`);
      dorks.push(`"${parts[1]}" "${parts[0]}" site:github.com`);
    } else {
      dorks.push(`"${t}"`);
    }
  }
  return dorks;
}

// Construit les URLs de moteurs de recherche à partir des dorks
function buildSearchLinks(dorks) {
  return dorks.map(d => {
    const encoded = encodeURIComponent(d);
    return {
      dork: d,
      google: `https://www.google.com/search?q=${encoded}`,
      bing: `https://www.bing.com/search?q=${encoded}`,
      duck: `https://duckduckgo.com/?q=${encoded}`
    };
  });
}

// Outils OSINT externes (liens directs, pas d'API pour rester local)
function buildTools(type, target) {
  const t = encodeURIComponent(target.trim());
  const tools = [];
  if (type === "email") {
    tools.push({ name: "Have I Been Pwned", url: `https://haveibeenpwned.com/account/${t}` });
    tools.push({ name: "Hunter.io", url: `https://hunter.io/search/${t}` });
    tools.push({ name: "Epieos", url: `https://epieos.com/?q=${t}` });
    tools.push({ name: "EmailRep", url: `https://emailrep.io/${t}` });
  } else if (type === "username") {
    tools.push({ name: "Namechk", url: `https://namechk.com/?q=${t}` });
    tools.push({ name: "WhatsMyName", url: `https://whatsmyname.app/?q=${t}` });
    tools.push({ name: "Sherlock (local)", url: `#` });
    tools.push({ name: "GitHub Search", url: `https://github.com/search?q=${t}&type=users` });
  } else {
    tools.push({ name: "TruePeopleSearch", url: `https://www.truepeoplesearch.com/results?name=${t}` });
    tools.push({ name: "FastPeopleSearch", url: `https://www.fastpeoplesearch.com/name/${t}` });
    tools.push({ name: "LinkedIn", url: `https://www.linkedin.com/search/results/all/?keywords=${t}` });
    tools.push({ name: "Facebook", url: `https://www.facebook.com/search/top?q=${t}` });
  }
  return tools;
}

// "IA" locale : scoring de probabilité basé sur heuristiques
function aiScore(type, target) {
  let score = 0;
  const t = target.trim();
  if (type === "email") {
    if (/^[^@]+@[^@]+\.[^@]+$/.test(t)) score += 40;
    if (/gmail|yahoo|outlook|hotmail|proton/i.test(t)) score += 20;
    if (/\d/.test(t)) score += 10;
    if (t.length > 15) score += 10;
  } else if (type === "username") {
    if (/^[a-zA-Z0-9_.]+$/.test(t)) score += 30;
    if (t.length >= 6 && t.length <= 15) score += 30;
    if (/\d/.test(t)) score += 15;
  } else {
    const parts = t.split(" ");
    if (parts.length >= 2) score += 40;
    if (parts.every(p => /^[A-Za-zÀ-ÿ-]+$/.test(p))) score += 30;
    if (t.length > 8) score += 10;
  }
  return Math.min(score, 100);
}

// Rendu des résultats dans le DOM
function render(type, target) {
  const results = document.getElementById("results");
  const dorks = buildDorks(type, target);
  const links = buildSearchLinks(dorks);
  const tools = buildTools(type, target);
  const score = aiScore(type, target);

  let html = "";
  html += `<span class="ok">> CIBLE : ${target}</span>\n`;
  html += `<span class="info">> TYPE : ${type}</span>\n`;
  html += `<span class="info">> SCORE IA (pertinence) : ${score}/100</span>\n\n`;

  html += `<span class="ok">[ GOOGLE DORKS ]</span>\n`;
  links.forEach((l, i) => {
    html += `${i + 1}. ${l.dork}\n`;
    html += `   <a href="${l.google}" target="_blank" style="color:#00ff9d">Google</a> | `;
    html += `<a href="${l.bing}" target="_blank" style="color:#00ff9d">Bing</a> | `;
    html += `<a href="${l.duck}" target="_blank" style="color:#00ff9d">DuckDuckGo</a>\n`;
  });

  html += `\n<span class="ok">[ OUTILS OSINT ]</span>\n`;
  tools.forEach(t => {
    html += `<span class="tag"><a href="${t.url}" target="_blank" style="color:#00ff9d;text-decoration:none">${t.name}</a></span>`;
  });

  results.innerHTML = html;
}

// Événement bouton
document.getElementById("go").addEventListener("click", () => {
  const type = document.getElementById("type").value;
  const target = document.getElementById("target").value;
  if (!target.trim()) {
    document.getElementById("results").innerHTML = `<span class="err">> ERREUR : cible vide.</span>`;
    return;
  }
  const loader = document.getElementById("loader");
  loader.style.display = "block";
  document.getElementById("go").disabled = true;
  // Simulation latence IA
  setTimeout(() => {
    loader.style.display = "none";
    document.getElementById("go").disabled = false;
    render(type, target);
  }, 600);
});
</script>
</body>
</html>
