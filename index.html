<body>
<div class="wrap">
  <h1>OSINT</h1>
  <div class="sub">recherche approfondie par prénom nom</div>

  <input id="target" placeholder="prénom nom..." autocomplete="off">

  <button id="go">Rechercher</button>

<script>
/* ============================================================
   CAPTURE D'ERREURS
   ============================================================ */
window.addEventListener("error", e => {
  const out = document.getElementById("out");
  if (out) out.innerHTML = `<div class="err">Erreur : ${e.message}</div>`;
});

/* ============================================================
   PROXY CORS
   ============================================================ */
const PROXIES = [
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
  u => `https://corsproxy.io/?${encodeURIComponent(u)}`
];

async function fetchWithTimeout(url, ms) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  try {
    const r = await fetch(url, { signal: controller.signal });
    clearTimeout(timer);
    return r;
  } catch (e) {
    clearTimeout(timer);
    throw e;
  }
}

async function P(url) {
  const promises = PROXIES.map(p =>
    fetchWithTimeout(p(url), 8000).then(r => r.ok ? r : Promise.reject())
  );
  return Promise.any(promises);
}

/* ============================================================
   NORMALISATION — pour comparer noms
   ============================================================ */
function normalize(s) {
  return String(s || "")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // enlève accents
    .replace(/[^a-z0-9 ]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

// Vérifie si le nom complet OU prénom + nom apparaît dans le texte
function containsName(text, fullName) {
  if (!text) return false;
  const normText = normalize(text);
  const normName = normalize(fullName);
  if (!normName) return false;

  // 1) Nom complet d'un coup
  if (normText.includes(normName)) return true;

  // 2) Prénom ET nom présents (dans n'importe quel ordre)
  const parts = normName.split(" ").filter(p => p.length >= 2);
  if (parts.length < 2) return false;
  const allPresent = parts.every(p => normText.includes(p));
  return allPresent;
}

/* ============================================================
   VÉRIFICATION PROFIL — nom réellement présent dans la page
   ============================================================ */
async function verifyProfile(url, fullName, positives) {
  try {
    const r = await P(url);
    if (r.status !== 200) return { confirmed:false };

    const html = await r.text();

    // 1) Cherche d'abord le nom complet dans la page
    const nameFound = containsName(html, fullName);

    // 2) Cherche les signatures de profil
    const low = html.toLowerCase();
    let posFound = 0;
    for (const p of positives) {
      if (low.includes(p.toLowerCase())) posFound++;
    }
    const ratio = positives.length > 0 ? posFound / positives.length : 0;

    // 3) Décision
    if (nameFound && ratio >= 0.3) {
      return { confirmed:true, level:"ok", reason:`nom complet détecté` };
    }
    if (nameFound) {
      return { confirmed:true, level:"ok", reason:`nom détecté dans la page` };
    }
    if (ratio >= 0.6) {
      return { confirmed:true, level:"warn", reason:`profil probable (nom non trouvé)` };
    }
    return { confirmed:false };
  } catch {
    return { confirmed:false };
  }
}

/* ============================================================
   GOOGLE DORKS ÉTENDUS
   ============================================================ */
function buildDorks(fullName) {
  const dorks = [
    { label: "Nom complet exact",           q: `"${fullName}"` },
    { label: "Nom + LinkedIn",              q: `"${fullName}" site:linkedin.com` },
    { label: "Nom + Facebook",              q: `"${fullName}" site:facebook.com` },
    { label: "Nom + Instagram",             q: `"${fullName}" site:instagram.com` },
    { label: "Nom + Twitter/X",             q: `"${fullName}" (site:twitter.com OR site:x.com)` },
    { label: "Nom + GitHub",                q: `"${fullName}" site:github.com` },
    { label: "Nom + PDF",                   q: `"${fullName}" filetype:pdf` },
    { label: "Nom + CV",                    q: `"${fullName}" (CV OR resume OR curriculum)` },
    { label: "Nom + Email",                 q: `"${fullName}" (email OR mail OR contact)` },
    { label: "Nom + Téléphone",             q: `"${fullName}" (téléphone OR phone OR tel)` },
    { label: "Nom + Documents",             q: `"${fullName}" (filetype:docx OR filetype:xlsx OR filetype:pptx)` },
    { label: "Nom + Pastebin",              q: `"${fullName}" site:pastebin.com` },
    { label: "Nom + Wayback Machine",       q: `"${fullName}" site:web.archive.org` },
    { label: "Nom + Reddit",                q: `"${fullName}" site:reddit.com` },
    { label: "Nom + YouTube",               q: `"${fullName}" site:youtube.com` },
    { label: "Nom + TikTok",                q: `"${fullName}" site:tiktok.com` },
    { label: "Nom + Pinterest",             q: `"${fullName}" site:pinterest.com` },
    { label: "Nom + Medium",                q: `"${fullName}" site:medium.com` },
    { label: "Nom + Tumblr",                q: `"${fullName}" site:tumblr.com` },
    { label: "Nom + Flickr",                q: `"${fullName}" site:flickr.com` },
    { label: "Nom + StackOverflow",         q: `"${fullName}" site:stackoverflow.com` },
    { label: "Nom + ORCID",                 q: `"${fullName}" site:orcid.org` },
    { label: "Nom + ResearchGate",          q: `"${fullName}" site:researchgate.net` },
    { label: "Nom + Google Scholar",        q: `"${fullName}" (site:scholar.google.com OR scholar)` },
    { label: "Nom + Doctolib",              q: `"${fullName}" site:doctolib.fr` },
    { label: "Nom + Société.com",           q: `"${fullName}" (site:societe.com OR site:infogreffe.fr)` },
    { label: "Nom + Pages Jaunes",          q: `"${fullName}" site:pagesjaunes.fr` },
    { label: "Nom + Copains d'avant",       q: `"${fullName}" site:copainsdavant.linternaute.com` },
    { label: "Nom + index de fichiers",     q: `"${fullName}" intitle:"index of"` },
    { label: "Nom + Documents compromis",   q: `"${fullName}" (password OR login OR credentials)` },
  ];

  return dorks;
}

async function searchDork(query) {
  try {
    const ddgUrl = `https://html.duckduckgo.com/html/?q=${encodeURIComponent(query)}`;
    const r = await P(ddgUrl);
    if (r.status !== 200) return { found:false, count:0, hits:[] };
    const html = await r.text();

    const results = [];
    const regex = /<a[^>]*class="result__a"[^>]*href="([^"]+)"[^>]*>([\s\S]*?)<\/a>/g;
    let m;
    while ((m = regex.exec(html)) !== null && results.length < 5) {
      let url = m[1];
      const uddg = url.match(/uddg=([^&]+)/);
      if (uddg) url = decodeURIComponent(uddg[1]);
      const title = m[2].replace(/<[^>]+>/g, "").replace(/&amp;/g,"&").trim();
      if (title && url && url.startsWith("http")) {
        results.push({ title: title.slice(0,80), url });
      }
    }

    return { found: results.length > 0, count: results.length, hits: results };
  } catch {
    return { found:false, count:0, hits:[] };
  }
}

/* ============================================================
   OUTILS ALTERNATIFS (moteurs supplémentaires)
   ============================================================ */
async function searchBrave(query) {
  try {
    const url = `https://search.brave.com/search?q=${encodeURIComponent(query)}`;
    const r = await P(url);
    if (r.status !== 200) return { found:false, hits:[] };
    const html = await r.text();
    const results = [];
    const regex = /<a[^>]*href="(https?:\/\/[^"]+)"[^>]*class="[^"]*heading-serpresult[^"]*"[^>]*>([\s\S]*?)<\/a>/g;
    let m;
    while ((m = regex.exec(html)) !== null && results.length < 4) {
      const url = m[1];
      const title = m[2].replace(/<[^>]+>/g, "").trim();
      if (title && url && !url.includes("brave.com")) {
        results.push({ title: title.slice(0,80), url });
      }
    }
    return { found: results.length > 0, hits: results };
  } catch {
    return { found:false, hits:[] };
  }
}

async function searchBing(query) {
  try {
    const url = `https://www.bing.com/search?q=${encodeURIComponent(query)}`;
    const r = await P(url);
    if (r.status !== 200) return { found:false, hits:[] };
    const html = await r.text();
    const results = [];
    const regex = /<h2><a href="(https?:\/\/[^"]+)"[^>]*>([\s\S]*?)<\/a><\/h2>/g;
    let m;
    while ((m = regex.exec(html)) !== null && results.length < 4) {
      const url = m[1];
      const title = m[2].replace(/<[^>]+>/g, "").trim();
      if (title && url && !url.includes("bing.com")) {
        results.push({ title: title.slice(0,80), url });
      }
    }
    return { found: results.length > 0, hits: results };
  } catch {
    return { found:false, hits:[] };
  }
}

/* ============================================================
   WAYBACK MACHINE (archives)
   ============================================================ */
async function checkWayback(query) {
  try {
    const url = `https://archive.org/advancedsearch.php?q=${encodeURIComponent('"' + query + '"')}&fl[]=identifier&fl[]=title&rows=5&output=json`;
    const r = await fetchWithTimeout(url, 6000);
    if (!r.ok) return { found:false, hits:[] };
    const j = await r.json();
    const docs = j?.response?.docs || [];
    const hits = docs.map(d => ({
      title: d.title || d.identifier,
      url: `https://archive.org/details/${d.identifier}`
    }));
    return { found: hits.length > 0, hits };
  } catch {
    return { found:false, hits:[] };
  }
}

/* ============================================================
   GOOGLE SCHOLAR (publications)
   ============================================================ */
async function checkScholar(fullName) {
  try {
    const url = `https://scholar.google.com/scholar?q=${encodeURIComponent('"' + fullName + '"')}`;
    const r = await P(url);
    if (r.status !== 200) return { found:false, hits:[] };
    const html = await r.text();
    const results = [];
    const regex = /<h3[^>]*class="gs_rt"[^>]*><a[^>]*href="([^"]+)"[^>]*>([\s\S]*?)<\/a>/g;
    let m;
    while ((m = regex.exec(html)) !== null && results.length < 4) {
      const url = m[1];
      const title = m[2].replace(/<[^>]+>/g, "").trim();
      if (title && url) results.push({ title: title.slice(0,80), url });
    }
    return { found: results.length > 0, hits: results };
  } catch {
    return { found:false, hits:[] };
  }
}

/* ============================================================
   DOCTOLIB / SANTÉ (France)
   ============================================================ */
async function checkDoctolib(fullName) {
  try {
    const url = `https://www.doctolib.fr/search?query=${encodeURIComponent(fullName)}`;
    const r = await P(url);
    if (r.status !== 200) return { found:false, hits:[] };
    const html = await r.text();
    const results = [];
    const regex = /<a[^>]*href="(\/[\w-]+\/[\w-]+)"[^>]*>([\s\S]*?)<\/a>/g;
    let m;
    while ((m = regex.exec(html)) !== null && results.length < 3) {
      const title = m[2].replace(/<[^>]+>/g, "").trim();
      if (title && title.length > 5 && title.length < 100 && containsName(title, fullName)) {
        results.push({ title: title.slice(0,80), url: `https://www.doctolib.fr${m[1]}` });
      }
    }
    return { found: results.length > 0, hits: results };
  } catch {
    return { found:false, hits:[] };
  }
}

/* ============================================================
   SOCIETE.COM (entreprises FR)
   ============================================================ */
async function checkSociete(fullName) {
  try {
    const url = `https://www.societe.com/cgi-bin/search?champs=${encodeURIComponent(fullName)}`;
    const r = await P(url);
    if (r.status !== 200) return { found:false, hits:[] };
    const html = await r.text();
    const found = containsName(html, fullName);
    if (found) {
      return { found:true, hits:[{ title:"Résultats sur Societe.com", url:`https://www.societe.com/cgi-bin/search?champs=${encodeURIComponent(fullName)}` }] };
    }
    return { found:false, hits:[] };
  } catch {
    return { found:false, hits:[] };
  }
}

/* ============================================================
   API BRIXHUB — RECHERCHE PRÉNOM NOM
   Endpoint : https://api.brixhub.to/api/v1/search
   Clé API : à insérer dans BRIXHUB_API_KEY
   ============================================================ */
const BRIXHUB_API_KEY = "brix_kTDklqpV-orjSqnZ9mFSU7YqkzCdJVFJhY4Ka1Rni71WWoIh";
const BRIXHUB_URL = "https://api.brixhub.to/api/v1/search";

async function searchBrixHub(fullName) {
  const parts = fullName.trim().split(/\s+/);
  const firstName = parts[0] || "";
  const lastName = parts.slice(1).join(" ") || "";

  const url = `${BRIXHUB_URL}?first_name=${encodeURIComponent(firstName)}&last_name=${encodeURIComponent(lastName)}`;

  const headers = {
    "Accept": "application/json",
    "Content-Type": "application/json",
    "Authorization": `Bearer ${BRIXHUB_API_KEY}`,
    "X-API-Key": BRIXHUB_API_KEY
  };

  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 12000);
    const response = await fetch(url, { method: "GET", headers, signal: controller.signal });
    clearTimeout(timer);

    if (!response.ok) {
      return { ok: false, status: response.status, data: null };
    }

    const data = await response.json();
    return { ok: true, status: response.status, data };
  } catch (err) {
    return { ok: false, status: 0, data: null, error: err.message };
  }
}

function normalizeBrixHubResults(data) {
  const hits = [];
  if (!data) return hits;

  const arr = Array.isArray(data) ? data
    : (data.results || data.data || data.items || data.records || []);

  if (!Array.isArray(arr)) return hits;

  arr.slice(0, 10).forEach(item => {
    if (typeof item === "string") {
      hits.push({ title: item, url: item });
      return;
    }
    const title =
      item.full_name ||
      item.name ||
      [item.first_name, item.last_name].filter(Boolean).join(" ") ||
      item.title ||
      item.email ||
      "Résultat BrixHub";

    const url =
      item.url ||
      item.profile_url ||
      item.link ||
      item.source_url ||
      (item.id ? `https://api.brixhub.to/api/v1/record/${item.id}` : "#");

    hits.push({ title: String(title).slice(0, 120), url });
  });

  return hits;
}

/* ============================================================
   RECHERCHE PRINCIPALE — affichage au fur et à mesure
   ============================================================ */
async function renderDeepSearch(fullName) {
  const out = document.getElementById("out");
  out.innerHTML = "";

  const dorks = buildDorks(fullName);

  const total = dorks.length + 6; // +6 pour les outils alternatifs (5 + BrixHub)
  let done = 0;
  let foundCount = 0;

  // Barre de statut
  const statusEl = document.createElement("div");
  statusEl.className = "status";
  statusEl.textContent = `0/${total} analysé…`;
  out.appendChild(statusEl);

  function updateStatus() {
    statusEl.textContent = `${done}/${total} analysé · ${foundCount} résultat(s)`;
  }

  // --- Section dorks ---
  const sectionDorks = document.createElement("div");
  sectionDorks.innerHTML = `<div class="section-title">Google Dorks — résultats filtrés par nom</div>`;
  const dorksList = document.createElement("div");
  sectionDorks.appendChild(dorksList);
  out.appendChild(sectionDorks);

  const noDorkEl = document.createElement("div");
  noDorkEl.className = "none";
  noDorkEl.textContent = "aucun dork positif";
  dorksList.appendChild(noDorkEl);

  let dorkFound = 0;

  // Lance tous les dorks en parallèle
  dorks.forEach(async (dork) => {
    const result = await searchDork(dork.q);
    done++;

    // FILTRE ANTI-FAUX-POSITIF :
    // Ne garde que les hits dont le titre OU l'URL semble lié au nom
    const relevantHits = result.hits.filter(h =>
      containsName(h.title, fullName) ||
      containsName(decodeURIComponent(h.url), fullName)
    );

    if (relevantHits.length > 0) {
      foundCount++;
      dorkFound++;
      if (dorkFound === 1) noDorkEl.remove();

      const card = document.createElement("div");
      card.className = "card dork-card";
      const hitsHtml = relevantHits.slice(0,4).map(h =>
        `<a href="${h.url}" target="_blank" rel="noopener">${escapeHtml(h.title)}</a>`
      ).join("");
      card.innerHTML = `
        <div class="dot blue"></div>
        <div class="info">
          <div class="title">${escapeHtml(dork.label)}</div>
          <div class="meta">${escapeHtml(dork.q)}</div>
          <div class="meta">${hitsHtml}</div>
        </div>
      `;
      dorksList.appendChild(card);
    }
    updateStatus();
  });

  // --- Section outils alternatifs ---
  const sectionTools = document.createElement("div");
  sectionTools.innerHTML = `<div class="section-title">Outils alternatifs</div>`;
  const toolsList = document.createElement("div");
  sectionTools.appendChild(toolsList);
  out.appendChild(sectionTools);

  // Brave Search
  runTool(toolsList, "Brave Search", async () => {
    const r = await searchBrave(`"${fullName}"`);
    return r.hits.filter(h => containsName(h.title, fullName) || containsName(decodeURIComponent(h.url), fullName));
  }).then(() => { done++; updateStatus(); });

  // Bing
  runTool(toolsList, "Bing", async () => {
    const r = await searchBing(`"${fullName}"`);
    return r.hits.filter(h => containsName(h.title, fullName) || containsName(decodeURIComponent(h.url), fullName));
  }).then(() => { done++; updateStatus(); });

  // Wayback Machine
  runTool(toolsList, "Wayback Machine (archives)", async () => {
    const r = await checkWayback(fullName);
    return r.hits;
  }).then(() => { done++; updateStatus(); });

  // Google Scholar
  runTool(toolsList, "Google Scholar (publications)", async () => {
    const r = await checkScholar(fullName);
    return r.hits;
  }).then(() => { done++; updateStatus(); });

  // Doctolib (santé FR)
  runTool(toolsList, "Doctolib", async () => {
    const r = await checkDoctolib(fullName);
    return r.hits;
  }).then(() => { done++; updateStatus(); });

  // BrixHub API (prénom + nom)
  runTool(toolsList, "BrixHub API (prénom + nom)", async () => {
    const res = await searchBrixHub(fullName);
    if (!res.ok) {
      console.warn("[BrixHub] échec requête", res.status, res.error || "");
      return [];
    }
    const hits = normalizeBrixHubResults(res.data);
    return hits.filter(h =>
      containsName(h.title, fullName) ||
      containsName(decodeURIComponent(h.url), fullName)
    );
  }).then(() => { done++; updateStatus(); });

  // Fonction utilitaire pour lancer un outil et afficher son résultat
  async function runTool(container, label, fn) {
    try {
      const hits = await fn();
      if (hits && hits.length > 0) {
        foundCount++;
        const card = document.createElement("div");
        card.className = "card tool-card";
        const hitsHtml = hits.slice(0,4).map(h =>
          `<a href="${h.url}" target="_blank" rel="noopener">${escapeHtml(h.title)}</a>`
        ).join("");
        card.innerHTML = `
          <div class="dot orange"></div>
          <div class="info">
            <div class="title">${escapeHtml(label)}</div>
            <div class="meta">${hitsHtml}</div>
          </div>
        `;
        container.appendChild(card);
      }
    } catch {}
  }
}

/* ============================================================
   UTILITAIRES
   ============================================================ */
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

function validate(t) {
  t = (t || "").trim();
  if (t.length < 3) return false;
  return /^[a-zA-ZÀ-ÿ'\- ]{2,}$/.test(t);
}

/* ============================================================
   EVENT
   ============================================================ */
document.getElementById("go").addEventListener("click", () => {
  const target = document.getElementById("target").value;
  const out = document.getElementById("out");
  const btn = document.getElementById("go");

  if (!validate(target)) {
    out.innerHTML = `<div class="none">entre un prénom et un nom valides</div>`;
    return;
  }

  btn.disabled = true;
  btn.textContent = "Recherche en cours…";

  renderDeepSearch(target.trim()).finally(() => {
    btn.disabled = false;
    btn.textContent = "Rechercher";
  });
});

document.getElementById("target").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("go").click();
});
</script>
